function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function select(n){sel=n;const el=document.getElementById('info');if(!n){el.classList.remove('on');return}
 const out=edges.filter(e=>e.s===n).map(e=>[e.t,e.rel,'→']),inn=edges.filter(e=>e.t===n).map(e=>[e.s,e.rel,'←']);
 const tn=TYPES.find(t=>t.id===n.type).name;
 let h='<h2>'+esc(n.label)+'</h2><div class="t">'+esc(tn)+(n.file?' · '+esc(n.file)+(n.line?':'+n.line:''):'')+'</div>';
 if(n.desc)h+='<p>'+esc(n.desc)+'</p>';
 const list=(a,t)=>a.length?'<b>'+t+' ('+a.length+')</b><ul>'+a.map(([m,rel,ar],i)=>'<li data-id="'+esc(m.id)+'">'+ar+' '+esc(m.label)+' <small>'+esc(rel||'')+'</small></li>').join('')+'</ul>':'';
 h+=list(out,'Kullandıkları')+list(inn,'Kullananlar');
 document.getElementById('ib').innerHTML=h;el.classList.add('on');
 el.querySelectorAll('li').forEach(li=>li.onclick=()=>{const m=byId[li.dataset.id];if(m){cam.x=-m.x*cam.k;cam.y=-m.y*cam.k;select(m)}})}
document.getElementById('close').onclick=()=>select(null);
document.getElementById('q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase()});
const chips=document.getElementById('chips');
TYPES.forEach(t=>{const c=document.createElement('button');c.className='chip';c.innerHTML='<i style="background:'+t.color+'"></i>'+esc(t.name)+' <span style="color:var(--mut)">'+nodes.filter(n=>n.type===t.id).length+'</span>';
 c.onclick=()=>{hidden.has(t.id)?hidden.delete(t.id):hidden.add(t.id);c.classList.toggle('off');alpha=.6};chips.appendChild(c)});
document.getElementById('sub').textContent=nodes.length+' düğüm · '+edges.length+' bağlantı';
document.getElementById('stat').textContent='Sürükle: taşı · Tekerlek/çimdik: yakınlaştır · Dokun: ayrıntı';
loop();
</script></body></html>
