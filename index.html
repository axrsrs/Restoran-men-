<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>NearMenu</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:#0b0b0c;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
html{scroll-behavior:smooth}
body{
 min-height:100vh;
 overflow-x:hidden;
 font-size:13px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --accent:#d6a83d;
 --accent2:#f0c45a;
 --text:#fff;
 --muted:#929296;
 --price:#f0c45a;
 --card:#151517;
 --cardText:#fff;
 --line:#29292d;
 --overlay:.55;
 --cardOpacity:.94;
 --cardRadius:20px;
 --titleSize:34px;
 --bodySize:13px;
 --logoSize:112px;
 --fontFamily:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 --titleFont:Georgia,serif;
}

body{font-family:var(--fontFamily);color:var(--text);font-size:var(--bodySize)}
#app{min-height:100vh}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{
 from{opacity:0}
 to{opacity:1}
}

@keyframes pageIn{
 from{
  opacity:0;
  transform:translateY(12px);
 }
 to{
  opacity:1;
  transform:none;
 }
}

@keyframes cardIn{
 from{
  opacity:0;
  transform:translateY(18px) scale(.985);
 }
 to{
  opacity:1;
  transform:none;
 }
}

@keyframes popupIn{
 from{
  opacity:0;
  transform:translateY(-6px) scale(.97);
 }
 to{
  opacity:1;
  transform:none;
 }
}

@keyframes drawerIn{
 from{transform:translateX(-100%);opacity:.5}
 to{transform:none;opacity:1}
}

@keyframes modalUp{
 from{
  opacity:0;
  transform:translateY(100%);
 }
 to{
  opacity:1;
  transform:none;
 }
}

@keyframes adminIn{
 from{transform:translateX(100%);opacity:.7}
 to{transform:none;opacity:1}
}

@keyframes pulseSoft{
 0%,100%{box-shadow:0 0 0 0 rgba(214,168,61,0)}
 50%{box-shadow:0 0 0 6px rgba(214,168,61,.07)}
}

.pageContent{
 animation:pageIn .28s ease both;
}

.section{
 animation:pageIn .32s ease both;
}

.product,
.category,
.feature,
.event{
 animation:cardIn .38s ease both;
}

.product:nth-child(2),
.category:nth-child(2),
.feature:nth-child(2),
.event:nth-child(2){animation-delay:.035s}

.product:nth-child(3),
.category:nth-child(3),
.feature:nth-child(3),
.event:nth-child(3){animation-delay:.07s}

.product:nth-child(4),
.category:nth-child(4),
.feature:nth-child(4),
.event:nth-child(4){animation-delay:.105s}

button,
a,
input,
select,
textarea{
 transition:
  transform .18s ease,
  background-color .18s ease,
  border-color .18s ease,
  color .18s ease,
  box-shadow .18s ease,
  opacity .18s ease;
}

button:active{
 transform:scale(.965);
}

.category:active,
.feature:active,
.event:active,
.product:active{
 transform:scale(.985);
}

/* =========================
   BACKGROUND
========================= */

.background{
 position:fixed;
 inset:0;
 z-index:-10;
 overflow:hidden;
 background:#0b0b0c;
 transition:background .35s ease;
}

.background img,
.background video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.backgroundOverlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,var(--overlay));
 transition:background .35s ease;
}

/* =========================
   CONTAINER
========================= */

.container{
 width:100%;
 max-width:650px;
 margin:auto;
 padding:0 16px 80px;
}

/* =========================
   TOP BAR
========================= */

.top{
 position:sticky;
 top:0;
 z-index:90;
 padding:11px 0;
 background:rgba(10,10,11,.82);
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 border-bottom:1px solid rgba(255,255,255,.04);
}

.topRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.topRight{
 display:flex;
 align-items:center;
 gap:7px;
 position:relative;
}

.iconBtn{
 width:43px;
 height:43px;
 flex:0 0 43px;
 border:1px solid rgba(255,255,255,.08);
 border-radius:50%;
 background:rgba(25,25,27,.92);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
}

.iconBtn:hover{
 background:#29292d;
 border-color:rgba(255,255,255,.16);
}

.currencyBtn{
 height:43px;
 min-width:49px;
 padding:0 15px;
 border:1px solid rgba(255,255,255,.06);
 border-radius:23px;
 background:var(--accent);
 color:#111;
 font-weight:950;
 box-shadow:0 7px 22px rgba(0,0,0,.22);
}

.currencyBtn:hover{
 filter:brightness(1.08);
}

.languageBtn{
 font-size:10px;
 font-weight:900;
 letter-spacing:.02em;
}

.searchBox{
 margin-top:9px;
 animation:pageIn .2s ease;
}

.searchBox input{
 width:100%;
 padding:14px 16px;
 border-radius:15px;
 border:1px solid rgba(255,255,255,.08);
 background:#151517;
 color:#fff;
 outline:none;
}

.searchBox input:focus{
 border-color:var(--accent);
 box-shadow:0 0 0 3px rgba(214,168,61,.10);
}

/* =========================
   POPUPS
========================= */

.quickPopup{
 position:absolute;
 right:0;
 top:51px;
 width:185px;
 padding:7px;
 border:1px solid rgba(255,255,255,.11);
 border-radius:16px;
 background:rgba(20,20,22,.97);
 box-shadow:0 22px 60px rgba(0,0,0,.65);
 backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px);
 z-index:500;
 animation:popupIn .18s ease both;
}

.quickPopup button{
 width:100%;
 min-height:43px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:10px 12px;
 margin:2px 0;
 border:0;
 border-radius:11px;
 background:transparent;
 color:#aaa;
 text-align:left;
 font-size:12px;
 font-weight:800;
}

.quickPopup button:hover{
 background:#262629;
 color:#fff;
}

.quickPopup button.active{
 background:var(--accent);
 color:#111;
}

/* =========================
   HERO
========================= */

.hero{
 text-align:center;
 padding:48px 0 28px;
 animation:pageIn .45s ease both;
}

.logo{
 width:var(--logoSize);
 height:var(--logoSize);
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 border:1px solid var(--accent);
 background:rgba(15,15,16,.94);
 color:var(--accent);
 font:42px Georgia,serif;
 box-shadow:
  0 0 0 7px rgba(214,168,61,.035),
  0 0 55px rgba(214,168,61,.15);
 overflow:hidden;
 transition:
  width .3s ease,
  height .3s ease,
  box-shadow .3s ease,
  border-color .3s ease;
}

.logo img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.welcome{
 margin-top:18px;
 color:var(--accent2);
 font-size:9px;
 font-weight:950;
 letter-spacing:.34em;
}

.hero h1{
 margin:10px 0 7px;
 color:var(--text);
 font:700 var(--titleSize) var(--titleFont);
 line-height:1.05;
 letter-spacing:-.03em;
 transition:font-size .3s ease;
}

.hero p{
 max-width:480px;
 margin:0 auto;
 color:var(--muted);
 font-size:var(--bodySize);
 line-height:1.6;
}

/* =========================
   SECTION
========================= */

.section{
 margin-top:31px;
}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:14px;
}

.sectionHead h2{
 margin:0;
 font-size:20px;
 letter-spacing:-.02em;
}

.hint{
 color:#666;
 font-size:10px;
}

/* =========================
   HORIZONTAL
========================= */

.horizontal{
 display:flex;
 gap:13px;
 overflow-x:auto;
 scrollbar-width:none;
 scroll-snap-type:x mandatory;
 padding:3px 0 6px;
}

.horizontal::-webkit-scrollbar{
 display:none;
}

/* =========================
   FEATURE
========================= */

.feature{
 position:relative;
 flex:0 0 88%;
 height:235px;
 padding:0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
 box-shadow:0 18px 50px rgba(0,0,0,.30);
 color:#fff;
}

.feature img,
.feature video{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .5s ease;
}

.feature:hover img,
.feature:hover video{
 transform:scale(1.035);
}

.featureShade{
 position:absolute;
 inset:0;
 background:
  linear-gradient(
   180deg,
   transparent 20%,
   rgba(0,0,0,.12) 45%,
   rgba(0,0,0,.92) 100%
  );
}

.featureText{
 position:absolute;
 left:18px;
 right:18px;
 bottom:17px;
 text-align:left;
}

.featureText strong{
 display:block;
 font-size:20px;
}

.featureText span{
 display:block;
 margin-top:6px;
 color:var(--price);
 font-weight:950;
}

/* =========================
   EVENTS
========================= */

.event{
 position:relative;
 flex:0 0 88%;
 height:200px;
 padding:0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
 color:#fff;
}

.event img,
.event video{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .5s ease;
}

.event:hover img,
.event:hover video{
 transform:scale(1.035);
}

.eventShade{
 position:absolute;
 inset:0;
 background:
  linear-gradient(
   180deg,
   transparent 15%,
   rgba(0,0,0,.92)
  );
}

.eventDate{
 position:absolute;
 top:12px;
 left:12px;
 padding:8px 11px;
 border-radius:20px;
 background:rgba(0,0,0,.72);
 color:var(--accent2);
 font-size:10px;
 backdrop-filter:blur(10px);
}

.eventText{
 position:absolute;
 left:17px;
 right:17px;
 bottom:15px;
 text-align:left;
}

.eventText strong{
 font-size:18px;
}

.eventText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:11px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px;
}

.category{
 position:relative;
 height:170px;
 padding:0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 box-shadow:0 14px 38px rgba(0,0,0,.20);
 color:#fff;
}

.category img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .5s ease;
}

.category:hover img{
 transform:scale(1.045);
}

.categoryShade{
 position:absolute;
 inset:0;
 background:
  linear-gradient(
   180deg,
   transparent 10%,
   rgba(0,0,0,.94)
  );
}

.categoryText{
 position:absolute;
 left:15px;
 right:15px;
 bottom:15px;
 text-align:left;
}

.categoryText strong{
 display:block;
 font-size:18px;
}

.categoryText span{
 display:block;
 color:#aaa;
 font-size:10px;
 margin-top:4px;
}

/* =========================
   CATEGORY PAGE
========================= */

.categoryTitle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:13px;
}

.backBtn{
 border:1px solid rgba(255,255,255,.07);
 background:#1b1b1e;
 color:#fff;
 padding:10px 13px;
 border-radius:11px;
 font-size:11px;
 font-weight:850;
}

.backBtn:hover{
 background:#29292d;
}

.stickyCategories{
 position:sticky;
 top:68px;
 z-index:35;
 margin:0 -16px;
 padding:10px 16px;
 background:rgba(11,11,12,.94);
 backdrop-filter:blur(17px);
 -webkit-backdrop-filter:blur(17px);
 border-bottom:1px solid #202023;
}

.categoryTabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 scrollbar-width:none;
}

.categoryTabs::-webkit-scrollbar{
 display:none;
}

.categoryTabs button{
 flex:0 0 auto;
 padding:10px 14px;
 border:0;
 border-radius:11px;
 background:#18181a;
 color:#aaa;
 font-size:11px;
 font-weight:850;
}

.categoryTabs button:hover{
 background:#28282b;
 color:#fff;
}

.categoryTabs button.active{
 background:var(--accent);
 color:#111;
}

/* =========================
   PRODUCTS
========================= */

.products{
 display:flex;
 flex-direction:column;
 gap:12px;
 margin-top:16px;
}

.product{
 display:grid;
 grid-template-columns:120px 1fr;
 min-height:122px;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.07);
 border-radius:var(--cardRadius);
 background:rgba(20,20,22,var(--cardOpacity));
 cursor:pointer;
 box-shadow:0 13px 35px rgba(0,0,0,.18);
 transition:
  transform .2s ease,
  box-shadow .2s ease,
  border-color .2s ease;
}

.product:hover{
 border-color:rgba(255,255,255,.14);
 box-shadow:0 18px 45px rgba(0,0,0,.27);
}

.productImage{
 height:122px;
 background:#1c1c1e;
 overflow:hidden;
}

.productImage img,
.productImage video{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .5s ease;
}

.product:hover .productImage img,
.product:hover .productImage video{
 transform:scale(1.05);
}

.productInfo{
 min-width:0;
 padding:13px;
}

.productInfo h3{
 margin:0;
 color:var(--cardText);
 font-size:15px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.productInfo p{
 margin:6px 0;
 color:#929292;
 font-size:11px;
 line-height:1.45;
 display:-webkit-box;
 -webkit-line-clamp:2;
 -webkit-box-orient:vertical;
 overflow:hidden;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

.tag{
 padding:4px 7px;
 border-radius:7px;
 background:#222225;
 color:#aaa;
 font-size:9px;
}

.tag.sold{
 background:#7f1d1d;
 color:#fff;
}

.price{
 margin-top:8px;
 color:var(--price);
 font-weight:950;
 font-size:14px;
}

/* =========================
   DRAWER
========================= */

.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(6px);
 -webkit-backdrop-filter:blur(6px);
 animation:fadeIn .2s ease;
}

.drawer{
 width:min(88%,390px);
 height:100%;
 overflow:auto;
 padding:20px;
 background:#101011;
 box-shadow:10px 0 50px #000;
 animation:drawerIn .25s cubic-bezier(.2,.8,.2,1);
}

.drawerHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.drawerLogo{
 color:var(--accent);
 font:700 25px Georgia,serif;
}

.drawerSection{
 margin-top:25px;
}

.drawerLabel{
 color:#666;
 font-size:10px;
 letter-spacing:.15em;
 margin-bottom:8px;
}

.drawerLink{
 display:block;
 width:100%;
 border:0;
 background:#18181a;
 color:#aaa;
 padding:13px;
 border-radius:10px;
 font-size:11px;
 text-align:left;
 margin-top:7px;
}

.drawerLink:hover{
 background:#28282b;
 color:#fff;
}

/* =========================
   MODAL
========================= */

.modalOverlay{
 position:fixed;
 inset:0;
 z-index:150;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.76);
 backdrop-filter:blur(7px);
 -webkit-backdrop-filter:blur(7px);
 animation:fadeIn .2s ease;
}

.modal{
 width:min(100%,650px);
 max-height:92vh;
 overflow:auto;
 border-radius:27px 27px 0 0;
 background:#101011;
 box-shadow:0 -15px 60px rgba(0,0,0,.5);
 animation:modalUp .28s cubic-bezier(.2,.8,.2,1);
}

.modalImage{
 position:relative;
 height:310px;
 background:#18181a;
}

.modalImage img,
.modalImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.closeBtn{
 position:absolute;
 top:13px;
 right:13px;
 width:41px;
 height:41px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.72);
 color:#fff;
 font-size:23px;
}

.closeBtn:hover{
 background:#000;
 transform:rotate(4deg);
}

.modalBody{
 padding:21px;
}

.modalBody h2{
 margin:0;
 font-size:27px;
 letter-spacing:-.03em;
}

.modalBody p{
 color:#999;
 font-size:13px;
 line-height:1.65;
}

.infoRow{
 display:flex;
 justify-content:space-between;
 gap:20px;
 padding:13px 0;
 border-bottom:1px solid #252527;
 font-size:12px;
}

.infoRow span:last-child{
 color:#ddd;
 text-align:right;
}

.modalPrice{
 margin-top:18px;
 color:var(--price);
 font-size:26px;
 font-weight:950;
}

/* =========================
   ADMIN
========================= */

.adminOverlay{
 position:fixed;
 inset:0;
 z-index:250;
 background:rgba(0,0,0,.82);
 display:flex;
 justify-content:flex-end;
 animation:fadeIn .2s ease;
}

.admin{
 width:min(100%,650px);
 height:100%;
 overflow:auto;
 background:#0e0e0f;
 animation:adminIn .28s cubic-bezier(.2,.8,.2,1);
}

.adminHeader{
 position:sticky;
 top:0;
 z-index:20;
 padding:15px;
 background:rgba(14,14,15,.98);
 border-bottom:1px solid var(--line);
 backdrop-filter:blur(15px);
 -webkit-backdrop-filter:blur(15px);
}

.adminTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.adminTitle{
 display:flex;
 align-items:center;
 gap:9px;
}

.adminTitleIcon{
 width:34px;
 height:34px;
 border-radius:10px;
 background:var(--accent);
 color:#111;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:950;
}

.adminTabs{
 display:flex;
 gap:6px;
 margin-top:12px;
}

.adminTabs button{
 flex:1;
 padding:11px 7px;
 border:0;
 border-radius:10px;
 background:#19191b;
 color:#888;
 font-size:11px;
}

.adminTabs button.active{
 background:var(--accent);
 color:#111;
 font-weight:950;
}

.adminBody{
 padding:16px;
}

.field{
 margin-bottom:13px;
}

.field label{
 display:block;
 margin-bottom:6px;
 color:#777;
 font-size:10px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:12px;
 border:1px solid #303034;
 border-radius:11px;
 background:#171719;
 color:#fff;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:var(--accent);
 box-shadow:0 0 0 3px rgba(214,168,61,.08);
}

.field textarea{
 min-height:82px;
 resize:vertical;
}

.adminCard{
 padding:15px;
 margin-bottom:12px;
 border:1px solid var(--line);
 border-radius:16px;
 background:#151517;
 animation:pageIn .25s ease both;
}

.adminCardTitle{
 font-size:15px;
 font-weight:900;
 margin-bottom:5px;
}

.adminButton{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 background:#202023;
 color:#fff;
 font-size:11px;
 font-weight:850;
}

.adminButton:hover{
 background:#2c2c30;
}

.adminButton.gold{
 background:var(--accent);
 color:#111;
}

.adminButton.gold:hover{
 filter:brightness(1.08);
}

.adminButton.danger{
 background:#7f1d1d;
 color:#fff;
}

.saveBar{
 position:sticky;
 bottom:0;
 padding:12px 16px;
 background:rgba(14,14,15,.98);
 border-top:1px solid var(--line);
 z-index:20;
 backdrop-filter:blur(15px);
 -webkit-backdrop-filter:blur(15px);
}

.row{
 display:flex;
 gap:8px;
}

.row>*{
 flex:1;
 min-width:0;
}

.small{
 color:#777;
 font-size:10px;
 line-height:1.5;
}

.help{
 color:#777;
 font-size:10px;
 line-height:1.55;
 margin-top:5px;
}

/* =========================
   ADMIN BREADCRUMB
========================= */

.adminBreadcrumb{
 display:flex;
 align-items:center;
 gap:8px;
 margin-bottom:13px;
 padding:3px 0;
 color:#777;
 font-size:11px;
}

.adminBreadcrumb button{
 border:0;
 background:transparent;
 color:var(--accent2);
 font-size:11px;
 padding:7px 0;
}

.adminBreadcrumb strong{
 color:#fff;
}

/* =========================
   ADMIN LISTS
========================= */

.adminCategoryList,
.adminProductList{
 display:flex;
 flex-direction:column;
 gap:9px;
 margin-top:15px;
}

.adminCategoryItem,
.adminProductItem{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 border:1px solid var(--line);
 border-radius:14px;
 background:#151517;
 color:#fff;
 text-align:left;
 width:100%;
}

.adminCategoryItem:hover,
.adminProductItem:hover{
 background:#1c1c1f;
 border-color:#3a3a3e;
}

.adminCategoryThumb,
.adminProductThumb{

.adminCategoryInfo,
.adminProductInfo{

.adminProductInfo strong{

.adminCategoryInfo span,
.adminProductInfo span{

 color:#ddd;
 font-size:11px;
 font-weight:800;
 cursor:pointer;
}

.fileBtn:hover{
 background:#29292d;
}

.preview{
 width:100%;

 object-fit:cover;
 border-radius:12px;
 margin-top:8px;
 border:1px solid #303034;
}

/* =========================

========================= */

.designGrid{

}

.designCard{
 padding:12px;

}

.designCard h4{
 margin:0 0 9px;

}

.colorInput{

 padding:3px;

 border-radius:10px;
 background:#171719;
}

.presetRow{

.preset{
 width:38px;
 height:38px;

}

.preset.active{

.rangeRow{
 display:flex;
 align-items:center;

.rangeRow input{
 flex:1;

.rangeValue{
 width:48px;

}

.toggle{

 background:#18181a;
 color:#ddd;
 font-size:12px;

  const x="__near_test__";
  localStorage.setItem(x,x);
  localStorage.removeItem(x);
  return true;
 }catch(e){
  return false;
 }
}

function safeGet(key){
 if(!storageAvailable())return null;
 try{
  return localStorage.getItem(key);
 }catch(e){
  return null;
 }
}

function safeSet(key,value){
 if(!storageAvailable())return false;

 try{
  localStorage.setItem(key,value);
  return true;
 }catch(e){
  console.warn("Storage:",e);
  return false;
 }
}

/* =========================================================
   LOAD DATA
========================================================= */

try{
 const saved=safeGet(STORAGE_KEY);

 if(saved){
  mergeData(JSON.parse(saved));
 }
}catch(e){
 console.log("Veri yükleme:",e);
}

function mergeData(saved){

 if(!saved)return;

 Object.keys(saved).forEach(key=>{

  if(
   key==="theme"||
   key==="settings"||
   key==="background"||
   key==="rates"
  ){

   DATA[key]=Object.assign(
    {},
    DATA[key]||{},
    saved[key]||{}
   );

  }else{

   DATA[key]=saved[key];

  }

 });

 DATA.theme=Object.assign({
  accent:"#d6a83d",
  accent2:"#f0c45a",
  text:"#ffffff",
  cardText:"#ffffff",
  price:"#f0c45a",
  overlay:.55,
  cardOpacity:.94,
  cardRadius:20,
  logoSize:112,
  titleSize:34,
  bodySize:13,
  fontFamily:"system",
  titleFont:"Georgia"
 },DATA.theme||{});

 DATA.settings=Object.assign({
  portion:true,
  calories:true,
  allergens:true,
  spicy:true,
  sold:true,
  hours:true,
  dish:true,
  featured:true,
  events:true,
  search:true
 },DATA.settings||{});

 DATA.background=Object.assign({
  type:"color",
  value:"#0b0b0c",
  image:"",
  video:""
 },DATA.background||{});

 DATA.rates=Object.assign({
  USD:40,
  EUR:47
 },DATA.rates||{});

 if(!Array.isArray(DATA.categories))
  DATA.categories=[];

 if(!Array.isArray(DATA.events))
  DATA.events=[];

 DATA.categories.forEach(c=>{

  if(!c.id)
   c.id=uid("category");

  if(!Array.isArray(c.items))
   c.items=[];

  if(typeof c.name!=="string")
   c.name="Yeni Kategori";

  c.items.forEach(p=>{

   if(!p.id)
    p.id=uid("product");

   if(typeof p.video==="undefined")
    p.video="";

   if(typeof p.image==="undefined")
    p.image="";

   if(typeof p.description==="undefined")
    p.description="";

   if(typeof p.portion==="undefined")
    p.portion="";

   if(typeof p.calories==="undefined")
    p.calories="";

   if(typeof p.spicy==="undefined")
    p.spicy=0;

   if(typeof p.featured==="undefined")
    p.featured=false;

   if(typeof p.dish==="undefined")
    p.dish=false;

   if(typeof p.sold==="undefined")
    p.sold=false;

   if(typeof p.price==="undefined")
    p.price=0;

   if(!Array.isArray(p.allergens))
    p.allergens=[];

   if(!p.names)
    p.names={};

   if(!p.descriptions)
    p.descriptions={};

   if(!p.names.tr)
    p.names.tr=p.name;

   if(!p.descriptions.tr)
    p.descriptions.tr=p.description;

  });

 });

 DATA.events.forEach(e=>{

  if(!e.id)
   e.id=uid("event");

  if(typeof e.video==="undefined")
   e.video="";

  if(typeof e.name==="undefined")
   e.name="Yeni Etkinlik";

  if(typeof e.description==="undefined")
   e.description="";

 });

}

function allProducts(){

 (DATA.categories||[]).forEach(category=>{

  (category.items||[]).forEach(item=>{

   result.push(
    Object.assign({},item,{
     categoryId:category.id,
     categoryName:category.name
    })
   );

  });

 });

 return result;
}

function findProduct(id){

 for(const category of DATA.categories||[]){

  const product=(category.items||[])
   .find(p=>p.id===id);

  if(product)return product;
 }

 return null;
}

function findCategory(id){
 return (DATA.categories||[])
  .find(c=>c.id===id)||null;
}

function findEvent(id){
 return (DATA.events||[])
  .find(e=>e.id===id)||null;
}

function money(price){

 const value=Number(price)||0;

 if(currency==="USD"){

  const rate=Number(DATA.rates.USD)||40;

  return "$"+(value/rate).toFixed(2);
 }

 if(currency==="EUR"){

  const rate=Number(DATA.rates.EUR)||47;

  return "€"+(value/rate).toFixed(2);
 }

 return Math.round(value)
  .toLocaleString("tr-TR")+" ₺";
}

function uid(prefix){
 return prefix+
  "-"+
  Date.now()+
  "-"+
  Math.random()
   .toString(36)
   .slice(2,7);
}

let savedScrollY=0;

function rememberScroll(){
 savedScrollY=window.scrollY||window.pageYOffset||0;
}

function restoreScroll(delay=0){

 const y=savedScrollY;

 setTimeout(()=>{

  window.scrollTo({
   top:y,
   left:0,
   behavior:"instant"
  });

 },delay);
}

/* =========================================================
   AUTOMATIC TRANSLATION
========================================================= */

/*
 Bu bölüm Türkçe metinleri otomatik olarak
 İngilizce ve Arapçaya çevirir.

 Çeviriler localStorage'da cache'lenir.
 Böylece aynı metin tekrar tekrar çevrilmez.

 Not:
 Google Translate'in public endpoint'i resmi API değildir.
 Gerçek ticari kullanımda Supabase Edge Function
 üzerinden resmi bir çeviri API'sine geçirilmesi önerilir.
*/

function getTranslationCache(){

 try{
  return JSON.parse(
   safeGet(TRANSLATION_CACHE_KEY)||"{}"
  );
 }catch(e){
  return {};
 }
}

function saveTranslationCache(cache){
 safeSet(
  TRANSLATION_CACHE_KEY,
  JSON.stringify(cache)
 );
}

async function translateText(text,target){

 if(!text||target==="tr")
  return text||"";

 const cache=getTranslationCache();

 const key=
  "tr|"+
  target+
  "|"+
  text.trim();

 if(cache[key])
  return cache[key];

 try{

  const url=
   "https://translate.googleapis.com/translate_a/single"+
   "?client=gtx"+
   "&sl=tr"+
   "&tl="+encodeURIComponent(target)+
   "&dt=t"+
   "&q="+encodeURIComponent(text);

  const response=
   await fetch(url);

  if(!response.ok)
   throw new Error("Translation failed");

  const data=
   await response.json();

  let result="";

  if(Array.isArray(data?.[0])){

   data[0].forEach(part=>{
    if(part?.[0])
     result+=part[0];
   });

  }

  result=result.trim();

  if(result){

   cache[key]=result;
   saveTranslationCache(cache);

   return result;
  }

 }catch(e){

  console.warn(
   "Otomatik çeviri başarısız:",
   e
  );

 }

 return text;
}

async function translateProduct(item){

 if(!item)return;

 if(!item.names)
  item.names={};

 if(!item.descriptions)
  item.descriptions={};

 item.names.tr=item.name||"";
 item.descriptions.tr=item.description||"";

 if(language==="tr")
  return;

 translating=true;
 render();

 const target=
  language==="en"
  ?"en"
  :"ar";

 const [
  translatedName,
  translatedDescription
 ]=await Promise.all([
  translateText(item.name,target),
  translateText(item.description,target)
 ]);

 item.names[target]=translatedName||item.name;
 item.descriptions[target]=
  translatedDescription||item.description;

 translating=false;

 saveData();

 render();
}

async function translateEverything(){

 if(language==="tr")
  return;

 translating=true;
 render();

 const target=
  language==="en"
  ?"en"
  :"ar";

 try{

  for(const category of DATA.categories){

   if(!category.names)
    category.names={};

   category.names.tr=
    category.name||"";

   if(!category.names[target]){

    category.names[target]=
     await translateText(
      category.name,
      target
     );

   }

   for(const item of category.items||[]){

    if(!item.names)
     item.names={};

    if(!item.descriptions)
     item.descriptions={};

    item.names.tr=
     item.name||"";

    item.descriptions.tr=
     item.description||"";

    if(!item.names[target]){

     item.names[target]=
      await translateText(
       item.name,
       target
      );

    }

    if(!item.descriptions[target]){

     item.descriptions[target]=
      await translateText(
       item.description,
       target
      );

    }

   }

  }

  for(const event of DATA.events){

   if(!event.names)
    event.names={};

   if(!event.descriptions)
    event.descriptions={};

   event.names.tr=event.name||"";
   event.descriptions.tr=event.description||"";

   if(!event.names[target]){

    event.names[target]=
     await translateText(
      event.name,
      target
     );

   }

   if(!event.descriptions[target]){

    event.descriptions[target]=
     await translateText(
      event.description,
      target
     );

   }

  }

  saveData();

 }catch(e){

  console.warn(
   "Toplu çeviri:",
   e
  );

 }

 translating=false;
 render();
}

  .toLocaleLowerCase(language==="tr"?"tr":"en");

  .filter(item=>{

   const text=[
    item.name,
    localizedName(item),
    item.description,
    localizedDescription(item),

     findCategory(item.categoryId)

     language==="tr"?"tr":"en"

function fileField(type,id,label,value,accept){

 const isVideo=
  type==="productVideo"||
  type==="eventVideo"||
  type==="backgroundVideo";

 return `
 <div class="field">

  <label>${label}</label>

  <div class="fileBox">

   <label class="fileBtn">

    📁 ${t("image")} ${isVideo?" / "+t("video"):""}

    <input
     hidden
     type="file"
     accept="${accept}"
     data-file-type="${type}"
     data-file-id="${esc(id)}">

   </label>

   ${
    value
    ?
    `<button
     type="button"
     class="fileBtn"
     data-clear-file="${type}|${esc(id)}">
     Temizle
    </button>`
    :
    ""
   }

  </div>

  ${
   value
   ?
   isVideo
   ?
   `<video
    class="preview"
    controls
    src="${esc(value)}"></video>`
   :
   `<img
    class="preview"
    src="${esc(value)}"
    alt="">`
   :
   `<div class="help">
    Henüz dosya seçilmedi.
   </div>`
  }

 </div>
 `;

}

function collectAdmin(){

 document
 .querySelectorAll("[data-admin]")
 .forEach(input=>{

  const key=input.dataset.admin;
  const value=input.value;

  if(key==="businessName")
   DATA.name=value;

  else if(key==="subtitle")
   DATA.subtitle=value;

  else if(key==="phone")
   DATA.phone=value;

  else if(key==="whatsapp")
   DATA.whatsapp=value;

  else if(key==="hours")
   DATA.hours=value;

  else if(key==="rateUSD")
   DATA.rates.USD=
    Number(value)||0;

  else if(key==="rateEUR")
   DATA.rates.EUR=
    Number(value)||0;

  else if(key==="fontFamily")
   DATA.theme.fontFamily=value;

  else if(key==="titleFont")
   DATA.theme.titleFont=value;

  else if(key.startsWith("categoryName-")){

   const id=
    key.replace("categoryName-","");

   const category=findCategory(id);

   if(category){

    category.name=value;

    if(!category.names)
     category.names={};

    category.names.tr=value;

   }

  }

  else if(key.startsWith("productName-")){

   const id=
    key.replace("productName-","");

   const item=findProduct(id);

   if(item){

    item.name=value;

    if(!item.names)
     item.names={};

    item.names.tr=value;

   }

  }

  else if(key.startsWith("productDescription-")){

   const id=
    key.replace("productDescription-","");

   const item=findProduct(id);

   if(item){

    item.description=value;

    if(!item.descriptions)
     item.descriptions={};

    item.descriptions.tr=value;

   }

  }

  else if(key.startsWith("productPrice-")){

   const id=
    key.replace("productPrice-","");

   const item=findProduct(id);

   if(item)
    item.price=Number(value)||0;

  }

  else if(key.startsWith("productPortion-")){

   const id=
    key.replace("productPortion-","");

   const item=findProduct(id);

   if(item)
    item.portion=value;

  }

  else if(key.startsWith("productCalories-")){

   const id=
    key.replace("productCalories-","");

   const item=findProduct(id);

   if(item)
    item.calories=value;

  }

  else if(key.startsWith("productAllergens-")){

   const id=
    key.replace("productAllergens-","");

   const item=findProduct(id);

   if(item){

    item.allergens=
     value
     .split(",")
     .map(x=>x.trim())
     .filter(Boolean);

   }

  }

  else if(key.startsWith("productSpicy-")){

   const id=
    key.replace("productSpicy-","");

   const item=findProduct(id);

   if(item){

    item.spicy=Math.max(
     0,
     Math.min(
      5,
      Number(value)||0
     )
    );

   }

  }

  else if(key.startsWith("eventName-")){

   const id=
    key.replace("eventName-","");

   const event=findEvent(id);

   if(event){

    event.name=value;

    if(!event.names)
     event.names={};

    event.names.tr=value;

   }

  }

  else if(key.startsWith("eventDate-")){

   const id=
    key.replace("eventDate-","");

   const event=findEvent(id);

   if(event)
    event.date=value;

  }

  else if(key.startsWith("eventTime-")){

   const id=
    key.replace("eventTime-","");

   const event=findEvent(id);

   if(event)
    event.time=value;

  }

  else if(key.startsWith("eventDescription-")){

   const id=
    key.replace("eventDescription-","");

   const event=findEvent(id);

   if(event){

    event.description=value;

    if(!event.descriptions)
     event.descriptions={};

    event.descriptions.tr=value;

   }

  }

 });

}

   FILE HANDLING
========================================================= */

function readFileAsDataURL(file,callback){

 const reader=new FileReader();

 reader.onload=()=>{
  callback(reader.result);
 };

 reader.onerror=()=>{
  alert("Dosya okunamadı.");
 };

 reader.readAsDataURL(file);
}

function handleFile(type,id,file){

 if(!file)return;

 const maxImage=8*1024*1024;
 const maxVideo=20*1024*1024;

 const isVideo=
  file.type.startsWith("video/");

 if(
  isVideo &&
  file.size>maxVideo
 ){

  alert(
   "Video en fazla 20 MB olabilir."
  );

  return;
 }

 if(
  !isVideo &&
  file.size>maxImage
 ){

  alert(
   "Fotoğraf en fazla 8 MB olabilir."
  );

  return;
 }

 readFileAsDataURL(
  file,
  data=>{

   if(type==="logo")
    DATA.logo=data;

   else if(type==="backgroundImage"){

    DATA.background.image=data;
    DATA.background.type="image";

   }

   else if(type==="backgroundVideo"){

    DATA.background.video=data;
    DATA.background.type="video";

   }

   else if(type==="categoryImage"){

    const category=findCategory(id);

    if(category)
     category.image=data;

   }

   else if(type==="productImage"){

    const item=findProduct(id);

    if(item)
     item.image=data;

   }

   else if(type==="productVideo"){

    const item=findProduct(id);

    if(item)
     item.video=data;

   }

   else if(type==="eventImage"){

    const event=findEvent(id);

    if(event)
     event.image=data;

   }

   else if(type==="eventVideo"){

    const event=findEvent(id);

    if(event)
     event.video=data;

   }

   saveData();
   render();

  }
 );

}

 );

 root.style.setProperty(

 root.style.setProperty(

 );

 );

function resolveFont(font){

 if(font==="system"||!font){
  return '-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif';
 }

 return font;
}

/* =========================================================
   EVENT BINDING
========================================================= */

function bindEvents(){

 /*
  Eski kodda her render() sonrasında document'a
  yeni click listener ekleniyordu.

  Bu da zamanla gereksiz listener birikmesine neden oluyordu.

  Burada sadece tek global listener kullanıyoruz.
 */

 if(!window.nearMenuOutsideHandler){

  window.nearMenuOutsideHandler=function(e){

   if(
    !e.target.closest("#currencyButton") &&
    !e.target.closest("[data-currency]") &&
    !e.target.closest("#languageButton") &&
    !e.target.closest("[data-language]")
   ){

    if(currencyMenu||languageMenu){

     rememberScroll();

     currencyMenu=false;
     languageMenu=false;

     render();

    }

   }

  };

  document.addEventListener(
   "click",
   window.nearMenuOutsideHandler
  );

 }

 /* DRAWER */

 $("openDrawer")?.addEventListener(
  "click",
  ()=>{
   rememberScroll();

   drawerOpen=true;
   currencyMenu=false;
   languageMenu=false;

   render();

  }
 );

 $("closeDrawer")?.addEventListener(
  "click",
  ()=>{
   rememberScroll();

   drawerOpen=false;

   render();

  }
 );

 $("drawerOverlay")?.addEventListener(
  "click",
  e=>{

   if(e.target.id==="drawerOverlay"){

    rememberScroll();

    drawerOpen=false;

    render();

   }

  }
 );

 /* CURRENCY */

 $("currencyButton")?.addEventListener(
  "click",
  e=>{

   e.stopPropagation();

   rememberScroll();

   currencyMenu=!currencyMenu;
   languageMenu=false;

   render();

  }
 );

 document
 .querySelectorAll("[data-currency]")
 .forEach(button=>{

  button.onclick=e=>{

   e.stopPropagation();

   rememberScroll();

   currency=
    button.dataset.currency;

   safeSet(
    "nearMenuCurrency",
    currency
   );

   currencyMenu=false;

   render();

  };

 });

 /* LANGUAGE */

 $("languageButton")?.addEventListener(
  "click",
  e=>{

   e.stopPropagation();

   rememberScroll();

   languageMenu=!languageMenu;
   currencyMenu=false;

   render();

  }
 );

 document
 .querySelectorAll("[data-language]")
 .forEach(button=>{

  button.onclick=async e=>{

   e.stopPropagation();

   rememberScroll();

   language=
    button.dataset.language;

   safeSet(
    "nearMenuLanguage",
    language
   );

   languageMenu=false;

   render();

   /*
    Dil değişince mevcut bütün kategoriler,
    ürünler ve etkinlikler otomatik çevrilir.
   */

   if(language!=="tr"){
    await translateEverything();
   }

 $("searchButton")?.addEventListener(
  "click",
  ()=>{

   rememberScroll();

   searchOpen=!searchOpen;

   if(!searchOpen)
    searchText="";

   setTimeout(

     const input=$("searchInput");

     if(input){

      );
     }

 );

    alert(
     "PIN sadece rakamlardan oluşmalı ve 4-12 haneli olmalı."

   }

   if(setAdminPin(newPin)){

 .querySelectorAll("[data-design]")
 .forEach(input=>{

  input.oninput=()=>{

   const key=
    input.dataset.design;

   const value=
    Number(input.value);

   if(key==="overlay")
    DATA.theme.overlay=value/100;

   else if(key==="cardOpacity")
    DATA.theme.cardOpacity=value/100;

   else
    DATA.theme[key]=value;

   const label=
    $(key+"Value");

   if(label){

    label.textContent=
     (
      key==="overlay"||
      key==="cardOpacity"
     )
     ?
     value+"%"
     :
     value+"px";

   }

   applyTheme();

  };

   const type=parts[0];

   if(type==="logo")
    DATA.logo="";

   else if(type==="backgroundImage")
    DATA.background.image="";

   else if(type==="backgroundVideo")
    DATA.background.video="";

   else if(type==="categoryImage"){

    const c=findCategory(id);

    if(c)c.image="";

   else if(type==="productImage"){

    const p=findProduct(id);

    if(p)p.image="";

    const p=findProduct(id);

    if(p)p.video="";

   else if(type==="eventImage"){

    const e=findEvent(id);

    if(e)e.image="";

    if(e)e.video="";

/* =========================================================
   GENERATE MISSING TRANSLATIONS
========================================================= */

async function generateMissingTranslations(item){

 if(!item)return;

 if(!item.names)
  item.names={};

 if(!item.descriptions)
  item.descriptions={};

 item.names.tr=item.name||"";
 item.descriptions.tr=item.description||"";

 translating=true;
 render();

 for(const target of ["en","ar"]){

  if(!item.names[target]){

   item.names[target]=
    await translateText(
     item.name,
     target
    );

  }

  if(!item.descriptions[target]){

   item.descriptions[target]=
    await translateText(
     item.description,
     target
    );

  }

 }

 translating=false;

 saveData();

}
