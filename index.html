<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>NearMenu Premium</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:#09090b;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
 min-height:100vh;
 overflow-x:hidden;
 font-size:13px;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --accent:#d6a83d;
 --accent2:#f0c45a;
 --text:#fff;
 --muted:#929296;
 --price:#f0c45a;
 --card:#151517;
 --line:#29292d;
 --overlay:.55;
 --cardOpacity:.94;
 --cardRadius:20px;
 --titleSize:34px;
 --bodySize:13px;
 --logoSize:112px;
 --fontFamily:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 --titleFont:Georgia,serif;
}

body{
 font-family:var(--fontFamily);
 color:var(--text);
 font-size:var(--bodySize);
}

html{scroll-behavior:smooth}

.background{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 z-index:0;
 overflow:hidden;
 background:#0b0b0c;
 pointer-events:none;
}

.background img,
.background video{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
}

.backgroundOverlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,var(--overlay));
}

#app{
 position:relative;
 z-index:1;
 min-height:100vh;
}

@keyframes fadeIn{
 from{opacity:0}
 to{opacity:1}
}

@keyframes pageIn{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:none}
}

@keyframes cardIn{
 from{opacity:0;transform:translateY(15px) scale(.985)}
 to{opacity:1;transform:none}
}

@keyframes drawerIn{
 from{transform:translateX(-100%)}
 to{transform:none}
}

@keyframes adminIn{
 from{transform:translateX(100%);opacity:.5}
 to{transform:none;opacity:1}
}

@keyframes modalUp{
 from{opacity:0;transform:translateY(100%)}
 to{opacity:1;transform:none}
}

@keyframes pulse{
 0%,100%{opacity:1}
 50%{opacity:.45}
}

.pageContent{animation:pageIn .28s ease both}
.section{animation:pageIn .32s ease both}

.product,
.category,
.feature,
.event{
 animation:cardIn .38s ease both;
}

button,
input,
textarea,
select{
 transition:
 transform .18s ease,
 background .18s ease,
 border-color .18s ease,
 box-shadow .18s ease,
 color .18s ease;
}

button:active{transform:scale(.97)}

.container{
 position:relative;
 z-index:2;
 width:100%;
 max-width:650px;
 margin:auto;
 padding:0 16px 80px;
}

.top{
 position:sticky;
 top:0;
 z-index:90;
 padding:11px 0;
 background:rgba(10,10,11,.84);
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 border-bottom:1px solid rgba(255,255,255,.05);
}

.topRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.topRight{
 display:flex;
 align-items:center;
 gap:7px;
 position:relative;
}

.iconBtn{
 width:43px;
 height:43px;
 flex:0 0 43px;
 border:1px solid rgba(255,255,255,.09);
 border-radius:50%;
 background:rgba(25,25,27,.94);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
}

.iconBtn:hover{
 background:#29292d;
 border-color:rgba(255,255,255,.18);
}

.currencyBtn{
 height:43px;
 min-width:49px;
 padding:0 15px;
 border:1px solid rgba(255,255,255,.07);
 border-radius:23px;
 background:var(--accent);
 color:#111;
 font-weight:950;
}

.languageBtn{
 font-size:10px;
 font-weight:900;
}

.searchBox{margin-top:9px}

.searchBox input{
 width:100%;
 padding:14px 16px;
 border-radius:15px;
 border:1px solid rgba(255,255,255,.08);
 background:#151517;
 color:#fff;
 outline:none;
}

.searchBox input:focus{
 border-color:var(--accent);
 box-shadow:0 0 0 3px rgba(214,168,61,.1);
}

.quickPopup{
 position:absolute;
 right:0;
 top:51px;
 width:190px;
 padding:7px;
 border:1px solid rgba(255,255,255,.12);
 border-radius:17px;
 background:rgba(20,20,22,.98);
 box-shadow:0 25px 70px rgba(0,0,0,.7);
 backdrop-filter:blur(25px);
 z-index:500;
 animation:pageIn .18s ease;
}

.quickPopup button{
 width:100%;
 min-height:43px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px 12px;
 margin:2px 0;
 border:0;
 border-radius:11px;
 background:transparent;
 color:#aaa;
 font-size:12px;
 font-weight:800;
}

.quickPopup button:hover,
.quickPopup button.active{
 background:var(--accent);
 color:#111;
}

.hero{
 text-align:center;
 padding:52px 0 34px;
 animation:pageIn .45s ease;
}

.logo{
 width:var(--logoSize);
 height:var(--logoSize);
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 border:1px solid var(--accent);
 background:
 radial-gradient(circle at 35% 25%,rgba(255,255,255,.07),transparent 42%),
 rgba(15,15,16,.94);
 color:var(--accent);
 font:42px Georgia,serif;
 box-shadow:
 0 0 0 7px rgba(214,168,61,.035),
 0 0 55px rgba(214,168,61,.15),
 inset 0 0 30px rgba(214,168,61,.035);
 overflow:hidden;
}

.logo img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.welcome{
 margin-top:20px;
 color:var(--accent2);
 font-size:9px;
 font-weight:950;
 letter-spacing:.34em;
}

.hero h1{
 margin:11px 0 8px;
 color:var(--text);
 font:700 var(--titleSize) var(--titleFont);
 line-height:1.05;
 letter-spacing:-.035em;
}

.hero p{
 max-width:480px;
 margin:0 auto;
 color:var(--muted);
 font-size:var(--bodySize);
 line-height:1.65;
}

.section{margin-top:34px}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:15px;
}

.sectionHead h2{
 margin:0;
 font-size:20px;
 letter-spacing:-.02em;
}

.hint{
 color:#666;
 font-size:10px;
}

.horizontal{
 display:flex;
 gap:13px;
 overflow-x:auto;
 scrollbar-width:none;
 scroll-snap-type:x mandatory;
 padding:3px 0 7px;
}

.horizontal::-webkit-scrollbar{display:none}

.feature,
.event{
 position:relative;
 flex:0 0 88%;
 padding:0;
 border:1px solid rgba(255,255,255,.09);
 border-radius:24px;
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
 color:#fff;
 box-shadow:
 0 20px 60px rgba(0,0,0,.38),
 inset 0 0 0 1px rgba(255,255,255,.02);
}

.feature{height:245px}
.event{height:210px}

.feature img,
.feature video,
.event img,
.event video{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .6s cubic-bezier(.2,.8,.2,1);
}

.feature:hover img,
.feature:hover video,
.event:hover img,
.event:hover video{
 transform:scale(1.045);
}

.featureShade,
.eventShade{
 position:absolute;
 inset:0;
 background:
 linear-gradient(
 180deg,
 rgba(0,0,0,.02) 15%,
 rgba(0,0,0,.2) 40%,
 rgba(0,0,0,.94) 100%
 );
}

.featureText,
.eventText{
 position:absolute;
 left:19px;
 right:19px;
 bottom:18px;
 text-align:left;
}

.featureText strong{font-size:21px;letter-spacing:-.02em}

.featureText span{
 display:block;
 margin-top:7px;
 color:var(--price);
 font-weight:950;
 font-size:15px;
}

.eventDate{
 position:absolute;
 top:13px;
 left:13px;
 padding:8px 11px;
 border:1px solid rgba(255,255,255,.08);
 border-radius:20px;
 background:rgba(0,0,0,.66);
 backdrop-filter:blur(10px);
 color:var(--accent2);
 font-size:10px;
}

.eventText strong{font-size:19px}

.eventText span{
 display:block;
 margin-top:6px;
 color:#ccc;
 font-size:11px;
}

.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px;
}

.category{
 position:relative;
 height:180px;
 padding:0;
 border:1px solid rgba(255,255,255,.09);
 border-radius:22px;
 overflow:hidden;
 background:#171719;
 color:#fff;
 box-shadow:
 0 16px 45px rgba(0,0,0,.28),
 inset 0 0 0 1px rgba(255,255,255,.02);
}

.category img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:transform .6s cubic-bezier(.2,.8,.2,1);
}

.category:hover img{transform:scale(1.055)}

.categoryShade{
 position:absolute;
 inset:0;
 background:
 linear-gradient(
 180deg,
 rgba(0,0,0,.03) 5%,
 rgba(0,0,0,.25) 35%,
 rgba(0,0,0,.95) 100%
 );
}

.categoryText{
 position:absolute;
 left:16px;
 right:16px;
 bottom:16px;
 text-align:left;
}

.categoryText strong{
 display:block;
 font-size:18px;
 letter-spacing:-.025em;
}

.categoryText span{
 display:block;
 color:#b4b4b4;
 font-size:10px;
 margin-top:5px;
}

.categoryTitle{
 display:flex;
 align-items:center;
 justify-content:flex-start;
 gap:12px;
 margin-bottom:20px;
 padding-bottom:15px;
 border-bottom:1px solid rgba(255,255,255,.07);
}

.categoryTitle h2{
 flex:1;
 margin:0;
 font-size:22px!important;
 letter-spacing:-.035em;
}

.backBtn{
 border:1px solid rgba(255,255,255,.08);
 background:
 linear-gradient(
 145deg,
 rgba(255,255,255,.07),
 rgba(255,255,255,.025)
 );
 color:#fff;
 padding:10px 13px;
 border-radius:12px;
 font-size:11px;
 font-weight:850;
}

.products{
 display:flex;
 flex-direction:column;
 gap:13px;
 margin-top:0;
}

.product{
 display:grid;
 grid-template-columns:126px 1fr;
 min-height:130px;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.075);
 border-radius:var(--cardRadius);
 background:
 linear-gradient(
 145deg,
 rgba(30,30,32,var(--cardOpacity)),
 rgba(16,16,18,var(--cardOpacity))
 );
 cursor:pointer;
 box-shadow:
 0 14px 42px rgba(0,0,0,.24),
 0 1px 0 rgba(255,255,255,.025) inset;
}

.product:hover{
 border-color:rgba(214,168,61,.2);
 transform:translateY(-1px);
}

.productImage{
 height:130px;
 background:#1c1c1e;
 overflow:hidden;
 position:relative;
}

.productImage img,
.productImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.productInfo{
 min-width:0;
 padding:15px 14px;
}

.productInfo h3{
 margin:0;
 color:var(--cardText);
 font-size:15px;
 font-weight:850;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.productInfo p{
 margin:6px 0;
 color:#929292;
 font-size:11px;
 line-height:1.48;
 display:-webkit-box;
 -webkit-line-clamp:2;
 -webkit-box-orient:vertical;
 overflow:hidden;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

.tag{
 padding:4px 7px;
 border-radius:7px;
 background:#222225;
 color:#aaa;
 font-size:9px;
 border:1px solid rgba(255,255,255,.025);
}

.tag.sold{
 background:#7f1d1d;
 color:#fff;
}

.price{
 margin-top:8px;
 color:var(--price);
 font-weight:950;
 font-size:14px;
}

.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(6px);
}

.drawer{
 width:min(88%,390px);
 height:100%;
 overflow:auto;
 padding:20px;
 background:#101011;
 box-shadow:10px 0 50px #000;
 animation:drawerIn .25s cubic-bezier(.2,.8,.2,1);
}

.drawerHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.drawerLogo{
 color:var(--accent);
 font:700 25px Georgia,serif;
}

.drawerSection{margin-top:25px}

.drawerLabel{
 color:#666;
 font-size:10px;
 letter-spacing:.15em;
 margin-bottom:8px;
}

.drawerLink{
 display:block;
 width:100%;
 border:0;
 background:#18181a;
 color:#aaa;
 padding:13px;
 border-radius:10px;
 font-size:11px;
 text-align:left;
 margin-top:7px;
}

.modalOverlay{
 position:fixed;
 inset:0;
 z-index:150;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.76);
 backdrop-filter:blur(7px);
}

.modal{
 width:min(100%,650px);
 max-height:92vh;
 overflow:auto;
 border-radius:27px 27px 0 0;
 background:#101011;
 box-shadow:0 -15px 60px rgba(0,0,0,.5);
 animation:modalUp .28s cubic-bezier(.2,.8,.2,1);
}

.modalImage{
 position:relative;
 height:310px;
 background:#18181a;
}

.modalImage img,
.modalImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.closeBtn{
 position:absolute;
 top:13px;
 right:13px;
 width:41px;
 height:41px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.72);
 color:#fff;
 font-size:23px;
}

.modalBody{padding:21px}

.modalBody h2{
 margin:0;
 font-size:27px;
}

.modalBody p{
 color:#999;
 font-size:13px;
 line-height:1.65;
}

.infoRow{
 display:flex;
 justify-content:space-between;
 gap:20px;
 padding:13px 0;
 border-bottom:1px solid #252527;
 font-size:12px;
}

.modalPrice{
 margin-top:18px;
 color:var(--price);
 font-size:26px;
 font-weight:950;
}

/* ADMIN */

.adminOverlay{
 position:fixed;
 inset:0;
 z-index:250;
 background:rgba(0,0,0,.84);
 display:flex;
 justify-content:flex-end;
}

.admin{
 width:min(100%,780px);
 height:100%;
 overflow-y:auto;
 overflow-x:hidden;
 overscroll-behavior:contain;
 -webkit-overflow-scrolling:touch;
 background:#0b0b0d;
 animation:adminIn .28s cubic-bezier(.2,.8,.2,1);
}

.adminHeader{
 position:sticky;
 top:0;
 z-index:50;
 padding:18px 20px 14px;
 background:rgba(11,11,13,.94);
 border-bottom:1px solid rgba(255,255,255,.07);
 backdrop-filter:blur(24px);
}

.adminTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.adminTitle{
 display:flex;
 align-items:center;
 gap:12px;
}

.adminTitleIcon{
 width:44px;
 height:44px;
 border-radius:13px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:#111;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:19px;
 font-weight:1000;
}

.adminTitleText b{
 display:block;
 font-size:15px;
}

.adminTitleText span{
 display:block;
 margin-top:3px;
 color:#666;
 font-size:9px;
 text-transform:uppercase;
 letter-spacing:.12em;
}

.adminTabs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:15px;
}

.adminTabs button{
 padding:12px 8px;
 border:1px solid rgba(255,255,255,.06);
 border-radius:12px;
 background:#151518;
 color:#777;
 font-size:11px;
 font-weight:850;
}

.adminTabs button.active{
 background:rgba(214,168,61,.15);
 border-color:rgba(214,168,61,.35);
 color:var(--accent2);
}

.adminBody{
 padding:20px;
 padding-bottom:100px;
}

.adminSectionHeader{
 margin:4px 0 15px;
}

.adminSectionHeader h2{
 margin:0;
 font-size:24px;
}

.adminSectionHeader p{
 margin:5px 0 0;
 color:#666;
 font-size:10px;
}

.statsGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 margin-bottom:18px;
}

.statCard{
 padding:15px;
 min-height:105px;
 border:1px solid rgba(255,255,255,.07);
 border-radius:17px;
 background:linear-gradient(
 145deg,
 rgba(255,255,255,.045),
 rgba(255,255,255,.012)
 );
}

.statIcon{
 width:34px;
 height:34px;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(214,168,61,.11);
 color:var(--accent2);
 margin-bottom:12px;
}

.statLabel{
 color:#666;
 font-size:9px;
 text-transform:uppercase;
}

.statValue{
 margin-top:5px;
 font-size:24px;
 font-weight:950;
}

.statSub{
 margin-top:3px;
 color:#777;
 font-size:9px;
}

.adminCard{
 padding:17px;
 margin-bottom:12px;
 border:1px solid rgba(255,255,255,.07);
 border-radius:17px;
 background:linear-gradient(
 145deg,
 rgba(255,255,255,.035),
 rgba(255,255,255,.012)
 );
}

.adminCardTitle{
 font-size:15px;
 font-weight:900;
}

.adminCardDescription{
 margin-top:4px;
 color:#666;
 font-size:10px;
 line-height:1.5;
}

.field{margin-top:13px}

.field label{
 display:block;
 margin-bottom:6px;
 color:#777;
 font-size:10px;
 font-weight:700;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:13px;
 border:1px solid #303034;
 border-radius:11px;
 background:#141416;
 color:#fff;
 outline:none;
}

.field textarea{
 min-height:88px;
 resize:vertical;
}

.row{
 display:flex;
 gap:9px;
}

.row>*{
 flex:1;
 min-width:0;
}

.adminButton{
 min-height:42px;
 border:1px solid rgba(255,255,255,.07);
 border-radius:11px;
 padding:10px 14px;
 background:#1b1b1e;
 color:#fff;
 font-size:11px;
 font-weight:850;
}

.adminButton.gold{
 border-color:transparent;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:#111;
}

.adminButton.danger{
 background:#3a1719;
 color:#ff9a9a;
 border-color:#572024;
}

.full{width:100%}

.quickActions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-bottom:18px;
}

.quickAction{
 display:flex;
 align-items:center;
 gap:11px;
 padding:13px;
 border:1px solid rgba(255,255,255,.07);
 border-radius:14px;
 background:#151517;
 color:#ddd;
 text-align:left;
}

.quickActionIcon{
 width:34px;
 height:34px;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:rgba(214,168,61,.08);
 color:var(--accent2);
}

.adminBreadcrumb{
 display:flex;
 align-items:center;
 gap:8px;
 margin-bottom:15px;
 color:#666;
 font-size:10px;
}

.adminBreadcrumb button{
 border:0;
 background:transparent;
 color:var(--accent2);
}

.adminCategoryList,
.adminProductList{
 display:flex;
 flex-direction:column;
 gap:9px;
}

.adminCategoryItem,
.adminProductItem{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 width:100%;
 border:1px solid rgba(255,255,255,.07);
 border-radius:15px;
 background:#141416;
 color:#fff;
 text-align:left;
}

.adminCategoryThumb,
.adminProductThumb{
 width:58px;
 height:58px;
 flex:0 0 58px;
 border-radius:12px;
 overflow:hidden;
 background:#202023;
}

.adminCategoryThumb img,
.adminProductThumb img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.adminCategoryInfo,
.adminProductInfo{
 flex:1;
 min-width:0;
}

.adminCategoryInfo strong,
.adminProductInfo strong{
 display:block;
 font-size:13px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.adminCategoryInfo span,
.adminProductInfo span{
 display:block;
 margin-top:4px;
 color:#666;
 font-size:9px;
}

.adminProductInfo span{color:var(--accent2)}

.adminArrow{
 width:28px;
 height:28px;
 border-radius:9px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#1e1e21;
 color:#777;
 font-size:17px;
}

.fileBox{
 display:flex;
 gap:7px;
}

.fileBtn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:5px;
 flex:1;
 min-height:42px;
 padding:10px;
 border:1px solid #303034;
 border-radius:10px;
 background:#171719;
 color:#ddd;
 font-size:10px;
 font-weight:800;
 cursor:pointer;
}

.preview{
 width:100%;
 max-height:200px;
 object-fit:cover;
 border-radius:12px;
 margin-top:9px;
 border:1px solid #303034;
}

.designGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.designCard{
 padding:13px;
 border-radius:13px;
 background:#151517;
 border:1px solid rgba(255,255,255,.06);
}

.designCard h4{
 margin:0 0 10px;
 font-size:10px;
 color:#bbb;
}

.colorInput{
 width:100%;
 height:43px;
 padding:3px;

/* =========================================================
   INDEXED DB
========================================================= */

let dbPromise=null;

function openMediaDB(){

 if(dbPromise)return dbPromise;

 dbPromise=new Promise((resolve,reject)=>{

  if(!("indexedDB" in window)){
   reject(new Error("IndexedDB desteklenmiyor."));
   return;
  }

  const request=indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded=e=>{

   const db=e.target.result;

   if(!db.objectStoreNames.contains(MEDIA_STORE)){
    db.createObjectStore(MEDIA_STORE);
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });

 return dbPromise;
}

async function mediaPut(key,blob){

 const db=await openMediaDB();

 return new Promise((resolve,reject)=>{

  const tx=db.transaction(MEDIA_STORE,"readwrite");
  const store=tx.objectStore(MEDIA_STORE);

  const req=store.put(blob,key);

  req.onsuccess=()=>resolve(true);
  req.onerror=()=>reject(req.error);
 });
}

async function mediaGet(key){

 try{

  const db=await openMediaDB();

  return await new Promise((resolve,reject)=>{

   const tx=db.transaction(MEDIA_STORE,"readonly");
   const store=tx.objectStore(MEDIA_STORE);
   const req=store.get(key);

   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>reject(req.error);

  });

 }catch(e){
  console.warn("Medya okunamadı:",e);
  return null;
 }
}

async function mediaDelete(key){

 try{

  const db=await openMediaDB();

  return await new Promise((resolve,reject)=>{

   const tx=db.transaction(MEDIA_STORE,"readwrite");
   const req=tx.objectStore(MEDIA_STORE).delete(key);

   req.onsuccess=()=>resolve(true);
   req.onerror=()=>reject(req.error);

  });

 }catch(e){
  return false;
 }
}

function mediaKey(type,id){
 return "nearMedia:"+type+":"+id;
}

async function saveMedia(type,id,file){

 const key=mediaKey(type,id);

 await mediaPut(key,file);

 return "indexeddb:"+key;
}

async function loadMediaReference(value){

 if(!value)return "";

 if(!String(value).startsWith("indexeddb:"))
  return value;

 const key=String(value).replace("indexeddb:","");

 const blob=await mediaGet(key);

 if(!blob)return "";

 return URL.createObjectURL(blob);
}

/* =========================================================
   TRANSLATION
========================================================= */

function translationCache(){

 try{

  return JSON.parse(
   safeGet(TRANSLATION_CACHE_KEY)||"{}"
  );

 }catch(e){

  return {};
 }
}

async function translateText(text,target){

 if(!text||target==="tr")
  return text||"";

 const cache=translationCache();

 const key="tr|"+target+"|"+text.trim();

 if(cache[key])
  return cache[key];

 try{

  const url=
   "https://translate.googleapis.com/translate_a/single"+
   "?client=gtx"+
   "&sl=tr"+
   "&tl="+encodeURIComponent(target)+
   "&dt=t"+
   "&q="+encodeURIComponent(text);

  const response=await fetch(url);

  if(!response.ok)
   throw new Error("translation");

  const data=await response.json();

  let result="";

  if(Array.isArray(data?.[0])){

   data[0].forEach(x=>{

    if(x?.[0])
     result+=x[0];

   });
  }

  result=result.trim();

  if(result){

   cache[key]=result;

   safeSet(
    TRANSLATION_CACHE_KEY,
    JSON.stringify(cache)
   );

   return result;
  }

 }catch(e){

  console.warn("Çeviri başarısız:",e);
 }

 return text;
}

async function generateMissingTranslations(item){

 if(!item)return;

 if(!item.names)item.names={};
 if(!item.descriptions)item.descriptions={};

 item.names.tr=item.name||"";
 item.descriptions.tr=item.description||"";

 translating=true;

 rememberAdminScroll();

 render({
  preserveAdminScroll:true
 });

 for(const target of ["en","ar"]){

  item.names[target]=
   await translateText(
    item.name,
    target
   );

  item.descriptions[target]=
   await translateText(
    item.description,
    target
   );
 }

 translating=false;

 saveData();

 render({
  preserveAdminScroll:true
 });
}

function collectAdmin(){

 document.querySelectorAll("[data-admin]")
 .forEach(el=>{

  const key=el.dataset.admin;
  const value=el.value;

  if(key==="businessName")
   DATA.name=value;

  else if(key==="subtitle")
   DATA.subtitle=value;

  else if(key==="phone")
   DATA.phone=value;

  else if(key==="whatsapp")
   DATA.whatsapp=value;

  else if(key==="hours")
   DATA.hours=value;

  else if(key==="rateUSD")
   DATA.rates.USD=Number(value)||0;

  else if(key==="rateEUR")
   DATA.rates.EUR=Number(value)||0;

  else if(key==="fontFamily")
   DATA.theme.fontFamily=value;

  else if(key==="titleFont")
   DATA.theme.titleFont=value;

  else if(key.startsWith("categoryName-")){

   const id=key.replace("categoryName-","");
   const c=findCategory(id);

   if(c&&c.name!==value){

    c.name=value;

    markCategoryTranslationDirty(c);
   }
  }

  else if(key.startsWith("productName-")){

   const id=key.replace("productName-","");
   const p=findProduct(id);

   if(p&&p.name!==value){

    p.name=value;

    markProductTranslationDirty(p);
   }
  }

  else if(key.startsWith("productDescription-")){

   const id=key.replace("productDescription-","");
   const p=findProduct(id);

   if(p&&p.description!==value){

    p.description=value;

    markProductTranslationDirty(p);
   }
  }

  else if(key.startsWith("productPrice-")){

   const id=key.replace("productPrice-","");
   const p=findProduct(id);

   if(p)p.price=Number(value)||0;
  }

  else if(key.startsWith("productPortion-")){

   const id=key.replace("productPortion-","");
   const p=findProduct(id);

   if(p)p.portion=value;
  }

  else if(key.startsWith("productCalories-")){

   const id=key.replace("productCalories-","");
   const p=findProduct(id);

   if(p)p.calories=value;
  }

  else if(key.startsWith("productAllergens-")){

   const id=key.replace("productAllergens-","");
   const p=findProduct(id);

   if(p){

    p.allergens=value
     .split(",")
     .map(x=>x.trim())
     .filter(Boolean);
   }
  }

  else if(key.startsWith("productSpicy-")){

   const id=key.replace("productSpicy-","");
   const p=findProduct(id);

   if(p){

    p.spicy=Math.max(
     0,
     Math.min(5,Number(value)||0)
    );
   }
  }

  else if(key.startsWith("eventName-")){

   const id=key.replace("eventName-","");
   const e=findEvent(id);

   if(e&&e.name!==value){

    e.name=value;

    markEventTranslationDirty(e);
   }
  }

  else if(key.startsWith("eventDate-")){

   const id=key.replace("eventDate-","");
   const e=findEvent(id);

   if(e)e.date=value;
  }

  else if(key.startsWith("eventTime-")){

   const id=key.replace("eventTime-","");
   const e=findEvent(id);

   if(e)e.time=value;
  }

  else if(key.startsWith("eventDescription-")){

   const id=key.replace("eventDescription-","");
   const e=findEvent(id);

   if(e&&e.description!==value){

    e.description=value;

    markEventTranslationDirty(e);
   }
  }

 });
}

/* =========================================================
   FILE HANDLING - FIXED
========================================================= */

async function handleFile(type,id,file){

 if(!file)return;

 const maxImage=8*1024*1024;
 const maxVideo=100*1024*1024;

 const isVideo=file.type.startsWith("video/");

 if(isVideo&&file.size>maxVideo){

  alert("Video en fazla 100 MB olabilir.");

  return;
 }

 if(!isVideo&&file.size>maxImage){

  alert("Fotoğraf en fazla 8 MB olabilir.");

  return;
 }

 try{

  const reference=
   await saveMedia(
    type,
    id,
    file
   );

  if(type==="logo"){

   DATA.logo=reference;

  }else if(type==="backgroundImage"){

   DATA.background.image=reference;
   DATA.background.type="image";

  }else if(type==="backgroundVideo"){

   DATA.background.video=reference;
   DATA.background.type="video";

  }else if(type==="categoryImage"){

   const c=findCategory(id);

   if(c)c.image=reference;

  }else if(type==="productImage"){

   const p=findProduct(id);

   if(p)p.image=reference;

  }else if(type==="productVideo"){

   const p=findProduct(id);

   if(p)p.video=reference;

  }else if(type==="eventImage"){

   const e=findEvent(id);

   if(e)e.image=reference;

  }else if(type==="eventVideo"){

   const e=findEvent(id);

   if(e)e.video=reference;
  }

  const saved=saveData();

  if(!saved)
   return;

  rememberAdminScroll();

  render({
   preserveAdminScroll:true
  });

 }catch(error){

  console.error(error);

  alert(
   "⚠️ DOSYA KAYDEDİLEMEDİ\n\n"+
   (error?.message||"Bilinmeyen hata")
  );
 }
}

async function clearFile(type,id){

 try{

  if(type==="logo"){

   if(String(DATA.logo).startsWith("indexeddb:"))
    await mediaDelete(
     String(DATA.logo).replace("indexeddb:","")
    );

   DATA.logo="";

  }else if(type==="backgroundImage"){

   if(String(DATA.background.image).startsWith("indexeddb:"))
    await mediaDelete(
     String(DATA.background.image).replace("indexeddb:","")
    );

   DATA.background.image="";

  }else if(type==="backgroundVideo"){

   if(String(DATA.background.video).startsWith("indexeddb:"))
    await mediaDelete(
     String(DATA.background.video).replace("indexeddb:","")
    );

   DATA.background.video="";

  }else if(type==="categoryImage"){

   const c=findCategory(id);

   if(c){

    if(String(c.image).startsWith("indexeddb:"))
     await mediaDelete(
      String(c.image).replace("indexeddb:","")
     );

    c.image="";
   }

  }else if(type==="productImage"){

   const p=findProduct(id);

   if(p){

    if(String(p.image).startsWith("indexeddb:"))
     await mediaDelete(
      String(p.image).replace("indexeddb:","")
     );

    p.image="";
   }

  }else if(type==="productVideo"){

   const p=findProduct(id);

   if(p){

    if(String(p.video).startsWith("indexeddb:"))
     await mediaDelete(
      String(p.video).replace("indexeddb:","")
     );

    p.video="";
   }

  }else if(type==="eventImage"){

   const e=findEvent(id);

   if(e){

    if(String(e.image).startsWith("indexeddb:"))
     await mediaDelete(
      String(e.image).replace("indexeddb:","")
     );

    e.image="";
   }

  }else if(type==="eventVideo"){

   const e=findEvent(id);

    if(String(e.video).startsWith("indexeddb:"))
     await mediaDelete(
      String(e.video).replace("indexeddb:","")
     );

   }

  saveData();

  rememberAdminScroll();

  render({
   preserveAdminScroll:true
  });

 }catch(error){

 }
}

/* =========================================================
   SCROLL
========================================================= */

function rememberWindowScroll(){

 savedWindowScroll=
  window.scrollY||
  window.pageYOffset||
  0;
}

function rememberAdminScroll(){

 const admin=document.querySelector(".admin");

 if(admin)
  savedAdminScroll=admin.scrollTop||0;
}

function restoreWindowScroll(){

 const y=savedWindowScroll;

 requestAnimationFrame(()=>{
  window.scrollTo(0,y);
 });
}

function restoreAdminScroll(){

 const y=savedAdminScroll;

 requestAnimationFrame(()=>{

  requestAnimationFrame(()=>{

   const admin=document.querySelector(".admin");

   if(admin)
    admin.scrollTop=y;

  });
 });
}

 /* SAVE PRODUCT - FIXED */

 $("saveProductNow")?.addEventListener(
  "click",
  async()=>{

   collectAdmin();

   rememberAdminScroll();

   const firstSave=saveData();

   if(!firstSave)
    return;

   const item=findProduct(
    adminProductView
   );

   if(!item){

    alert("Ürün bulunamadı.");

    return;
   }

   if(item.name.trim()===""){

    alert("Ürün adı boş bırakılamaz.");

    return;
   }

   if(item.description.trim()){

    await generateMissingTranslations(item);

   }else{

    if(!item.names)
     item.names={};

    if(!item.descriptions)
     item.descriptions={};

    item.names.tr=item.name;
    item.descriptions.tr="";

    saveData();
   }

   const finalSave=saveData();

   if(!finalSave)
    return;

   alert("✓ Ürün başarıyla kaydedildi.");

   adminProductView=null;
   advancedProduct=false;

   render({
    preserveAdminScroll:true
   });
  }
 );
}
