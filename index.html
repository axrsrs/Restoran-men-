<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>NearMenu</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;
 background:#0b0b0c;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --accent:#d6a83d;
 --accent2:#f0c45a;
 --text:#fff;
 --muted:#929296;
 --price:#f0c45a;
 --card:#151517;
 --cardText:#fff;
 --line:#29292d;
 --overlay:.55;
 --cardOpacity:.94;
 --cardRadius:20px;
 --titleSize:34px;
 --bodySize:13px;
 --logoSize:112px;
 --fontFamily:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 --titleFont:Georgia,serif;
}

#app{min-height:100vh}

.container{
 width:100%;
 max-width:620px;
 margin:auto;
 padding:0 16px 70px;
}

/* BACKGROUND */

.background{
 position:fixed;
 inset:0;
 z-index:-5;
 overflow:hidden;
 background:#0b0b0c;
}

.background img,
.background video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.backgroundOverlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,var(--overlay));
}

body{
 font-family:var(--fontFamily);
 color:var(--text);
 font-size:var(--bodySize);
}

/* TOP */

.top{
 position:sticky;
 top:0;
 z-index:80;
 padding:12px 0;
 background:rgba(11,11,12,.88);
 backdrop-filter:blur(20px);
}

.topRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.topRight{
 display:flex;
 align-items:center;
 gap:7px;
 position:relative;
}

.iconBtn{
 width:43px;
 height:43px;
 border-radius:50%;
 border:1px solid var(--line);
 background:#171719;
 color:#fff;
 font-size:19px;
 transition:.2s;
}

.iconBtn:active{transform:scale(.94)}

.currencyBtn{
 height:43px;
 padding:0 15px;
 border:0;
 border-radius:23px;
 background:var(--accent);
 color:#111;
 font-weight:900;
}

.searchBox{margin-top:9px}

.searchBox input{
 width:100%;
 padding:14px 16px;
 border-radius:15px;
 border:1px solid var(--line);
 background:#151517;
 color:#fff;
 outline:none;
}

/* QUICK POPUP */

.quickPopup{
 position:absolute;
 right:0;
 top:52px;
 min-width:145px;
 padding:7px;
 border:1px solid #303034;
 border-radius:15px;
 background:rgba(20,20,22,.98);
 box-shadow:0 20px 50px rgba(0,0,0,.55);
 backdrop-filter:blur(20px);
 z-index:200;
}

.quickPopup button{
 width:100%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:11px 12px;
 margin:2px 0;
 border:0;
 border-radius:10px;
 background:transparent;
 color:#aaa;
 text-align:left;
 font-size:12px;
 font-weight:800;
}

.quickPopup button.active{
 background:var(--accent);
 color:#111;
}

.quickPopup button:hover{
 background:#242427;
 color:#fff;
}

.quickPopup button.active:hover{
 background:var(--accent);
 color:#111;
}

/* HERO */

.hero{
 text-align:center;
 padding:40px 0 28px;
}

.logo{
 width:var(--logoSize);
 height:var(--logoSize);
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 border:1px solid var(--accent);
 background:#111;
 color:var(--accent);
 font:42px Georgia,serif;
 box-shadow:0 0 45px rgba(214,168,61,.14);
 overflow:hidden;
 transition:.3s;
}

.logo img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.welcome{
 margin-top:18px;
 color:var(--accent2);
 font-size:10px;
 font-weight:900;
 letter-spacing:.32em;
}

.hero h1{
 margin:10px 0 6px;
 color:var(--text);
 font:700 var(--titleSize) var(--titleFont);
 line-height:1.1;
}

.hero p{
 margin:0;
 color:var(--muted);
 font-size:var(--bodySize);
}

/* SECTION */

.section{margin-top:30px}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px;
}

.sectionHead h2{
 margin:0;
 font-size:20px;
}

.hint{
 color:#666;
 font-size:10px;
}

/* HORIZONTAL */

.horizontal{
 display:flex;
 gap:13px;
 overflow-x:auto;
 scrollbar-width:none;
 scroll-snap-type:x mandatory;
}

.horizontal::-webkit-scrollbar{display:none}

/* FEATURE */

.feature{
 position:relative;
 flex:0 0 86%;
 height:225px;
 padding:0;
 border:1px solid var(--line);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
 box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.feature img,
.feature video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.featureShade{
 position:absolute;
 inset:0;
 background:linear-gradient(
  transparent 20%,
  rgba(0,0,0,.9)
 );
}

.featureText{
 position:absolute;
 left:17px;
 right:17px;
 bottom:16px;
 text-align:left;
}

.featureText strong{
 display:block;
 font-size:19px;
}

.featureText span{
 display:block;
 margin-top:5px;
 color:var(--price);
 font-weight:900;
}

/* EVENTS */

.event{
 position:relative;
 flex:0 0 86%;
 height:195px;
 padding:0;
 border:1px solid var(--line);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
}

.event img,
.event video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.eventShade{
 position:absolute;
 inset:0;
 background:linear-gradient(
  transparent 20%,
  rgba(0,0,0,.9)
 );
}

.eventDate{
 position:absolute;
 top:12px;
 left:12px;
 padding:8px 11px;
 border-radius:20px;
 background:rgba(0,0,0,.72);
 color:var(--accent2);
 font-size:10px;
}

.eventText{
 position:absolute;
 left:16px;
 right:16px;
 bottom:15px;
 text-align:left;
}

.eventText strong{font-size:18px}

.eventText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:11px;
}

/* CATEGORIES */

.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px;
}

.category{
 position:relative;
 height:165px;
 padding:0;
 border:1px solid var(--line);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.category img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.categoryShade{
 position:absolute;
 inset:0;
 background:linear-gradient(
  transparent 15%,
  rgba(0,0,0,.92)
 );
}

.categoryText{
 position:absolute;
 left:14px;
 right:14px;
 bottom:14px;
 text-align:left;
}

.categoryText strong{
 display:block;
 font-size:18px;
}

.categoryText span{
 display:block;
 color:#aaa;
 font-size:10px;
 margin-top:4px;
}

/* CATEGORY PAGE */

.categoryTitle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px;
}

.backBtn{
 border:0;
 background:#1b1b1e;
 color:#fff;
 padding:10px 13px;
 border-radius:11px;
 font-size:11px;
 font-weight:800;
}

.stickyCategories{
 position:sticky;
 top:67px;
 z-index:35;
 margin:0 -16px;
 padding:10px 16px;
 background:rgba(11,11,12,.94);
 backdrop-filter:blur(16px);
 border-bottom:1px solid #202023;
}

.categoryTabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 scrollbar-width:none;
}

.categoryTabs::-webkit-scrollbar{display:none}

.categoryTabs button{
 flex:0 0 auto;
 padding:10px 14px;
 border:0;
 border-radius:11px;
 background:#18181a;
 color:#aaa;
 font-size:11px;
 font-weight:800;
}

.categoryTabs button.active{
 background:var(--accent);
 color:#111;
}

/* PRODUCTS */

.products{
 display:flex;
 flex-direction:column;
 gap:12px;
 margin-top:16px;
}

.product{
 display:grid;
 grid-template-columns:120px 1fr;
 min-height:122px;
 overflow:hidden;
 border:1px solid var(--line);
 border-radius:var(--cardRadius);
 background:rgba(20,20,22,var(--cardOpacity));
 cursor:pointer;
 box-shadow:0 12px 32px rgba(0,0,0,.16);
 transition:.2s;
}

.product:active{
 transform:scale(.985);
}

.productImage{
 height:122px;
 background:#1c1c1e;
}

.productImage img,
.productImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.productInfo{
 padding:13px;
}

.productInfo h3{
 margin:0;
 color:var(--cardText);
 font-size:15px;
}

.productInfo p{
 margin:6px 0;
 color:#929292;
 font-size:11px;
 line-height:1.45;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

.tag{
 padding:4px 7px;
 border-radius:7px;
 background:#222225;
 color:#aaa;
 font-size:9px;
}

.tag.sold{
 background:#7f1d1d;
 color:#fff;
}

.price{
 margin-top:8px;
 color:var(--price);
 font-weight:900;
 font-size:14px;
}

/* DRAWER */

.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(5px);
}

.drawer{
 width:min(88%,390px);
 height:100%;
 overflow:auto;
 padding:20px;
 background:#101011;
 box-shadow:10px 0 40px #000;
}

.drawerHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.drawerLogo{
 color:var(--accent);
 font:700 25px Georgia,serif;
}

.drawerSection{margin-top:25px}

.drawerLabel{
 color:#666;
 font-size:10px;
 letter-spacing:.15em;
 margin-bottom:8px;
}

.drawerLink{
 display:block;
 width:100%;
 border:0;
 background:#18181a;
 color:#aaa;
 padding:12px;
 border-radius:10px;
 font-size:11px;
 text-align:left;
 margin-top:7px;
}

/* MODAL */

.modalOverlay{
 position:fixed;
 inset:0;
 z-index:150;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.75);
 backdrop-filter:blur(6px);
}

.modal{
 width:min(100%,620px);
 max-height:92vh;
 overflow:auto;
 border-radius:27px 27px 0 0;
 background:#101011;
 box-shadow:0 -15px 50px rgba(0,0,0,.4);
}

.modalImage{
 position:relative;
 height:300px;
}

.modalImage img,
.modalImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.closeBtn{
 position:absolute;
 top:13px;
 right:13px;
 width:41px;
 height:41px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.72);
 color:#fff;
 font-size:23px;
}

.modalBody{padding:20px}

.modalBody h2{
 margin:0;
 font-size:27px;
}

.modalBody p{
 color:#999;
 font-size:13px;
 line-height:1.6;
}

.infoRow{
 display:flex;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid #252527;
 font-size:12px;
}

.infoRow span:last-child{
 color:#ddd;
 text-align:right;
}

.modalPrice{
 margin-top:17px;
 color:var(--price);
 font-size:26px;
 font-weight:900;
}

/* ADMIN */

.adminOverlay{
 position:fixed;
 inset:0;
 z-index:250;
 background:rgba(0,0,0,.82);
 display:flex;
 justify-content:flex-end;
}

.admin{
 width:min(100%,620px);
 height:100%;
 overflow:auto;
 background:#0e0e0f;
}

.adminHeader{
 position:sticky;
 top:0;
 z-index:10;
 padding:15px;
 background:rgba(14,14,15,.98);
 border-bottom:1px solid var(--line);
 backdrop-filter:blur(15px);
}

.adminTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.adminTabs{
 display:flex;
 gap:6px;
 margin-top:12px;
}

.adminTabs button{
 flex:1;
 padding:11px 7px;
 border:0;
 border-radius:10px;
 background:#19191b;
 color:#888;
 font-size:11px;
}

.adminTabs button.active{
 background:var(--accent);
 color:#111;
 font-weight:900;
}

.adminBody{padding:16px}

.field{margin-bottom:13px}

.field label{
 display:block;
 margin-bottom:5px;
 color:#777;
 font-size:10px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:12px;
 border:1px solid #303034;
 border-radius:11px;
 background:#171719;
 color:#fff;
 outline:none;
}

.field textarea{
 min-height:80px;
 resize:vertical;
}

.adminCard{
 padding:14px;
 margin-bottom:11px;
 border:1px solid var(--line);
 border-radius:15px;
 background:#151517;
}

.adminButton{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 background:#202023;
 color:#fff;
 font-size:11px;
 font-weight:800;
}

.adminButton.gold{
 background:var(--accent);
 color:#111;
}

.adminButton.danger{
 background:#7f1d1d;
 color:#fff;
}

.saveBar{
 position:sticky;
 bottom:0;
 padding:12px 16px;
 background:rgba(14,14,15,.98);
 border-top:1px solid var(--line);
 z-index:20;
}

.row{
 display:flex;
 gap:7px;
}

.row>*{
 flex:1;
 min-width:0;
}

.small{
 color:#777;
 font-size:10px;
 line-height:1.5;
}

/* ADMIN LIST */

.adminCategoryList,
.adminProductList{
 display:flex;
 flex-direction:column;
 gap:9px;
 margin-top:15px;
}

.adminCategoryItem,
.adminProductItem{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 border:1px solid var(--line);
 border-radius:14px;
 background:#151517;
 color:#fff;
 text-align:left;
 width:100%;
}

.adminCategoryThumb,
.adminProductThumb{
 width:55px;
 height:55px;
 flex:0 0 55px;
 border-radius:11px;
 overflow:hidden;
 background:#222225;
}

.adminCategoryThumb img,
.adminProductThumb img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.adminCategoryInfo,
.adminProductInfo{
 flex:1;
 min-width:0;
}

.adminCategoryInfo strong,
.adminProductInfo strong{
 display:block;
 font-size:14px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.adminCategoryInfo span,
.adminProductInfo span{
 display:block;
 margin-top:4px;
 color:#777;
 font-size:10px;
}

.adminProductInfo span{
 color:var(--accent2);
}

.adminArrow{
 color:#777;
 font-size:18px;
}

.adminBreadcrumb{
 display:flex;
 align-items:center;
 gap:7px;
 margin-bottom:15px;
 color:#777;
 font-size:11px;
}

.adminBreadcrumb button{
 border:0;
 background:none;
 padding:0;
 color:var(--accent2);
 font-size:11px;
 font-weight:800;
}

/* FILE */

.fileBox{
 display:flex;
 gap:7px;
}

.fileBtn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:5px;
 flex:1;
 padding:11px;
 border:1px solid #303034;
 border-radius:10px;
 background:#18181a;
 color:#ddd;
 font-size:11px;
 font-weight:800;
 cursor:pointer;
}

.preview{
 width:100%;
 max-height:180px;
 object-fit:cover;
 border-radius:12px;
 margin-top:8px;
 border:1px solid #303034;
}

/* DESIGN */

.designGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.designCard{
 padding:11px;
 border-radius:12px;
 background:#18181a;
 border:1px solid #252527;
}

.designCard h4{
 margin:0 0 9px;
 font-size:11px;
 color:#bbb;
}

.colorInput{
 width:100%;
 height:42px;
 padding:3px;
 border:1px solid #303034;
 border-radius:10px;
 background:#171719;
}

.presetRow{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.preset{
 width:38px;
 height:38px;
 border-radius:11px;
 border:2px solid transparent;
}

.preset.active{
 border-color:#fff;
 box-shadow:0 0 0 2px var(--accent);
}

.rangeRow{
 display:flex;
 align-items:center;
 gap:10px;
}

.rangeRow input{
 flex:1;
}

.rangeValue{
 width:45px;
 text-align:right;
 color:var(--accent2);
 font-size:10px;
}

.switchGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.toggle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
 margin:7px 0;
 border:1px solid var(--line);
 border-radius:11px;
 background:#18181a;
 color:#ddd;
 font-size:12px;
}

.toggle input{
 width:18px;
 height:18px;
 accent-color:var(--accent);
}

/* LOGIN */

.adminLoginOverlay{
 position:fixed;
 inset:0;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:rgba(0,0,0,.9);
 backdrop-filter:blur(12px);
}

.adminLogin{
 width:min(100%,390px);
 padding:25px;
 border:1px solid #29292d;
 border-radius:22px;
 background:#111113;
 box-shadow:0 20px 60px #000;
}

.adminLoginLogo{
 width:65px;
 height:65px;
 margin:0 auto 17px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:1px solid var(--accent);
 border-radius:50%;
 color:var(--accent);
 font:30px Georgia,serif;
}

.adminLogin h2{
 margin:0;
 text-align:center;
 font-size:21px;
}

.adminLogin p{
 margin:7px 0 20px;
 text-align:center;
 color:#777;
 font-size:11px;
}

.adminPassword{
 width:100%;
 padding:14px;
 border:1px solid #303034;
 border-radius:12px;
 background:#18181a;
 color:#fff;
 outline:none;
 text-align:center;
 letter-spacing:.15em;
}

.adminLoginButton{
 width:100%;
 margin-top:10px;
 padding:13px;
 border:0;
 border-radius:12px;
 background:var(--accent);
 color:#111;
 font-weight:900;
}

.loginError{
 display:none;
 margin-top:10px;
 padding:9px;
 border-radius:9px;
 background:#3a1717;
 color:#ff8d8d;
 text-align:center;
 font-size:10px;
}

.footer{
 padding:35px 0;
 text-align:center;
 color:#555;
 font-size:10px;
}

.empty{
 padding:30px 10px;
 text-align:center;
 color:#666;
}

@media(max-width:390px){
 .categories{grid-template-columns:1fr}
 .product{grid-template-columns:100px 1fr}
 .productImage{height:115px}
 .designGrid{grid-template-columns:1fr}
 .switchGrid{grid-template-columns:1fr}
}
</style>
</head>

<div id="app"></div>

/* =========================================================
   LOAD OLD DATA WITHOUT DESTROYING IT
   ========================================================= */

try{
 const saved=localStorage.getItem("nearMenuData");
 if(saved)mergeData(JSON.parse(saved));
}catch(e){
 console.log("Veri yükleme:",e);
}

function mergeData(saved){

 if(!saved)return;

 Object.keys(saved).forEach(key=>{

  if(
   key==="theme"||
   key==="settings"||
   key==="background"||
   key==="rates"
  ){

   DATA[key]=Object.assign(
    {},
    DATA[key]||{},
    saved[key]||{}
   );

  }else{

   DATA[key]=saved[key];

  }

 });

 DATA.theme=Object.assign({
  accent:"#d6a83d",
  accent2:"#f0c45a",
  text:"#ffffff",
  cardText:"#ffffff",
  price:"#f0c45a",
  overlay:.55,
  cardOpacity:.94,
  cardRadius:20,
  logoSize:112,
  titleSize:34,
  bodySize:13,
  fontFamily:"system",
  titleFont:"Georgia"
 },DATA.theme||{});

 DATA.settings=Object.assign(
  {},
  DATA.settings||{}
 );

 DATA.background=Object.assign({
  type:"color",
  value:"#0b0b0c",
  image:"",
  video:""
 },DATA.background||{});

 DATA.rates=Object.assign({
  USD:40,
  EUR:47
 },DATA.rates||{});

 (DATA.categories||[]).forEach(c=>{

  if(!Array.isArray(c.items))
   c.items=[];

  c.items.forEach(p=>{

   if(typeof p.video==="undefined")
    p.video="";

   if(typeof p.featured==="undefined")
    p.featured=false;

   if(typeof p.dish==="undefined")
    p.dish=false;

   if(typeof p.sold==="undefined")
    p.sold=false;

   if(!Array.isArray(p.allergens))
    p.allergens=[];

  });

 });

 (DATA.events||[]).forEach(e=>{

  if(typeof e.video==="undefined")
   e.video="";

 });

}

function saveData(){

 try{

  localStorage.setItem(
   "nearMenuData",
   JSON.stringify(DATA)
  );

 }catch(e){

  alert(
   "Veriler kaydedilemedi. Seçtiğiniz dosya çok büyük olabilir."
  );

 }

}

/* =========================================================
   HELPERS
   ========================================================= */

function $(id){
 return document.getElementById(id);
}

function esc(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function t(key){

 return TEXT[language]?.[key]||
        TEXT.tr[key]||
        key;

}

function allProducts(){

 let result=[];

 (DATA.categories||[]).forEach(category=>{

  (category.items||[]).forEach(item=>{

   result.push(
    Object.assign({},item,{
     categoryId:category.id,
     categoryName:category.name
    })
   );

  });

 });

 return result;

}

function findProduct(id){

 for(const category of DATA.categories||[]){

  const product=(category.items||[])
   .find(p=>p.id===id);

  if(product)return product;

 }

 return null;

}

function findCategory(id){

 return (DATA.categories||[])
  .find(c=>c.id===id)||null;

}

function findEvent(id){

 return (DATA.events||[])
  .find(e=>e.id===id)||null;

}

function money(price){

 const value=Number(price)||0;

 if(currency==="USD"){

  return "$"+
   (value/(Number(DATA.rates.USD)||40))
   .toFixed(2);

 }

 if(currency==="EUR"){

  return "€"+
   (value/(Number(DATA.rates.EUR)||47))
   .toFixed(2);

 }

 return Math.round(value)
  .toLocaleString("tr-TR")+" ₺";

}

function fileField(
 type,
 id,
 label,
 value,
 accept
){

 return `
 <div class="field">

  <label>${label}</label>

  <div class="fileBox">

   <label class="fileBtn">

    📁 Dosya Seç

    <input
     hidden
     type="file"
     accept="${accept}"
     data-file-type="${type}"
     data-file-id="${esc(id)}">

   </label>

   ${
    value
    ?
    `<button
     type="button"
     class="fileBtn"
     data-clear-file="${type}|${esc(id)}">
     Temizle
    </button>`
    :
    ""
   }

  </div>

  ${
   value
   ?
   type.includes("Video")||
   type==="productVideo"||
   type==="eventVideo"
   ?
   `<video
    class="preview"
    controls
    src="${esc(value)}"></video>`
   :
   `<img
    class="preview"
    src="${esc(value)}">`
   :
   `<div class="small">
    Henüz dosya seçilmedi.
   </div>`
  }

 </div>
 `;

}

   ========================================================= */

function collectAdmin(){

 document
 .querySelectorAll("[data-admin]")
 .forEach(input=>{

  const key=input.dataset.admin;
  const value=input.value;

  if(key==="businessName")
   DATA.name=value;

  else if(key==="subtitle")
   DATA.subtitle=value;

  else if(key==="phone")
   DATA.phone=value;

  else if(key==="whatsapp")
   DATA.whatsapp=value;

  else if(key==="hours")
   DATA.hours=value;

  else if(key==="rateUSD")
   DATA.rates.USD=
    Number(value)||0;

  else if(key==="rateEUR")
   DATA.rates.EUR=
    Number(value)||0;

  else if(key==="fontFamily")
   DATA.theme.fontFamily=
    value==="system"
    ?
    '-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif'
    :
    value;

  else if(key==="titleFont")
   DATA.theme.titleFont=
    value==="system"
    ?
    '-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif'
    :
    value;

  else if(key.startsWith("categoryName-")){

   const id=
    key.replace("categoryName-","");

   const category=
    findCategory(id);

   if(category)
    category.name=value;

  }

  else if(key.startsWith("productName-")){

   const id=
    key.replace("productName-","");

   const item=
    findProduct(id);

   if(item)
    item.name=value;

  }

  else if(key.startsWith("productDescription-")){

   const id=
    key.replace(
     "productDescription-",
     ""
    );

   const item=findProduct(id);

   if(item)
    item.description=value;

  }

  else if(key.startsWith("productPrice-")){

   const id=
    key.replace(
     "productPrice-",
     ""
    );

   const item=findProduct(id);

   if(item)
    item.price=
     Number(value)||0;

  }

  else if(key.startsWith("productPortion-")){

   const id=
    key.replace(
     "productPortion-",
     ""
    );

   const item=findProduct(id);

   if(item)
    item.portion=value;

  }

  else if(key.startsWith("productCalories-")){

   const id=
    key.replace(
     "productCalories-",
     ""
    );

   const item=findProduct(id);

   if(item)
    item.calories=value;

  }

  else if(key.startsWith("productAllergens-")){

   const id=
    key.replace(
     "productAllergens-",
     ""
    );

   const item=findProduct(id);

   if(item){

    item.allergens=
     value
     .split(",")
     .map(x=>x.trim())
     .filter(Boolean);

   }

  }

  else if(key.startsWith("productSpicy-")){

   const id=
    key.replace(
     "productSpicy-",
     ""
    );

   const item=findProduct(id);

   if(item){

    item.spicy=Math.max(
     0,
     Math.min(
      5,
      Number(value)||0
     )
    );

   }

  }

  else if(key.startsWith("eventName-")){

   const id=
    key.replace(
     "eventName-",
     ""
    );

   const event=findEvent(id);

   if(event)
    event.name=value;

  }

  else if(key.startsWith("eventDate-")){

   const id=
    key.replace(
     "eventDate-",
     ""
    );

   const event=findEvent(id);

   if(event)
    event.date=value;

  }

  else if(key.startsWith("eventTime-")){

   const id=
    key.replace(
     "eventTime-",
     ""
    );

   const event=findEvent(id);

   if(event)
    event.time=value;

  }

  else if(key.startsWith("eventDescription-")){

   const id=
    key.replace(
     "eventDescription-",
     ""
    );

   const event=findEvent(id);

   if(event)
    event.description=value;

  }

 });

}

/* =========================================================
   FILE
   ========================================================= */

function readFileAsDataURL(file,callback){

 const reader=new FileReader();

 reader.onload=()=>{
  callback(reader.result);
 };

 reader.readAsDataURL(file);

}

function handleFile(type,id,file){

 if(!file)return;

 readFileAsDataURL(
  file,
  data=>{

   if(type==="logo")
    DATA.logo=data;

   else if(type==="backgroundImage"){

    DATA.background.image=data;
    DATA.background.type="image";

   }

   else if(type==="backgroundVideo"){

    DATA.background.video=data;
    DATA.background.type="video";

   }

   else if(type==="categoryImage"){

    const category=findCategory(id);

    if(category)
     category.image=data;

   }

   else if(type==="productImage"){

    const item=findProduct(id);

    if(item)
     item.image=data;

   }

   else if(type==="productVideo"){

    const item=findProduct(id);

    if(item)
     item.video=data;

   }

   else if(type==="eventImage"){

    const event=findEvent(id);

    if(event)
     event.image=data;

   }

   else if(type==="eventVideo"){

    const event=findEvent(id);

    if(event)
     event.video=data;

   }

   saveData();
   render();

  }
 );

}

 /* DELETE EVENT */

 document
 .querySelectorAll("[data-delete-event]")
 .forEach(button=>{

  button.onclick=()=>{

   if(!confirm(
    "Bu etkinlik silinsin mi?"
   ))return;

   DATA.events=
    DATA.events.filter(
     e=>
      e.id!==button.dataset.deleteEvent
    );

   saveData();

   render();

  };

 });

 /* ADD CATEGORY */

 $("addCategory")?.addEventListener(
  "click",
  ()=>{

   collectAdmin();

   const id=
    "category-"+Date.now();

   DATA.categories.push({

    id:id,

    name:"Yeni Kategori",

    image:"",

    items:[]

   });

   adminCategoryView=id;

   adminProductView=null;

   saveData();

   render();

  }
 );

 /* ADD PRODUCT */

 document
 .querySelectorAll("[data-add-product]")
 .forEach(button=>{

  button.onclick=()=>{

   collectAdmin();

   const category=
    findCategory(
     button.dataset.addProduct
    );

   if(!category)return;

   const id=
    "product-"+Date.now();

   category.items.push({

    id:id,

    name:"Yeni Ürün",

    description:"",

    portion:"",

    calories:"",

    allergens:[],

    spicy:0,

    price:0,

    image:"",

    video:"",

    featured:false,

    dish:false,

    sold:false

   });

   adminProductView=id;

   advancedProduct=false;

   saveData();

   render();

  };

 });

 /* ADD EVENT */

 $("addEvent")?.addEventListener(
  "click",
  ()=>{

   collectAdmin();

   DATA.events.push({

    id:"event-"+Date.now(),

    name:"Yeni Etkinlik",

    date:"Cumartesi",

    time:"20:00",

    description:"",

    image:"",

    video:""

   });

   saveData();

   render();

  }
 );

 /* SAVE PRODUCT */

 $("saveProductNow")?.addEventListener(
  "click",
  ()=>{

   collectAdmin();

   saveData();

   alert("Ürün kaydedildi.");

   adminProductView=null;

   advancedProduct=false;

   render();

  }
 );

 /* SAVE ALL */

 $("saveAdmin")?.addEventListener(
  "click",
  ()=>{

   collectAdmin();

   saveData();

   adminOpen=false;
   adminAuthenticated=false;

   adminCategoryView=null;
   adminProductView=null;

   render();

  }
 );

}

/* =========================================================
   START
   ========================================================= */

render();

</script>

</body>
</html>
