<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0b0b0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --bg:#0b0b0c;
 --card:#151517;
 --card2:#1b1b1e;
 --line:#29292d;
 --gold:#d6a83d;
 --gold2:#f0c45a;
 --text:#fff;
 --muted:#999;
}

#app{
 min-height:100vh;
 background:
 radial-gradient(circle at 50% -10%,#3a2d16 0%,#15120d 18%,#0b0b0c 45%);
}

.container{
 width:100%;
 max-width:600px;
 margin:auto;
 padding:0 16px 60px;
}

/* TOP */

.top{
 position:sticky;
 top:0;
 z-index:50;
 padding:12px 0;
 background:rgba(11,11,12,.92);
 backdrop-filter:blur(15px);
}

.topRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.topRight{
 display:flex;
 gap:7px;
}

.iconBtn{
 width:42px;
 height:42px;
 border-radius:50%;
 border:1px solid var(--line);
 background:#171719;
 color:#fff;
 font-size:20px;
}

.currencyBtn{
 height:42px;
 padding:0 15px;
 border:0;
 border-radius:22px;
 background:var(--gold);
 color:#111;
 font-weight:900;
}

.searchBox{
 margin-top:8px;
}

.searchBox input{
 width:100%;
 padding:13px 15px;
 border-radius:14px;
 border:1px solid var(--line);
 background:#151517;
 color:#fff;
 outline:none;
}

/* HERO */

.hero{
 text-align:center;
 padding:38px 0 28px;
}

.logo{
 width:92px;
 height:92px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 border:1px solid var(--gold);
 background:#111;
 color:var(--gold);
 font:42px Georgia,serif;
 box-shadow:0 0 35px rgba(214,168,61,.12);
}

.welcome{
 margin-top:17px;
 color:var(--gold2);
 font-size:10px;
 font-weight:900;
 letter-spacing:.3em;
}

.hero h1{
 margin:9px 0 5px;
 font:700 31px Georgia,serif;
}

.hero p{
 margin:0;
 color:#999;
 font-size:13px;
}

/* SECTION */

.section{
 margin-top:28px;
}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px;
}

.sectionHead h2{
 margin:0;
 font-size:19px;
}

.hint{
 color:#666;
 font-size:10px;
}

/* HORIZONTAL SLIDER */

.horizontal{
 display:flex;
 gap:12px;
 overflow-x:auto;
 scrollbar-width:none;
 scroll-snap-type:x mandatory;
}

.horizontal::-webkit-scrollbar{
 display:none;
}

.feature{
 position:relative;
 flex:0 0 84%;
 height:210px;
 padding:0;
 border:1px solid var(--line);
 border-radius:19px;
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
}

.feature img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.featureShade{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 25%,rgba(0,0,0,.9));
}

.featureText{
 position:absolute;
 left:16px;
 right:16px;
 bottom:15px;
 text-align:left;
}

.featureText strong{
 font-size:18px;
}

.featureText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:12px;
}

/* EVENTS */

.event{
 position:relative;
 flex:0 0 84%;
 height:190px;
 padding:0;
 border:1px solid var(--line);
 border-radius:19px;
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
}

.event img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.eventShade{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 25%,rgba(0,0,0,.9));
}

.eventDate{
 position:absolute;
 top:12px;
 left:12px;
 padding:7px 10px;
 border-radius:20px;
 background:rgba(0,0,0,.7);
 color:var(--gold2);
 font-size:10px;
}

.eventText{
 position:absolute;
 left:16px;
 right:16px;
 bottom:15px;
 text-align:left;
}

.eventText strong{
 font-size:18px;
}

.eventText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:12px;
}

/* CATEGORIES */

.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.category{
 position:relative;
 height:155px;
 padding:0;
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
 background:#171719;
}

.category img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.categoryShade{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 20%,rgba(0,0,0,.9));
}

.categoryText{
 position:absolute;
 left:14px;
 right:14px;
 bottom:13px;
 text-align:left;
}

.categoryText strong{
 font-size:18px;
}

.categoryText span{
 display:block;
 color:#aaa;
 font-size:10px;
 margin-top:4px;
}

/* CATEGORY PAGE */

.categoryTitle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:12px;
}

.backBtn{
 border:0;
 background:#1b1b1e;
 color:#fff;
 padding:10px 13px;
 border-radius:11px;
 font-size:11px;
 font-weight:800;
}

.stickyCategories{
 position:sticky;
 top:66px;
 z-index:35;
 margin:0 -16px;
 padding:10px 16px;
 background:rgba(11,11,12,.94);
 backdrop-filter:blur(14px);
 border-bottom:1px solid #202023;
}

.categoryTabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 scrollbar-width:none;
}

.categoryTabs::-webkit-scrollbar{
 display:none;
}

.categoryTabs button{
 flex:0 0 auto;
 padding:10px 14px;
 border:0;
 border-radius:11px;
 background:#18181a;
 color:#aaa;
 font-size:11px;
 font-weight:800;
}

.categoryTabs button.active{
 background:var(--gold);
 color:#111;
}

/* PRODUCTS */

.products{
 display:flex;
 flex-direction:column;
 gap:11px;
 margin-top:15px;
}

.product{
 display:grid;
 grid-template-columns:115px 1fr;
 min-height:120px;
 overflow:hidden;
 border:1px solid var(--line);
 border-radius:16px;
 background:#141416;
}

.productImage{
 height:120px;
 background:#1c1c1e;
}

.productImage img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.productInfo{
 padding:12px;
}

.productInfo h3{
 margin:0;
 font-size:15px;
}

.productInfo p{
 margin:6px 0;
 color:#929292;
 font-size:11px;
 line-height:1.45;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

.tag{
 padding:4px 7px;
 border-radius:6px;
 background:#222225;
 color:#aaa;
 font-size:9px;
}

.tag.sold{
 background:#7f1d1d;
 color:#fff;
}

.price{
 margin-top:8px;
 color:var(--gold2);
 font-weight:900;
 font-size:14px;
}

/* DRAWER */

.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(5px);
}

.drawer{
 width:min(88%,390px);
 height:100%;
 overflow:auto;
 padding:20px;
 background:#101011;
 box-shadow:10px 0 40px #000;
}

.drawerHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.drawerLogo{
 color:var(--gold);
 font:700 25px Georgia,serif;
}

.drawerSection{
 margin-top:25px;
}

.drawerLabel{
 color:#666;
 font-size:10px;
 letter-spacing:.15em;
 margin-bottom:8px;
}

.optionGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.optionGrid button,
.drawerLink{
 border:0;
 background:#18181a;
 color:#aaa;
 padding:11px;
 border-radius:10px;
 font-size:11px;
}

.optionGrid button.active{
 background:var(--gold);
 color:#111;
 font-weight:900;
}

.drawerLink{
 display:block;
 width:100%;
 text-align:left;
 margin-top:7px;
}

/* MODAL */

.modalOverlay{
 position:fixed;
 inset:0;
 z-index:150;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.75);
 backdrop-filter:blur(5px);
}

.modal{
 width:min(100%,600px);
 max-height:92vh;
 overflow:auto;
 border-radius:25px 25px 0 0;
 background:#101011;
}

.modalImage{
 position:relative;
 height:290px;
}

.modalImage img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.closeBtn{
 position:absolute;
 top:13px;
 right:13px;
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.7);
 color:#fff;
 font-size:23px;
}

.modalBody{
 padding:20px;
}

.modalBody h2{
 margin:0;
 font-size:26px;
}

.modalBody p{
 color:#999;
 font-size:13px;
 line-height:1.6;
}

.infoRow{
 display:flex;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid #252527;
 font-size:12px;
}

.infoRow span:last-child{
 color:#ddd;
 text-align:right;
}

.modalPrice{
 margin-top:16px;
 color:var(--gold2);
 font-size:25px;
 font-weight:900;
}

.actionRow{
 display:flex;
 gap:8px;
 margin-top:18px;
}

.action{
 flex:1;
 padding:13px;
 border-radius:12px;
 text-align:center;
 background:#202023;
 font-size:12px;
 font-weight:800;
}

.action.gold{
 background:var(--gold);
 color:#111;
}

/* ADMIN */

.adminOverlay{
 position:fixed;
 inset:0;
 z-index:250;
 background:rgba(0,0,0,.8);
 display:flex;
 justify-content:flex-end;
}

.admin{
 width:min(100%,600px);
 height:100%;
 overflow:auto;
 background:#0e0e0f;

.adminHeader{

 top:0;
 z-index:5;
 padding:15px;
 background:rgba(14,14,15,.97);
 border-bottom:1px solid var(--line);

.adminTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.adminTabs{
 display:flex;
 gap:6px;
 margin-top:12px;

.adminTabs button{
 flex:1;
 padding:10px;
 border:0;
 border-radius:9px;
 background:#19191b;
 color:#888;
 font-size:11px;
}

.adminTabs button.active{
 background:var(--gold);
 color:#111;
 font-weight:900;
}

.adminBody{
 padding:16px;

.field{
 margin-bottom:13px;

.field label{
 display:block;
 margin-bottom:5px;
 color:#777;
 font-size:10px;

 padding:11px;
 border:1px solid #303034;
 border-radius:10px;
 background:#171719;
 color:#fff;
 outline:none;

.adminCard{
 padding:13px;
 margin-bottom:10px;
 border:1px solid var(--line);
 border-radius:13px;
 background:#151517;

.toggle{

 align-items:center;
 justify-content:space-between;
 padding:12px;
 margin:7px 0;
 border:1px solid var(--line);
 border-radius:11px;
 background:#18181a;
 color:#ddd;
 font-size:12px;

.toggle input{
 width:18px;
 height:18px;
 accent-color:#d6a83d;

.adminButton{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 background:#202023;
 color:#fff;
 font-size:11px;
 font-weight:800;

.adminButton.gold{

.saveBar{
 position:sticky;
 bottom:0;

}

.footer{
 padding:35px 0;
 text-align:center;
 color:#555;
 font-size:10px;
}

.empty{
 padding:30px 10px;
 text-align:center;
 color:#666;
}

@media(max-width:390px){
 .categories{
  grid-template-columns:1fr;
 }
}

/* ---------- HELPERS ---------- */

function t(key){
 return TEXT[language]?.[key]||TEXT.tr[key]||key;
}

function escapeHTML(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function allProducts(){

 let result=[];

 DATA.categories.forEach(category=>{

  category.items.forEach(item=>{

   result.push({
    ...item,
    categoryId:category.id,
    categoryName:category.name
   });

  });

 });

 return result;
}

function findProduct(id){

 return allProducts().find(function(item){
  return item.id===id;
 })||null;

}

function money(price){

 let value=Number(price)||0;

 if(currency==="USD")
  value=value/DATA.rates.USD;

 if(currency==="EUR")
  value=value/DATA.rates.EUR;

 if(currency==="TRY")
  return Math.round(value).toLocaleString("tr-TR")+" ₺";

 if(currency==="USD")
  return "$"+value.toFixed(2);

 return "€"+value.toFixed(2);
}

 if(DATA.background?.type==="color"){

}

/* ============================================================

============================================================ */

function bindEvents(){

 /* DRAWER */

 const openDrawer=document.getElementById("openDrawer");

 if(openDrawer){

  openDrawer.onclick=function(){

   drawerOpen=true;
   render();

  };

 }


 const closeDrawer=document.getElementById("closeDrawer");

 .forEach(function(button){

    button.dataset.deleteProduct.split("|");

   const category=
    DATA.categories.find(function(category){

     return category.id===parts[0];

    });


   if(category){

    category.items=
     category.items.filter(function(item){

      return item.id!==parts[1];

     });

   }


   render();

  };

 });

/* ============================================================
   ADMIN DATA
============================================================ */

function collectAdmin(){

 document
 .querySelectorAll("[data-admin]")
 .forEach(function(input){

  const key=input.dataset.admin;

  if(key==="businessName")
   DATA.name=input.value;

  if(key==="subtitle")
   DATA.subtitle=input.value;

  if(key==="phone")
   DATA.phone=input.value;

  if(key==="whatsapp")
   DATA.whatsapp=input.value;

  if(key==="backgroundColor")
   DATA.background.value=input.value;

  if(key==="backgroundImage")
   DATA.background.image=input.value;


  if(key.startsWith("productName-")){

   const id=
    key.replace("productName-","");

   const item=findProduct(id);

   if(item)
    item.name=input.value;

  }


  if(key.startsWith("productPrice-")){

   const id=
    key.replace("productPrice-","");

   const item=findProduct(id);

   if(item)
    item.price=Number(input.value)||0;

  }


  if(key.startsWith("productPortion-")){

   const id=
    key.replace("productPortion-","");

   const item=findProduct(id);

   if(item)
    item.portion=input.value;

  }


  if(key.startsWith("productCalories-")){

   const id=
    key.replace("productCalories-","");

   const item=findProduct(id);

   if(item)
    item.calories=input.value;

  }

 });


 document
 .querySelectorAll("[data-category-name]")
 .forEach(function(input){

  const category=
   DATA.categories.find(function(category){

    return category.id===
     input.dataset.categoryName;

   });


  if(category)
   category.name=input.value;

 });

}
