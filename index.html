<style>
:root{
 --bg:#EBE9E5;--fg:#151514;--muted:color-mix(in srgb,var(--fg) 62%,transparent);
 --line:color-mix(in srgb,var(--fg) 14%,transparent);--card:color-mix(in srgb,var(--fg) 4%,transparent);
 --head:'Geist','Helvetica Neue',Arial,sans-serif;--accent:'Instrument Serif','Times New Roman',serif;
 --gut:clamp(20px,3.4vw,48px);
 color-scheme:light;
}
:root[data-theme="dark"]{--bg:#111110;--fg:#F1EFEA;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--head);-webkit-font-smoothing:antialiased;
 transition:background-color .6s ease,color .6s ease;overflow-x:hidden}
a{color:inherit}
img{max-width:100%}
::selection{background:var(--fg);color:var(--bg)}

/* ── hero ── */
.sh-root{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;isolation:isolate;container-type:size;
 background:var(--bg);color:var(--fg);touch-action:pan-y;display:flex;flex-direction:column}
.sh-stage{position:absolute;inset:0;z-index:0;pointer-events:none}
.sh-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s ease}
.sh-fallback{position:absolute;display:block;max-width:none;user-select:none;-webkit-user-drag:none;transition:opacity .5s ease}
.sh-root[data-gl="on"] .sh-canvas{opacity:1}
.sh-root[data-gl="on"] .sh-fallback{opacity:0}
.sh-root[data-swap="1"] .sh-canvas,.sh-root[data-swap="1"] .sh-fallback{opacity:0;transition-duration:.25s}
.sh-backdrop{position:absolute;left:50%;z-index:0;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;user-select:none;
 font-family:var(--head);font-weight:600;letter-spacing:-.06em;line-height:.8;color:color-mix(in srgb,var(--fg) 5%,transparent)}
.sh-nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px var(--gut) 0}
.sh-brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em;color:inherit;text-decoration:none;min-width:0}
.sh-brand img,.sh-brand .logo-mono{height:var(--logo-h,34px);width:auto;max-width:min(280px,48vw);object-fit:contain;display:block}
.sh-brand img.inv{filter:invert(1) hue-rotate(180deg)}
.sh-brand .logo-mono{background:currentColor;-webkit-mask:var(--logo-url) left center/contain no-repeat;mask:var(--logo-url) left center/contain no-repeat}
@media(max-width:640px){.sh-brand img,.sh-brand .logo-mono{height:calc(var(--logo-h,34px)*.8)}}
.sh-links{display:flex;align-items:center;gap:clamp(18px,2.4vw,36px);list-style:none;margin:0;padding:0}
.sh-link{color:inherit;text-decoration:none;font-size:13.5px;letter-spacing:-.005em;opacity:.72;transition:opacity .2s}
.sh-link:hover{opacity:1}
.sh-theme{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border-radius:50%;cursor:pointer;color:inherit;background:transparent;
 border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);transition:background .25s,color .25s}
.sh-theme:hover{background:var(--fg);color:var(--bg)}
.sh-navcta{color:inherit;text-decoration:none;font-size:13.5px;padding:8px 14px;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);
 border-radius:999px;transition:background .25s,color .25s;white-space:nowrap}
.sh-navcta:hover{background:var(--fg);color:var(--bg)}
.sh-hint{position:absolute;z-index:1;transform:translate(-50%,0);display:flex;align-items:center;gap:10px;white-space:nowrap;
 font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;pointer-events:none;transition:opacity .8s ease}
.sh-hint::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:sh-pulse 2.4s ease-in-out infinite}
.sh-root[data-touched="1"] .sh-hint{opacity:0}
@keyframes sh-pulse{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1);opacity:1}}
.sh-spacer{flex:1 1 auto;min-height:0}
.sh-content{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:end;
 gap:clamp(24px,4cqw,72px);padding:0 var(--gut) clamp(28px,3.4cqw,52px)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.62;margin:0 0 clamp(14px,1.6vw,22px);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor;opacity:.7}
.sh-h1{font-weight:500;font-size:clamp(40px,min(6.6cqw,11.5cqh),124px);line-height:.92;letter-spacing:-.045em;margin:0;text-wrap:balance}
.sh-h1 .sh-line{display:block}
.acc{font-family:var(--accent);font-style:italic;font-weight:400;letter-spacing:-.02em}
.sh-aside{max-width:400px;justify-self:end;padding-bottom:.6em}
.sh-body{font-size:clamp(15px,1.1cqw,17px);line-height:1.5;letter-spacing:-.01em;margin:0 0 26px;opacity:.78;text-wrap:pretty}
.ctas{display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;background:var(--fg);border:0;cursor:pointer;
 color:var(--bg);text-decoration:none;font:500 14.5px/1 var(--head);letter-spacing:-.01em;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.btn:hover{transform:translateY(-1px)}
.btn svg,.txt svg{transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.btn:hover svg,.txt:hover svg{transform:translateX(3px)}
.txt{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-size:14.5px;font-weight:500;letter-spacing:-.01em;
 padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 30%,transparent)}
a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
@container (max-width:1023px){
 .sh-content{grid-template-columns:1fr;gap:28px}
 .sh-aside{justify-self:start;max-width:520px;padding-bottom:0}
 .sh-h1{font-size:clamp(40px,min(9.5cqw,9cqh),96px)}
}
@container (max-width:767px){.sh-links li:not(.keep){display:none}}
@container (max-width:639px){
 .sh-nav{padding-top:20px}
 .sh-h1{font-size:clamp(36px,min(12.5cqw,7.2cqh),60px);line-height:.94}
 .sh-body{font-size:15px;margin-bottom:20px}
 .eyebrow{font-size:11px}
 .ctas{gap:18px}
 .btn{height:48px}
 .sh-content{padding-bottom:40px}
}

/* ── bölümler ── */
.sec{padding:clamp(72px,10vw,140px) var(--gut);border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,72px);align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.h2{font-weight:500;font-size:clamp(34px,5.2vw,76px);line-height:.95;letter-spacing:-.04em;margin:0;text-wrap:balance}
.lead{font-size:clamp(15px,1.25vw,18px);line-height:1.55;color:var(--muted);margin:0;max-width:520px;justify-self:end;text-wrap:pretty}
@media (max-width:860px){.sec-head{grid-template-columns:1fr}.lead{justify-self:start}}

/* projeler — dairesel karusel */
.cc{position:relative;outline:none;--cw:260px;--ch:173px}
.cc:focus-visible{outline:2px solid color-mix(in srgb,var(--fg) 35%,transparent);outline-offset:8px;border-radius:24px}
.cc-stage{position:relative;height:420px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
 mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.cc-card{position:absolute;left:50%;top:var(--ay,50%);width:var(--cw);height:var(--ch);margin:calc(var(--ch) / -2) 0 0 calc(var(--cw) / -2);padding:0;
 border:1px solid color-mix(in srgb,#fff 14%,transparent);border-radius:20px;overflow:hidden;cursor:pointer;background:#1b1b1a;color:#fff;text-align:left;font:inherit;
 transition:transform .65s cubic-bezier(.22,1,.36,1),opacity .65s cubic-bezier(.22,1,.36,1),box-shadow .3s;will-change:transform,opacity;
 box-shadow:0 10px 28px -8px rgba(0,0,0,.35)}
.cc-card.on{box-shadow:0 26px 70px -14px rgba(0,0,0,.55);cursor:default}
.cc-card.on.has-link{cursor:pointer}
.cc-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.cc-card.on:hover img{transform:scale(1.05)}
.cc-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%)}
.cc-card .cc-tag{position:absolute;top:12px;left:12px;z-index:1;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
 background:rgba(0,0,0,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(255,255,255,.88);max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-card .cc-name{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font-weight:600;font-size:clamp(14px,1.5vw,18px);line-height:1.15;letter-spacing:-.01em;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-card .cc-dot{position:absolute;top:14px;right:14px;z-index:1;width:8px;height:8px;border-radius:50%;background:#3fb27f;box-shadow:0 0 0 3px rgba(0,0,0,.3)}
.cc-card .cc-dot.dev{background:#d9a441}
.cc-count{position:absolute;left:50%;top:var(--ay,50%);transform:translate(-50%,-38%);text-align:center;pointer-events:none;line-height:1}
.cc-count b{display:block;font-weight:600;font-size:clamp(40px,5vw,56px);letter-spacing:-.04em;opacity:.9;font-variant-numeric:tabular-nums}
.cc-count span{display:block;margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.cc-info{max-width:640px;margin:clamp(20px,3vw,34px) auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.cc-info.swap{animation:ccIn .45s ease-out}
@keyframes ccIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cc-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cc-meta .st{display:inline-flex;align-items:center;gap:6px}
.cc-meta .st::before{content:"";width:6px;height:6px;border-radius:50%;background:#3fb27f}
.cc-meta .st.dev::before{background:#d9a441}
.cc-info h3{margin:0;font-weight:500;font-size:clamp(26px,3vw,40px);letter-spacing:-.03em;line-height:1.05}
.cc-info p{margin:0;color:var(--muted);font-size:15px;line-height:1.6;text-wrap:pretty}
.cc-info .txt{margin-top:4px}
.cc-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:clamp(6px,1.4vw,14px)}
.cc-btn{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;padding:0;cursor:pointer;color:inherit;background:var(--card);
 border:1px solid var(--line);transition:background .2s,transform .2s,border-color .2s}
.cc-btn:hover{border-color:color-mix(in srgb,var(--fg) 35%,transparent);transform:scale(1.06)}
.cc-btn:active{transform:scale(.95)}
.cc-dots{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;max-width:60vw}
.cc-dots button{width:8px;height:8px;padding:0;border:0;border-radius:999px;cursor:pointer;background:color-mix(in srgb,var(--fg) 22%,transparent);transition:width .3s,background .3s;position:relative}
.cc-dots button::before{content:"";position:absolute;inset:-10px -4px}
.cc-dots button.on{width:26px;background:color-mix(in srgb,var(--fg) 80%,transparent)}
@media (prefers-reduced-motion:reduce){.cc-card,.cc-card img{transition:none}.cc-info.swap{animation:none}}

/* referanslar — 3D coverflow */
.cf{position:relative;outline:none;--sw:250px;--sh:160px}
.cf:focus-visible{outline:2px solid color-mix(in srgb,var(--fg) 35%,transparent);outline-offset:8px;border-radius:24px}
.cf-stage{position:relative;height:calc(var(--sh) + 40px);perspective:1100px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;
 mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.cf-stage.drag{cursor:grabbing}
.cf-track{position:absolute;inset:0;transform-style:preserve-3d}
.cf-slide{position:absolute;left:50%;top:20px;width:var(--sw);height:var(--sh);margin-left:calc(var(--sw) / -2);padding:0;border:0;border-radius:18px;cursor:pointer;
 background:#F7F5F1;box-shadow:0 18px 40px -18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06);overflow:hidden;font:inherit;color:#151514;
 transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .7s;will-change:transform}
.cf-slide img{position:absolute;inset:16% 14% 24%;width:72%;height:60%;object-fit:contain;display:block;-webkit-user-drag:none}
.cf-slide span{position:absolute;left:10px;right:10px;bottom:10%;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.55;text-align:center;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,var(--shl,0)),rgba(0,0,0,var(--shr,0)));pointer-events:none;transition:opacity .7s}
.cf-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.cf-dots button{width:8px;height:8px;padding:0;border:0;border-radius:999px;cursor:pointer;background:color-mix(in srgb,var(--fg) 22%,transparent);transition:width .3s,background .3s;position:relative}
.cf-dots button::before{content:"";position:absolute;inset:-10px -4px}
.cf-dots button.on{width:22px;background:color-mix(in srgb,var(--fg) 80%,transparent)}
@media (prefers-reduced-motion:reduce){.cf-slide{transition:none}}

/* hizmetler */
.services{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.svc{padding:28px clamp(0px,1.4vw,22px) 8px 0;border-right:1px solid var(--line);margin-right:clamp(0px,1.4vw,22px);min-width:0}
.svc:last-child{border-right:0;margin-right:0}
.svc b{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin-bottom:34px}
.svc h3{margin:0 0 10px;font-weight:500;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.svc p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
@media (max-width:1000px){.services{grid-template-columns:repeat(2,minmax(0,1fr))}.svc:nth-child(2n){border-right:0;margin-right:0}.svc{border-bottom:1px solid var(--line);padding-bottom:28px}}
@media (max-width:560px){.services{grid-template-columns:1fr}.svc{border-right:0;margin-right:0}.svc b{margin-bottom:16px}}

/* süreç */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:baseline;padding:26px 0;border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-size:13px;letter-spacing:.1em;color:var(--muted)}
.step h3{margin:0;font-weight:500;font-size:clamp(26px,3vw,40px);letter-spacing:-.03em}
.step p{margin:0;color:var(--muted);font-size:16px;line-height:1.55}
@media (max-width:760px){.step{grid-template-columns:44px minmax(0,1fr)}.step p{grid-column:2}}

/* hakkında */
.about{display:grid;align-items:start;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(20px,5vw,90px)}
.about-text{font-size:clamp(22px,2.6vw,38px);line-height:1.22;letter-spacing:-.025em;margin:0;text-wrap:pretty}
.about-langs{margin-top:28px;color:var(--muted);font-size:14px;letter-spacing:.04em}
@media (max-width:860px){.about{grid-template-columns:1fr}}

/* iletişim */
.contact{text-align:center;padding-top:clamp(90px,12vw,170px);padding-bottom:clamp(90px,12vw,170px)}
.contact .h2{font-size:clamp(40px,7vw,108px);max-width:14ch;margin:0 auto}
.contact .lead{margin:24px auto 36px;justify-self:auto;text-align:center}
.contact .ctas{justify-content:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:14px;
 transition:background .25s,color .25s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{background:var(--fg);color:var(--bg)}
/* alt bilgi */
.ft{border-top:1px solid var(--line);padding:clamp(56px,7vw,96px) var(--gut) 0;font-size:14.5px}
.ft[hidden]{display:none}
.ft-grid{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:clamp(28px,4vw,64px)}
.ft-grid>[hidden]{display:none}
.ft-logo{display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:20px;letter-spacing:-.02em;max-width:100%}
.ft-logo img,.ft-logo .logo-mono{height:calc(var(--logo-h,34px)*1.1);width:auto;max-width:min(240px,70vw);object-fit:contain;display:block}
.ft-logo img.inv{filter:invert(1) hue-rotate(180deg)}
.ft-logo .logo-mono{background:currentColor;-webkit-mask:var(--logo-url) left center/contain no-repeat;mask:var(--logo-url) left center/contain no-repeat}
.ft-text{margin:18px 0 0;color:var(--muted);line-height:1.55;max-width:34ch;text-wrap:pretty}
.ft-contact{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.ft-contact[hidden]{display:none}
.ft-contact a{display:inline-flex;align-items:flex-start;gap:12px;min-height:40px;padding:9px 0;text-decoration:none;color:var(--muted);
 line-height:1.4;overflow-wrap:anywhere;transition:color .2s}
.ft-contact a:hover{color:var(--fg)}
.ft-contact svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--fg)}
.ft-contact a>span{min-width:0}
.ft-contact small{display:block;font-size:12px;opacity:.75;margin-top:2px}
.ft-social{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.ft-social:empty{display:none}
.ft-social a{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);color:var(--fg);
 transition:background .25s,color .25s,border-color .25s}
.ft-social a:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ft-social svg{width:18px;height:18px}
.ft-col h2{margin:6px 0 18px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.ft-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ft-col a{display:inline-block;padding:8px 0;text-decoration:none;color:var(--muted);line-height:1.35;overflow-wrap:anywhere;transition:color .2s}
.ft-col a:hover{color:var(--fg)}
.ft-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;margin-top:clamp(48px,6vw,80px);
 padding:20px 0 calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.ft-legal{background:none;border:0;padding:10px 0;margin:-10px 0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;
 text-decoration-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.ft-legal:hover{color:var(--fg)}
.ft-legal[hidden]{display:none}
body.has-wa .ft-bar{padding-right:84px}
body.has-wa.wa-left .ft-bar{padding-right:0;padding-left:84px}
@media (max-width:1000px){.ft-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.ft-brand{grid-column:1/-1}}
@media (max-width:640px){
 .ft-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 20px}
 .ft-col h2{margin-bottom:10px}
 .ft-bar{flex-direction:column;align-items:flex-start}
 body.has-wa .ft-bar,body.has-wa.wa-left .ft-bar{padding-left:0;padding-right:0;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
}

/* sabit WhatsApp butonu */
.wa-float{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:calc(20px + env(safe-area-inset-right));z-index:40;width:56px;height:56px;
 border-radius:50%;display:grid;place-items:center;background:#25D366;color:#fff;box-shadow:0 12px 30px -8px rgba(0,0,0,.45);
 transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .3s;animation:waIn .5s .8s both cubic-bezier(.2,.7,.2,1)}
.wa-float.left{right:auto;left:calc(20px + env(safe-area-inset-left))}
.wa-float:hover{transform:scale(1.07)}
.wa-float svg{width:28px;height:28px}
.wa-float[hidden]{display:none}
@keyframes waIn{from{opacity:0;transform:translateY(16px) scale(.8)}to{opacity:1;transform:none}}
@media (max-width:640px){.wa-float{width:52px;height:52px;bottom:calc(16px + env(safe-area-inset-bottom))}.wa-float:not(.left){right:calc(16px + env(safe-area-inset-right))}.wa-float.left{left:calc(16px + env(safe-area-inset-left))}}
@media (prefers-reduced-motion:reduce){.wa-float{animation:none}}

/* KVKK penceresi */
.legal{width:min(680px,calc(100vw - 32px));max-height:min(80svh,760px);padding:0;border:1px solid var(--line);border-radius:22px;
 background:var(--bg);color:var(--fg);box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.legal[open]{display:flex;flex-direction:column}
.legal::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.legal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 18px 16px 24px;border-bottom:1px solid var(--line)}
.legal-head h2{margin:0;font-weight:500;font-size:22px;letter-spacing:-.02em}
.legal-x{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.legal-x:hover{background:var(--fg);color:var(--bg)}
.legal-body{padding:20px 24px 28px;overflow-y:auto;overscroll-behavior:contain;font-size:15px;line-height:1.65;color:var(--muted)}
.legal-body p{margin:0 0 14px;white-space:pre-line;overflow-wrap:anywhere}
.legal-body p b{display:block;color:var(--fg);font-weight:600;margin-bottom:2px}

/* görünür olunca yumuşak giriş */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.sh-hint::before{animation:none}}
</style>
</head>
<body>

<section class="sh-root" id="hero" aria-label="Giriş">
 <div class="sh-backdrop" id="backdrop" aria-hidden="true"></div>
 <div class="sh-stage" id="stage" aria-hidden="true"><img class="sh-fallback" id="fallback" alt="" crossorigin="anonymous" draggable="false"></div>
 <nav class="sh-nav" id="nav" aria-label="Ana menü">
  <a class="sh-brand" href="/" id="brand"></a>
  <ul class="sh-links">
   <li><a class="sh-link" href="#projeler">Projeler</a></li>
   <li id="navRef" hidden><a class="sh-link" href="#referanslar">Referanslar</a></li>
   <li><a class="sh-link" href="#hizmetler">Hizmetler</a></li>
   <li><a class="sh-link" href="#surec">Süreç</a></li>
   <li><a class="sh-link" href="#hakkinda">Hakkında</a></li>
   <li class="keep"><button type="button" class="sh-theme" id="themeBtn" aria-label="Temayı değiştir"></button></li>
   <li class="keep"><a class="sh-navcta" href="#iletisim">İletişim</a></li>
  </ul>
 </nav>
 <div class="sh-hint" id="hint" aria-hidden="true"></div>
 <div class="sh-spacer"></div>
 <div class="sh-content" id="heroContent">
  <div>
   <p class="eyebrow" id="eyebrow"></p>
   <h1 class="sh-h1" id="headline"></h1>
  </div>
  <div class="sh-aside">
   <p class="sh-body" id="heroBody"></p>
   <div class="ctas" id="heroCtas"></div>
  </div>
 </div>
</section>

<main>
 <section class="sec" id="projeler">
  <div class="sec-head rv"><h2 class="h2" id="projTitle"></h2><p class="lead" id="projIntro"></p></div>
  <div class="projects" id="projects"></div>
 </section>

 <section class="sec" id="referanslar" hidden>
  <div class="sec-head rv"><h2 class="h2" id="refTitle"></h2><p class="lead" id="refIntro"></p></div>
  <div class="cf rv" id="clients" tabindex="0" role="region" aria-roledescription="karusel" aria-label="Referanslar"></div>
 </section>

 <section class="sec" id="hizmetler">
  <div class="sec-head rv"><h2 class="h2" id="svcTitle"></h2><p class="lead"></p></div>
  <div class="services rv" id="services"></div>
 </section>

 <section class="sec" id="surec">
  <div class="sec-head rv"><h2 class="h2" id="stepsTitle"></h2><p class="lead"></p></div>
  <ol class="steps rv" id="steps"></ol>
 </section>

 <section class="sec" id="hakkinda">
  <div class="about rv">
   <p class="eyebrow" id="aboutTitle"></p>
   <div><p class="about-text" id="aboutText"></p><div class="about-langs" id="langs"></div></div>
  </div>
 </section>

 <section class="sec contact" id="iletisim">
  <div class="rv">
   <h2 class="h2" id="contactTitle"></h2>
   <p class="lead" id="contactText"></p>
   <div class="ctas" id="contactCtas"></div>
   <div class="chips" id="chips"></div>
  </div>
 </section>
</main>

<footer class="ft" id="footer">
 <div class="ft-grid">
  <div class="ft-brand">
   <a class="ft-logo" href="/" id="ftLogo"></a>
   <p class="ft-text" id="ftText"></p>
   <ul class="ft-contact" id="ftContact"></ul>
   <div class="ft-social" id="ftSocial"></div>
  </div>
  <nav class="ft-col" id="ftCorp" aria-labelledby="ftCorpT"><h2 id="ftCorpT"></h2><ul></ul></nav>
  <nav class="ft-col" id="ftSvc" aria-labelledby="ftSvcT"><h2 id="ftSvcT"></h2><ul></ul></nav>
  <nav class="ft-col" id="ftDemo" aria-labelledby="ftDemoT"><h2 id="ftDemoT"></h2><ul></ul></nav>
 </div>
 <div class="ft-bar">
  <button type="button" class="ft-legal" id="ftPrivacy"></button>
  <span id="ftCopy"></span>
 </div>
</footer>

<a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp'tan yazın" hidden></a>

<dialog class="legal" id="legal" aria-labelledby="legalTitle">
 <div class="legal-head"><h2 id="legalTitle"></h2><button type="button" class="legal-x" id="legalClose" aria-label="Kapat"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
 <div class="legal-body" id="legalBody"></div>
</dialog>

<script src="/assets/site.js"></script>
</body>
</html>
