<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>NearMenu</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 min-height:100%;
 background:#09090a;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
body{min-height:100vh}
body.modalOpen{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 --accent:#d6a83d;
 --accent2:#f0c45a;
 --text:#fff;
 --muted:#929296;
 --price:#f0c45a;
 --card:#151517;
 --cardText:#fff;
 --line:#29292d;
 --overlay:.55;
 --cardOpacity:.94;
 --cardRadius:20px;
 --titleSize:34px;
 --bodySize:13px;
 --logoSize:112px;
 --fontFamily:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 --titleFont:Georgia,serif;
}

body{
 font-family:var(--fontFamily);
 color:var(--text);
 font-size:var(--bodySize);
}

#app{min-height:100vh}

.container{
 width:100%;
 max-width:650px;
 margin:auto;
 padding:0 16px 80px;
}

/* BACKGROUND */

.background{
 position:fixed;
 inset:0;
 z-index:-10;
 overflow:hidden;
 background:#0b0b0c;
}

.background img,
.background video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.backgroundOverlay{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,var(--overlay));
}

/* TOP */

.top{
 position:sticky;
 top:0;
 z-index:90;
 padding:11px 0;
 background:rgba(10,10,11,.82);
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 border-bottom:1px solid rgba(255,255,255,.04);
}

.topRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.topRight{
 display:flex;
 align-items:center;
 gap:7px;
 position:relative;
}

.iconBtn{
 width:43px;
 height:43px;
 flex:0 0 43px;
 border:1px solid rgba(255,255,255,.08);
 border-radius:50%;
 background:rgba(25,25,27,.92);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 transition:.2s;
}

.iconBtn:active{transform:scale(.93)}

.currencyBtn{
 height:43px;
 min-width:49px;
 padding:0 15px;
 border:1px solid rgba(255,255,255,.06);
 border-radius:23px;
 background:var(--accent);
 color:#111;
 font-weight:950;
 box-shadow:0 7px 22px rgba(0,0,0,.22);
}

.languageBtn{
 font-size:10px;
 font-weight:900;
 letter-spacing:.02em;
}

.searchBox{margin-top:9px}

.searchBox input{
 width:100%;
 padding:14px 16px;
 border-radius:15px;
 border:1px solid rgba(255,255,255,.08);
 background:#151517;
 color:#fff;
 outline:none;
}

.searchBox input:focus{
 border-color:var(--accent);
 box-shadow:0 0 0 3px rgba(214,168,61,.10);
}

/* POPUPS */

.quickPopup{
 position:absolute;
 right:0;
 top:51px;
 width:185px;
 padding:7px;
 border:1px solid rgba(255,255,255,.11);
 border-radius:16px;
 background:rgba(20,20,22,.97);
 box-shadow:0 22px 60px rgba(0,0,0,.65);
 backdrop-filter:blur(25px);
 -webkit-backdrop-filter:blur(25px);
 z-index:500;
 animation:popupIn .16s ease;
}

.quickPopup button{
 width:100%;
 min-height:43px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:10px 12px;
 margin:2px 0;
 border:0;
 border-radius:11px;
 background:transparent;
 color:#aaa;
 text-align:left;
 font-size:12px;
 font-weight:800;
}

.quickPopup button:hover{
 background:#262629;
 color:#fff;
}

.quickPopup button.active{
 background:var(--accent);
 color:#111;
}

@keyframes popupIn{
 from{opacity:0;transform:translateY(-5px) scale(.98)}
 to{opacity:1;transform:none}
}

/* HERO */

.hero{
 text-align:center;
 padding:48px 0 28px;
}

.logo{
 width:var(--logoSize);
 height:var(--logoSize);
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 border:1px solid var(--accent);
 background:rgba(15,15,16,.94);
 color:var(--accent);
 font:42px Georgia,serif;
 box-shadow:
  0 0 0 7px rgba(214,168,61,.035),
  0 0 55px rgba(214,168,61,.15);
 overflow:hidden;
 transition:.25s;
}

.logo img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.welcome{
 margin-top:18px;
 color:var(--accent2);
 font-size:9px;
 font-weight:950;
 letter-spacing:.34em;
}

.hero h1{
 margin:10px 0 7px;
 color:var(--text);
 font:700 var(--titleSize) var(--titleFont);
 line-height:1.05;
 letter-spacing:-.03em;
}

.hero p{
 max-width:480px;
 margin:0 auto;
 color:var(--muted);
 font-size:var(--bodySize);
 line-height:1.6;
}

/* SECTION */

.section{margin-top:31px}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:14px;
}

.sectionHead h2{
 margin:0;
 font-size:20px;
 letter-spacing:-.02em;
}

.hint{
 color:#666;
 font-size:10px;
}

/* HORIZONTAL */

.horizontal{
 display:flex;
 gap:13px;
 overflow-x:auto;
 scrollbar-width:none;
 scroll-snap-type:x mandatory;
 padding-bottom:3px;
}

.horizontal::-webkit-scrollbar{display:none}

/* FEATURE */

.feature{
 position:relative;
 flex:0 0 88%;
 height:235px;
 padding:0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
 box-shadow:0 18px 50px rgba(0,0,0,.30);
}

.feature img,
.feature video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.featureShade{
 position:absolute;
 inset:0;
 background:
  linear-gradient(
   180deg,
   transparent 20%,
   rgba(0,0,0,.12) 45%,
   rgba(0,0,0,.92) 100%
  );
}

.featureText{
 position:absolute;
 left:18px;
 right:18px;
 bottom:17px;
 text-align:left;
}

.featureText strong{
 display:block;
 font-size:20px;
}

.featureText span{
 display:block;
 margin-top:6px;
 color:var(--price);
 font-weight:950;
}

/* EVENTS */

.event{
 position:relative;
 flex:0 0 88%;
 height:200px;
 padding:0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start;
}

.event img,
.event video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.eventShade{
 position:absolute;
 inset:0;
 background:
  linear-gradient(
   180deg,
   transparent 15%,
   rgba(0,0,0,.92)
  );
}

.eventDate{
 position:absolute;
 top:12px;
 left:12px;
 padding:8px 11px;
 border-radius:20px;
 background:rgba(0,0,0,.72);
 color:var(--accent2);
 font-size:10px;
 backdrop-filter:blur(10px);
}

.eventText{
 position:absolute;
 left:17px;
 right:17px;
 bottom:15px;
 text-align:left;
}

.eventText strong{font-size:18px}

.eventText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:11px;
}

/* CATEGORIES */

.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px;
}

.category{
 position:relative;
 height:170px;
 padding:0;
 border:1px solid rgba(255,255,255,.08);
 border-radius:var(--cardRadius);
 overflow:hidden;
 background:#171719;
 box-shadow:0 14px 38px rgba(0,0,0,.20);
}

.category img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.categoryShade{
 position:absolute;
 inset:0;
 background:
  linear-gradient(
   180deg,
   transparent 10%,
   rgba(0,0,0,.94)
  );
}

.categoryText{
 position:absolute;
 left:15px;
 right:15px;
 bottom:15px;
 text-align:left;
}

.categoryText strong{
 display:block;
 font-size:18px;
}

.categoryText span{
 display:block;
 color:#aaa;
 font-size:10px;
 margin-top:4px;
}

/* CATEGORY PAGE */

.categoryTitle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:13px;
}

.backBtn{
 border:1px solid rgba(255,255,255,.07);
 background:#1b1b1e;
 color:#fff;
 padding:10px 13px;
 border-radius:11px;
 font-size:11px;
 font-weight:850;
}

.stickyCategories{
 position:sticky;
 top:68px;
 z-index:35;
 margin:0 -16px;
 padding:10px 16px;
 background:rgba(11,11,12,.94);
 backdrop-filter:blur(17px);
 -webkit-backdrop-filter:blur(17px);
 border-bottom:1px solid #202023;
}

.categoryTabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 scrollbar-width:none;
}

.categoryTabs::-webkit-scrollbar{display:none}

.categoryTabs button{
 flex:0 0 auto;
 padding:10px 14px;
 border:0;
 border-radius:11px;
 background:#18181a;
 color:#aaa;
 font-size:11px;
 font-weight:850;
}

.categoryTabs button.active{
 background:var(--accent);
 color:#111;
}

/* PRODUCTS */

.products{
 display:flex;
 flex-direction:column;
 gap:12px;
 margin-top:16px;
}

.product{
 display:grid;
 grid-template-columns:120px 1fr;
 min-height:122px;
 overflow:hidden;
 border:1px solid rgba(255,255,255,.07);
 border-radius:var(--cardRadius);
 background:rgba(20,20,22,var(--cardOpacity));
 cursor:pointer;
 box-shadow:0 13px 35px rgba(0,0,0,.18);
 transition:.2s;
}

.product:active{transform:scale(.985)}

.productImage{
 height:122px;
 background:#1c1c1e;
}

.productImage img,
.productImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.productInfo{
 min-width:0;
 padding:13px;
}

.productInfo h3{
 margin:0;
 color:var(--cardText);
 font-size:15px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.productInfo p{
 margin:6px 0;
 color:#929292;
 font-size:11px;
 line-height:1.45;
 display:-webkit-box;
 -webkit-line-clamp:2;
 -webkit-box-orient:vertical;
 overflow:hidden;
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
}

.tag{
 padding:4px 7px;
 border-radius:7px;
 background:#222225;
 color:#aaa;
 font-size:9px;
}

.tag.sold{
 background:#7f1d1d;
 color:#fff;
}

.price{
 margin-top:8px;
 color:var(--price);
 font-weight:950;
 font-size:14px;
}

/* DRAWER */

.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(6px);
 -webkit-backdrop-filter:blur(6px);
}

.drawer{
 width:min(88%,390px);
 height:100%;
 overflow:auto;
 padding:20px;
 background:#101011;
 box-shadow:10px 0 50px #000;
 animation:drawerIn .2s ease;
}

@keyframes drawerIn{
 from{transform:translateX(-100%)}
 to{transform:none}
}

.drawerHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.drawerLogo{
 color:var(--accent);
 font:700 25px Georgia,serif;
}

.drawerSection{margin-top:25px}

.drawerLabel{
 color:#666;
 font-size:10px;
 letter-spacing:.15em;
 margin-bottom:8px;
}

.drawerLink{
 display:block;
 width:100%;
 border:0;
 background:#18181a;
 color:#aaa;
 padding:13px;
 border-radius:10px;
 font-size:11px;
 text-align:left;
 margin-top:7px;
}

/* MODAL */

.modalOverlay{
 position:fixed;
 inset:0;
 z-index:150;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.76);
 backdrop-filter:blur(7px);
 -webkit-backdrop-filter:blur(7px);
}

.modal{
 width:min(100%,650px);
 max-height:92vh;
 overflow:auto;
 border-radius:27px 27px 0 0;
 background:#101011;
 box-shadow:0 -15px 60px rgba(0,0,0,.5);
 animation:modalUp .22s ease;
}

@keyframes modalUp{
 from{transform:translateY(100%)}
 to{transform:none}
}

.modalImage{
 position:relative;
 height:310px;
 background:#18181a;
}

.modalImage img,
.modalImage video{
 width:100%;
 height:100%;
 object-fit:cover;
}

.closeBtn{
 position:absolute;
 top:13px;
 right:13px;
 width:41px;
 height:41px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.72);
 color:#fff;
 font-size:23px;
}

.modalBody{padding:21px}

.modalBody h2{
 margin:0;
 font-size:27px;
 letter-spacing:-.03em;
}

.modalBody p{
 color:#999;
 font-size:13px;
 line-height:1.65;
}

.infoRow{
 display:flex;
 justify-content:space-between;
 gap:20px;
 padding:13px 0;
 border-bottom:1px solid #252527;
 font-size:12px;
}

.infoRow span:last-child{
 color:#ddd;
 text-align:right;
}

.modalPrice{
 margin-top:18px;
 color:var(--price);
 font-size:26px;
 font-weight:950;
}

/* ADMIN */

.adminOverlay{
 position:fixed;
 inset:0;
 z-index:250;
 background:rgba(0,0,0,.82);
 display:flex;
 justify-content:flex-end;
}

.admin{
 width:min(100%,650px);
 height:100%;
 overflow:auto;
 background:#0e0e0f;
 animation:adminIn .22s ease;
}

@keyframes adminIn{
 from{transform:translateX(100%)}
 to{transform:none}
}

.adminHeader{
 position:sticky;
 top:0;
 z-index:20;
 padding:15px;
 background:rgba(14,14,15,.98);
 border-bottom:1px solid var(--line);
 backdrop-filter:blur(15px);
 -webkit-backdrop-filter:blur(15px);
}

.adminTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.adminTitle{
 display:flex;
 align-items:center;
 gap:9px;
}

.adminTitleIcon{
 width:34px;
 height:34px;
 border-radius:10px;
 background:var(--accent);
 color:#111;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:950;
}

.adminTabs{
 display:flex;
 gap:6px;
 margin-top:12px;
}

.adminTabs button{
 flex:1;
 padding:11px 7px;
 border:0;
 border-radius:10px;
 background:#19191b;
 color:#888;
 font-size:11px;
}

.adminTabs button.active{
 background:var(--accent);
 color:#111;
 font-weight:950;
}

.adminBody{padding:16px}

.field{margin-bottom:13px}

.field label{
 display:block;
 margin-bottom:6px;
 color:#777;
 font-size:10px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:12px;
 border:1px solid #303034;
 border-radius:11px;
 background:#171719;
 color:#fff;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:var(--accent);
 box-shadow:0 0 0 3px rgba(214,168,61,.08);
}

.field textarea{
 min-height:82px;
 resize:vertical;
}

.adminCard{
 padding:15px;
 margin-bottom:12px;
 border:1px solid var(--line);
 border-radius:16px;
 background:#151517;
}

.adminCardTitle{
 font-size:15px;
 font-weight:900;
 margin-bottom:5px;
}

.adminButton{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 background:#202023;
 color:#fff;
 font-size:11px;
 font-weight:850;
}

.adminButton.gold{
 background:var(--accent);
 color:#111;
}

.adminButton.danger{
 background:#7f1d1d;
 color:#fff;
}

.adminButton.green{
 background:#166534;
 color:#fff;
}

.saveBar{
 position:sticky;
 bottom:0;
 padding:12px 16px;
 background:rgba(14,14,15,.98);
 border-top:1px solid var(--line);
 z-index:20;
 backdrop-filter:blur(15px);
}

.row{
 display:flex;
 gap:8px;
}

.row>*{
 flex:1;
 min-width:0;
}

.small{
 color:#777;
 font-size:10px;
 line-height:1.5;
}

.help{
 color:#777;
 font-size:10px;
 line-height:1.55;
 margin-top:5px;
}

/* ADMIN LISTS */

.adminCategoryList,
.adminProductList{
 display:flex;
 flex-direction:column;
 gap:9px;
 margin-top:15px;
}

.adminCategoryItem,
.adminProductItem{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 border:1px solid var(--line);
 border-radius:14px;
 background:#151517;
 color:#fff;
 text-align:left;
 width:100%;
}

.adminCategoryThumb,
.adminProductThumb{
 width:55px;
 height:55px;
 flex:0 0 55px;
 border-radius:11px;
 overflow:hidden;
 background:#222225;
}

.adminCategoryThumb img,
.adminProductThumb img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.adminCategoryInfo,
.adminProductInfo{
 flex:1;
 min-width:0;
}

.adminCategoryInfo strong,
.adminProductInfo strong{
 display:block;
 font-size:14px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.adminCategoryInfo span,
.adminProductInfo span{
 display:block;
 margin-top:4px;
 color:#777;
 font-size:10px;
}

.adminProductInfo span{color:var(--accent2)}

.adminArrow{
 color:#777;
 font-size:20px;
}

/* BREADCRUMB */

.adminBreadcrumb{
 display:flex;
 align-items:center;
 gap:9px;
 margin-bottom:13px;
 color:#777;
 font-size:12px;
}

.adminBreadcrumb button{
 border:0;
 background:none;
 color:var(--accent2);
 padding:4px 0;
 font-weight:800;
}

.adminBreadcrumb strong{color:#fff}

/* FILE */

.fileBox{
 display:flex;
 gap:7px;
}

.fileBtn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:5px;
 flex:1;
 padding:11px;
 border:1px solid #303034;
 border-radius:10px;
 background:#18181a;
 color:#ddd;
 font-size:11px;
 font-weight:800;
 cursor:pointer;
}

.preview{
 width:100%;
 max-height:180px;
 object-fit:cover;
 border-radius:12px;
 margin-top:8px;
 border:1px solid #303034;
}

/* DESIGN */

.designGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.designCard{
 padding:12px;
 border-radius:12px;
 background:#18181a;
 border:1px solid #252527;
}

.designCard h4{
 margin:0 0 9px;
 font-size:11px;
 color:#bbb;
}

.colorInput{
 width:100%;
 height:42px;
 padding:3px;
 border:1px solid #303034;
 border-radius:10px;
 background:#171719;
}

.presetRow{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.preset{
 width:38px;
 height:38px;
 border-radius:11px;
 border:2px solid transparent;
}

.preset.active{
 border-color:#fff;
 box-shadow:0 0 0 2px var(--accent);
}

.rangeRow{
 display:flex;
 align-items:center;
 gap:10px;
}

.rangeRow input{flex:1}

.rangeValue{
 width:48px;
 text-align:right;
 color:var(--accent2);
 font-size:10px;
}

.toggle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
 margin:7px 0;
 border:1px solid var(--line);
 border-radius:11px;
 background:#18181a;
 color:#ddd;
 font-size:12px;
}

.toggle input{
 width:18px;
 height:18px;
 accent-color:var(--accent);
}

/* PRODUCT FORM */

.simpleProductHero{
 padding:14px;
 margin-bottom:12px;
 border:1px solid rgba(214,168,61,.20);
 border-radius:16px;
 background:
  linear-gradient(
   135deg,
   rgba(214,168,61,.10),
   rgba(255,255,255,.02)
  );
}

.simpleProductHero strong{
 display:block;
 font-size:16px;
}

.simpleProductHero span{
 display:block;
 margin-top:5px;
 color:#777;
 font-size:10px;
}

.advancedButton{
 width:100%;
 padding:12px;
 border:1px solid #303034;
 border-radius:11px;
 background:#18181a;
 color:#ddd;
 font-size:11px;
 font-weight:850;
}

/* LANGUAGE FORM */

.langSection{
 padding:13px;
 margin-top:10px;
 border:1px solid #29292d;
 border-radius:13px;
 background:#111113;
}

.langSectionTitle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 margin-bottom:12px;
}

.langBadge{
 padding:5px 8px;
 border-radius:7px;
 background:#222225;
 color:#aaa;
 font-size:9px;
 font-weight:900;
}

.langBadge.active{
 background:var(--accent);
 color:#111;
}

/* LOGIN */

.adminLoginOverlay{
 position:fixed;
 inset:0;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:rgba(0,0,0,.92);
 backdrop-filter:blur(12px);
}

/* =========================================================

========================================================= */

function storageAvailable(){
 try{
  const x="__near_test__";
  localStorage.setItem(x,x);
  localStorage.removeItem(x);
  return true;
 }catch(e){
  return false;
 }
}

function safeGet(key){
 if(!storageAvailable())return null;
 try{return localStorage.getItem(key)}
 catch(e){return null}
}

function safeSet(key,value){
 if(!storageAvailable())return false;
 try{
  localStorage.setItem(key,value);
  return true;
 }catch(e){
  console.warn("Storage:",e);
  return false;
 }
}

function getAdminPin(){
 return safeGet(PIN_KEY)||DEFAULT_ADMIN_PIN;

/* =========================================================
   DATA MIGRATION
========================================================= */

function ensureTranslations(obj,baseKey,translationsKey){

 if(!obj)return;

 if(!obj[translationsKey]||
    typeof obj[translationsKey]!=="object"){
  obj[translationsKey]={
   tr:obj[baseKey]||"",
   en:obj[baseKey]||"",
   ar:obj[baseKey]||""
  };
 }

 ["tr","en","ar"].forEach(lang=>{
  if(
   obj[translationsKey][lang]===undefined||
   obj[translationsKey][lang]===null||
   obj[translationsKey][lang]===""
  ){
   obj[translationsKey][lang]=obj[baseKey]||"";
  }
 });

}

function ensureArrayTranslations(obj,baseKey,translationsKey){

 if(!obj)return;

 if(!obj[translationsKey]||
    typeof obj[translationsKey]!=="object"){
  obj[translationsKey]={
   tr:Array.isArray(obj[baseKey])?obj[baseKey].slice():[],
   en:Array.isArray(obj[baseKey])?obj[baseKey].slice():[],
   ar:Array.isArray(obj[baseKey])?obj[baseKey].slice():[]
  };
 }

 ["tr","en","ar"].forEach(lang=>{
  if(!Array.isArray(obj[translationsKey][lang])){
   obj[translationsKey][lang]=
    Array.isArray(obj[baseKey])
    ?obj[baseKey].slice()
    :[];
  }
 });

}

function normalizeProduct(p){

 if(!p.id)p.id=uid("product");

 if(typeof p.name==="undefined")p.name="Yeni Ürün";
 if(typeof p.description==="undefined")p.description="";
 if(typeof p.portion==="undefined")p.portion="";
 if(typeof p.calories==="undefined")p.calories="";
 if(!Array.isArray(p.allergens))p.allergens=[];
 if(typeof p.spicy==="undefined")p.spicy=0;
 if(typeof p.price==="undefined")p.price=0;
 if(typeof p.image==="undefined")p.image="";
 if(typeof p.video==="undefined")p.video="";
 if(typeof p.featured==="undefined")p.featured=false;
 if(typeof p.dish==="undefined")p.dish=false;
 if(typeof p.sold==="undefined")p.sold=false;

 ensureTranslations(p,"name","names");
 ensureTranslations(p,"description","descriptions");
 ensureTranslations(p,"portion","portionTranslations");
 ensureArrayTranslations(p,"allergens","allergensTranslations");

 return p;
}

function normalizeCategory(c){

 if(!c.id)c.id=uid("category");

 if(typeof c.name==="undefined")c.name="Yeni Kategori";
 if(typeof c.image==="undefined")c.image="";
 if(!Array.isArray(c.items))c.items=[];

 ensureTranslations(c,"name","names");

 c.items=c.items.map(normalizeProduct);

 return c;
}

function normalizeEvent(e){

 if(!e.id)e.id=uid("event");

 if(typeof e.name==="undefined")e.name="Yeni Etkinlik";
 if(typeof e.date==="undefined")e.date="Cumartesi";
 if(typeof e.time==="undefined")e.time="20:00";
 if(typeof e.description==="undefined")e.description="";
 if(typeof e.image==="undefined")e.image="";
 if(typeof e.video==="undefined")e.video="";

 ensureTranslations(e,"name","names");
 ensureTranslations(e,"date","dateTranslations");
 ensureTranslations(e,"description","descriptions");

 return e;
}

function mergeData(saved){

 if(!saved||typeof saved!=="object")return;

 Object.keys(saved).forEach(key=>{

  if(
   key==="theme"||
   key==="settings"||
   key==="background"||
   key==="rates"
  ){

   DATA[key]=Object.assign(
    {},
    DATA[key]||{},
    saved[key]||{}
   );

  }else if(key==="categories"||key==="events"){

   if(Array.isArray(saved[key]))
    DATA[key]=saved[key];

  }else{

   DATA[key]=saved[key];

  }

 });

 DATA.theme=Object.assign({
  accent:"#d6a83d",
  accent2:"#f0c45a",
  text:"#ffffff",
  cardText:"#ffffff",
  price:"#f0c45a",
  overlay:.55,
  cardOpacity:.94,
  cardRadius:20,
  logoSize:112,
  titleSize:34,
  bodySize:13,
  fontFamily:"system",
  titleFont:"Georgia"
 },DATA.theme||{});

 DATA.settings=Object.assign({
  portion:true,
  calories:true,
  allergens:true,
  spicy:true,
  sold:true,
  hours:true,
  dish:true,
  featured:true,
  events:true,
  search:true
 },DATA.settings||{});

 DATA.background=Object.assign({
  type:"color",
  value:"#0b0b0c",
  image:"",
  video:""
 },DATA.background||{});

 DATA.rates=Object.assign({
  USD:40,
  EUR:47
 },DATA.rates||{});

 if(!Array.isArray(DATA.categories))
  DATA.categories=[];

 if(!Array.isArray(DATA.events))
  DATA.events=[];

 ensureTranslations(DATA,"name","nameTranslations");
 ensureTranslations(DATA,"subtitle","subtitleTranslations");

 DATA.categories=
  DATA.categories.map(normalizeCategory);

 DATA.events=
  DATA.events.map(normalizeEvent);
}

/* LOAD */

try{
 const saved=safeGet(STORAGE_KEY);

 if(saved){
  mergeData(JSON.parse(saved));
 }else{
  DATA.categories=DATA.categories.map(normalizeCategory);
  DATA.events=DATA.events.map(normalizeEvent);
 }

}catch(e){
 console.log("Veri yükleme:",e);
}

   SAVE
========================================================= */

function saveData(){

 const ok=safeSet(
  STORAGE_KEY,
  JSON.stringify(DATA)
 );

 if(!ok){
  alert(
   "Veriler tarayıcı hafızasına kaydedilemedi. Fotoğraf/video dosyası çok büyük olabilir."
  );
 }

 return ok;
}

/* =========================================================
   HELPERS
========================================================= */

function $(id){
 return document.getElementById(id);
}

function esc(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function t(key){
 return TEXT[language]?.[key]||
        TEXT.tr[key]||
        key;
}

function localizedValue(obj,key,translationsKey){

 if(
  obj?.[translationsKey] &&
  obj[translationsKey][language]!==undefined &&
  obj[translationsKey][language]!==""
 ){
  return obj[translationsKey][language];
 }

 return obj?.[key]||"";
}

function localizedName(item){
 return localizedValue(item,"name","names");
}

function localizedDescription(item){
 return localizedValue(item,"description","descriptions");
}

function localizedPortion(item){
 return localizedValue(item,"portion","portionTranslations");
}

function localizedDate(event){
 return localizedValue(event,"date","dateTranslations");
}

function localizedAllergens(item){

 const values=
  item?.allergensTranslations?.[language];

 if(Array.isArray(values)&&values.length)
  return values;

 return Array.isArray(item?.allergens)
  ?item.allergens
  :[];
}

function localizedBusinessName(){
 return localizedValue(
  DATA,
  "name",
  "nameTranslations"
 );
}

function localizedSubtitle(){
 return localizedValue(
  DATA,
  "subtitle",
  "subtitleTranslations"
 );
}

function allProducts(){

 let result=[];

 (DATA.categories||[]).forEach(category=>{

  (category.items||[]).forEach(item=>{

   result.push(
    Object.assign({},item,{
     categoryId:category.id,
     categoryName:localizedName(category)
    })
   );

  });

 });

 return result;
}

function findProduct(id){

 for(const category of DATA.categories||[]){

  const product=(category.items||[])
   .find(p=>p.id===id);

  if(product)return product;
 }

 return null;
}

function findCategory(id){
 return (DATA.categories||[])
  .find(c=>c.id===id)||null;
}

function findEvent(id){
 return (DATA.events||[])
  .find(e=>e.id===id)||null;
}

function money(price){

 const value=Number(price)||0;

 if(currency==="USD"){
  const rate=Number(DATA.rates.USD)||40;
  return "$"+(value/rate).toFixed(2);
 }

 if(currency==="EUR"){
  const rate=Number(DATA.rates.EUR)||47;
  return "€"+(value/rate).toFixed(2);
 }

 return Math.round(value)
  .toLocaleString("tr-TR")+" ₺";
}

function uid(prefix){
 return prefix+
  "-"+
  Date.now()+
  "-"+
  Math.random()
   .toString(36)
   .slice(2,7);
}

function normalizePhone(value){
 return String(value||"")
  .replace(/[^\d+]/g,"")
  .replace(/^00/,"");
}

function normalizeWhatsapp(value){
 return String(value||"")
  .replace(/\D/g,"");
}

function languageInput(

 label,

){

  )}

function fileField(
 type,
 id,
 label,
 value,
 accept
){

 const isVideo=
  type==="productVideo"||
  type==="eventVideo"||
  type==="backgroundVideo";

 return `
 <div class="field">

  <label>${esc(label)}</label>

  <div class="fileBox">

     hidden
     type="file"
     accept="${accept}"
     data-file-type="${type}"
     data-file-id="${esc(id)}">

   </label>

   ${
    value
    ?
    `<button
     type="button"
     class="fileBtn"
     data-clear-file="${esc(type)}|${esc(id)}">
     ${t("clear")}
    </button>`
    :
    ""
   }

  </div>

  ${
   value
   ?
   isVideo
   ?
   `<video
    class="preview"
    controls
    src="${esc(value)}"></video>`
   :
   `<img
    class="preview"
    src="${esc(value)}"
    alt="">`
   :
   `<div class="help">
    ${language==="ar"?"لم يتم اختيار ملف بعد.":"Henüz dosya seçilmedi."}
   </div>`
  }

 </div>
 `;
}

function collectAdmin(){

 document
 .querySelectorAll("[data-admin]")
 .forEach(input=>{

  const key=input.dataset.admin;
  const value=input.value;

  if(key==="businessName"){
   DATA.name=value;
   if(!DATA.nameTranslations)
    DATA.nameTranslations={tr:"",en:"",ar:""};
   DATA.nameTranslations.tr=value;
  }

  else if(key==="subtitle"){
   DATA.subtitle=value;
   if(!DATA.subtitleTranslations)
    DATA.subtitleTranslations={tr:"",en:"",ar:""};
   DATA.subtitleTranslations.tr=value;
  }

  else if(key==="phone")
   DATA.phone=value;

  else if(key==="whatsapp")
   DATA.whatsapp=normalizeWhatsapp(value);

  else if(key==="hours")
   DATA.hours=value;

  else if(key==="rateUSD")
   DATA.rates.USD=Number(value)||0;

  else if(key==="rateEUR")
   DATA.rates.EUR=Number(value)||0;

  else if(key==="fontFamily")
   DATA.theme.fontFamily=value;

  else if(key==="titleFont")
   DATA.theme.titleFont=value;

  else if(key.startsWith("categoryName-")){

   const id=key.replace("categoryName-","");
   const category=findCategory(id);

   if(category){
    category.name=
     category.names?.tr||
     category.name||
     "";
   }
  }

  else if(key.startsWith("productName-")){

   const id=key.replace("productName-","");
   const item=findProduct(id);

   if(item){
    item.name=
     item.names?.tr||
     item.name||
     "";
   }
  }

  else if(key.startsWith("productDescription-")){

   const id=key.replace("productDescription-","");
   const item=findProduct(id);

   if(item){
    item.description=
     item.descriptions?.tr||
     item.description||
     "";
   }
  }

  else if(key.startsWith("productPrice-")){

   const id=key.replace("productPrice-","");
   const item=findProduct(id);

   if(item)
    item.price=Number(value)||0;
  }

  else if(key.startsWith("productCalories-")){

   const id=key.replace("productCalories-","");
   const item=findProduct(id);

   if(item)
    item.calories=value;
  }

  else if(key.startsWith("productSpicy-")){

   const id=key.replace("productSpicy-","");
   const item=findProduct(id);

   if(item){
    item.spicy=Math.max(
     0,
     Math.min(5,Number(value)||0)
    );
   }
  }

  else if(key.startsWith("eventName-")){

   const id=key.replace("eventName-","");
   const event=findEvent(id);

   if(event){
    event.name=
     event.names?.tr||
     event.name||
     "";
   }
  }

  else if(key.startsWith("eventDate-")){

   const id=key.replace("eventDate-","");
   const event=findEvent(id);

   if(event){
    event.date=
     event.dateTranslations?.tr||
     event.date||
     "";
   }
  }

  else if(key.startsWith("eventTime-")){

   const id=key.replace("eventTime-","");
   const event=findEvent(id);

   if(event)
    event.time=value;
  }

  else if(key.startsWith("eventDescription-")){

   const id=key.replace("eventDescription-","");
   const event=findEvent(id);

   if(event){
    event.description=
     event.descriptions?.tr||
     event.description||
     "";
   }
  }

 });

 document

/* =========================================================
   FILE HANDLING
========================================================= */

function readFileAsDataURL(file,callback){

 const reader=new FileReader();

 reader.onload=()=>{
  callback(reader.result);
 };

 reader.onerror=()=>{
  alert("Dosya okunamadı.");
 };

 reader.readAsDataURL(file);
}

function handleFile(type,id,file){

 if(!file)return;

 const maxImage=8*1024*1024;
 const maxVideo=20*1024*1024;

 const isVideo=file.type.startsWith("video/");

 if(isVideo&&file.size>maxVideo){
  alert("Video en fazla 20 MB olabilir.");
  return;
 }

 if(!isVideo&&file.size>maxImage){
  alert("Fotoğraf en fazla 8 MB olabilir.");
  return;
 }

 readFileAsDataURL(file,data=>{

  if(type==="logo")
   DATA.logo=data;

  else if(type==="backgroundImage"){
   DATA.background.image=data;
   DATA.background.type="image";
  }

  else if(type==="backgroundVideo"){
   DATA.background.video=data;
   DATA.background.type="video";
  }

  else if(type==="categoryImage"){
   const category=findCategory(id);
   if(category)category.image=data;
  }

  else if(type==="productImage"){
   const item=findProduct(id);
   if(item)item.image=data;
  }

  else if(type==="productVideo"){
   const item=findProduct(id);
   if(item)item.video=data;
  }

  else if(type==="eventImage"){
   const event=findEvent(id);
   if(event)event.image=data;
  }

  else if(type==="eventVideo"){
   const event=findEvent(id);
   if(event)event.video=data;
  }

  saveData();
  render();

 });
}

/* =========================================================
   THEME
========================================================= */

function applyTheme(){

 const th=DATA.theme;
 const root=document.documentElement;

 root.style.setProperty("--accent",th.accent||"#d6a83d");
 root.style.setProperty("--accent2",th.accent2||"#f0c45a");
 root.style.setProperty("--text",th.text||"#fff");
 root.style.setProperty("--cardText",th.cardText||"#fff");
 root.style.setProperty("--price",th.price||th.accent2||"#f0c45a");
 root.style.setProperty("--overlay",th.overlay??.55);
 root.style.setProperty("--cardOpacity",th.cardOpacity??.94);
 root.style.setProperty("--cardRadius",(th.cardRadius||20)+"px");
 root.style.setProperty("--titleSize",(th.titleSize||34)+"px");
 root.style.setProperty("--bodySize",(th.bodySize||13)+"px");
 root.style.setProperty("--logoSize",(th.logoSize||112)+"px");
 root.style.setProperty("--fontFamily",resolveFont(th.fontFamily));
 root.style.setProperty("--titleFont",resolveFont(th.titleFont||"Georgia"));
}

function resolveFont(font){

 if(font==="system"||!font){
  return '-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif';
 }

 return font;
}

/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){

 /* DRAWER */

 $("openDrawer")?.addEventListener(
  "click",
  ()=>{
   drawerOpen=true;
   currencyMenu=false;
   languageMenu=false;
   render();
  }
 );

 $("closeDrawer")?.addEventListener(
  "click",
  ()=>{
   drawerOpen=false;
   render();
  }
 );

 $("drawerOverlay")?.addEventListener(
  "click",
  e=>{
   if(e.target.id==="drawerOverlay"){
    drawerOpen=false;
    render();
   }
  }
 );

 /* CURRENCY */

 $("currencyButton")?.addEventListener(
  "click",
  e=>{
   e.stopPropagation();

   currencyMenu=!currencyMenu;
   languageMenu=false;

   render();
  }
 );

 document
 .querySelectorAll("[data-currency]")
 .forEach(button=>{

  button.onclick=e=>{

   e.stopPropagation();

   currency=button.dataset.currency;

   safeSet(
    "nearMenuCurrency",
    currency
   );

   currencyMenu=false;

   render();
  };

 });

 /* LANGUAGE */

 $("languageButton")?.addEventListener(
  "click",
  e=>{

   e.stopPropagation();

   languageMenu=!languageMenu;
   currencyMenu=false;

   render();

  }
 );

 document
 .querySelectorAll("[data-language]")
 .forEach(button=>{

  button.onclick=e=>{

   e.stopPropagation();

   language=button.dataset.language;

   safeSet(
    "nearMenuLanguage",
    language
   );

   languageMenu=false;

   render();

  };

 });

 /* SEARCH */

 $("searchButton")?.addEventListener(
  "click",
  ()=>{

   searchOpen=!searchOpen;

   if(!searchOpen)
    searchText="";

   render();

   setTimeout(
    ()=>$("searchInput")?.focus(),
    30
   );

  }
 );

 $("searchInput")?.addEventListener(
  "input",
  e=>{

   searchText=e.target.value;

   const cursor=e.target.selectionStart;

   render();

   setTimeout(()=>{

    const input=$("searchInput");

    if(input){

     input.focus();

     const pos=Math.min(
      cursor??input.value.length,
      input.value.length
     );

     input.setSelectionRange(pos,pos);
    }

   },0);

  }
 );

 .querySelectorAll("[data-category]")
 .forEach(button=>{

  button.onclick=()=>{

   window.scrollTo(0,0);

  "click",

  "keydown",
  e=>{

  }

 function login(){

  const input=$("adminPassword");
  const error=$("loginError");

  if(!input)return;

  if(input.value===getAdminPin()){

   adminAuthenticated=true;

   render();

  }else{

   if(error)
    error.style.display="block";

   input.value="";
   input.focus();

  }

 /* COLORS */

 document
 .querySelectorAll("[data-theme-color]")
 .forEach(button=>{

  button.onclick=()=>{

   collectAdmin();

   DATA.theme.accent=
    button.dataset.themeColor;

   DATA.theme.accent2=
    button.dataset.themeColor;

   DATA.theme.price=
    button.dataset.themeColor;

   applyTheme();

   saveData();

   render();
  };

 });

 document
 .querySelectorAll("[data-color-setting]")
 .forEach(input=>{

  input.oninput=()=>{

   const key=input.dataset.colorSetting;

   if(key==="background"){

    DATA.background.type="color";
    DATA.background.value=input.value;

    const bg=document.querySelector(".background");

    if(bg)
     bg.style.background=input.value;

   }else{

    DATA.theme[key]=input.value;

    applyTheme();
   }

   saveData();
  };

 });

 /* DESIGN RANGES */

 document
 .querySelectorAll("[data-design]")
 .forEach(input=>{

  input.oninput=()=>{

   const key=input.dataset.design;
   const value=Number(input.value);

   if(key==="overlay")
    DATA.theme.overlay=value/100;

   else if(key==="cardOpacity")
    DATA.theme.cardOpacity=value/100;

   else
    DATA.theme[key]=value;

   const label=$(key+"Value");

   if(label){

    label.textContent=
     (
      key==="overlay"||
      key==="cardOpacity"
     )
     ?
     value+"%"
     :
     value+"px";
   }

   applyTheme();
   saveData();
  };

 });

 .forEach(button=>{

 document

 /* CLEAR FILE */

 document
 .querySelectorAll("[data-clear-file]")
 .forEach(button=>{

  button.onclick=()=>{

   const parts=
    button.dataset.clearFile.split("|");

   const type=parts[0];
   const id=parts[1];

   if(type==="logo")
    DATA.logo="";

   else if(type==="backgroundImage")
    DATA.background.image="";

   else if(type==="backgroundVideo")
    DATA.background.video="";

   else if(type==="categoryImage"){

    const c=findCategory(id);

    if(c)c.image="";
   }

   else if(type==="productImage"){

    const p=findProduct(id);

    if(p)p.image="";
   }

   else if(type==="productVideo"){

    const p=findProduct(id);

    if(p)p.video="";
   }

   else if(type==="eventImage"){

    const e=findEvent(id);

    if(e)e.image="";
   }

   else if(type==="eventVideo"){

    const e=findEvent(id);

    if(e)e.video="";
   }

   saveData();
   render();
  };

 });

 /* CHANGE PIN */

 $("changePinButton")?.addEventListener(
  "click",
  ()=>{

   collectAdmin();

   const current=$("[data-admin='currentPin']")?.value||"";
   const newPin=$("[data-admin='newPin']")?.value||"";
   const repeat=$("[data-admin='repeatPin']")?.value||"";

   const message=$("pinMessage");

   function showPinMessage(text,success){

    if(!message)return;

    message.style.display="block";
    message.style.background=
     success
     ?"rgba(22,101,52,.25)"
     :"rgba(127,29,29,.25)";
    message.style.color=
     success
     ?" #86efac"
     :"#fca5a5";
    message.textContent=text;
   }

   if(current!==getAdminPin()){

    showPinMessage(
     t("pinWrong"),
     false
    );

    return;
   }

   if(!/^\d+$/.test(newPin)){

    showPinMessage(
     t("pinOnlyNumbers"),
     false
    );

    return;
   }

   if(newPin.length<4||newPin.length>12){

    showPinMessage(
     t("pinLength"),
     false
    );

    return;
   }

   if(newPin!==repeat){

    showPinMessage(
     t("pinMismatch"),
     false
    );

    return;
   }

   if(!safeSet(PIN_KEY,newPin)){

    showPinMessage(
     "PIN kaydedilemedi.",
     false
    );

    return;
   }

   showPinMessage(
    t("pinChanged"),
    true
   );

   const currentInput=$("[data-admin='currentPin']");
   const newInput=$("[data-admin='newPin']");
   const repeatInput=$("[data-admin='repeatPin']");

   if(currentInput)currentInput.value="";
   if(newInput)newInput.value="";
   if(repeatInput)repeatInput.value="";

  }
 );
