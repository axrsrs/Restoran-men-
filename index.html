<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>NearMenu</title>

<style>
:root{
  --bg:#0b0b0c;
  --card:#151517;
  --line:#29292d;
  --gold:#d6a83d;
  --gold2:#f0c45a;
  --text:#f7f7f7;
  --muted:#999;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.app{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0,#292116 0,#0b0b0c 38%);
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:0 18px 50px;
}

/* ÜST MENÜ */
.top{
  position:sticky;
  top:0;
  z-index:30;
  padding:12px 0;
  background:linear-gradient(#0b0b0cf5,#0b0b0ccf,transparent);
  backdrop-filter:blur(10px);
}

.toprow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.round{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#171719;
  color:white;
  font-size:21px;
}

.currency{
  height:42px;
  padding:0 15px;
  border:0;
  border-radius:22px;
  background:var(--gold);
  color:#111;
  font-weight:900;
}

/* HERO */
.hero{
  text-align:center;
  padding:35px 0 28px;
}

.logo{
  width:86px;
  height:86px;
  border:1px solid var(--gold);
  border-radius:50%;
  margin:auto;
  display:grid;
  place-items:center;
  color:var(--gold);
  font:38px Georgia,serif;
  background:#111;
  overflow:hidden;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.eyebrow{
  margin-top:17px;
  color:var(--gold2);
  font-size:10px;
  font-weight:900;
  letter-spacing:.28em;
}

.hero h1{
  font:700 30px Georgia,serif;
  margin:8px 0;
}

.subtitle{
  margin:0;
  color:#aaa;
  font-size:13px;
}

/* SECTIONS */
.section{
  margin:28px 0;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.head h2{
  font-size:18px;
  margin:0;
}

.hint{
  font-size:10px;
  color:#666;
}

/* YATAY SLIDER */
.scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
}

.scroll::-webkit-scrollbar{
  display:none;
}

.feature,
.event{
  min-width:84%;
  height:205px;
  scroll-snap-align:start;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:#171719;
  border:1px solid var(--line);
  padding:0;
}

.feature img,
.event img,
.cat img,
.prodimg img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.shade{
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 30%,#000e);
}

.over{
  position:absolute;
  left:15px;
  right:15px;
  bottom:14px;
  text-align:left;
}

.over b{
  font-size:17px;
}

.over small{
  display:block;
  color:#bbb;
  margin-top:4px;
}

.event{
  height:185px;
}

.event .date{
  position:absolute;
  top:12px;
  left:12px;
  background:#000b;
  border-radius:99px;
  padding:6px 9px;
  color:var(--gold2);
  font-size:10px;
}

/* KATEGORİLER */
.cats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.cat{
  height:155px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:#171719;
  border:1px solid var(--line);
  color:white;
  text-align:left;
  padding:0;
}

.cat .over b{
  font-size:18px;
}

.cat .over small{
  font-size:10px;
}

/* ALT KATEGORİ MENÜSÜ */
.sub{
  position:sticky;
  top:64px;
  z-index:15;
  margin:0 -18px;
  padding:10px 18px;
  background:#0b0b0cf0;
  border-bottom:1px solid #202023;
  backdrop-filter:blur(12px);
}

.sub .scroll button{
  flex:0 0 auto;
  background:#171719;
  color:#aaa;
  border:0;
  border-radius:11px;
  padding:9px 13px;
  font-size:11px;
  font-weight:800;
}

.sub .scroll button.active{
  background:var(--gold);
  color:#111;
}

/* ÜRÜNLER */
.products{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:14px;
}

.product{
  display:grid;
  grid-template-columns:112px 1fr;
  min-height:118px;
  border:1px solid var(--line);
  background:#131315;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.prodimg{
  height:118px;
  background:#1b1b1d;
}

.prodbody{
  padding:12px;
}

.prodbody h3{
  margin:0;
  font-size:14px;
}

.prodbody p{
  margin:5px 0;
  color:#999;
  font-size:11px;
  line-height:1.45;
}

.tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.tag{
  font-size:9px;
  padding:4px 6px;
  background:#222;
  border-radius:6px;
  color:#bbb;
}

.sold{
  background:#7f1d1d;
  color:white;
}

.price{
  margin-top:7px;
  color:var(--gold2);
  font-weight:900;
}

/* DRAWER */
.drawerbg,
.modalbg{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  backdrop-filter:blur(5px);
}

.drawer{
  width:min(88%,380px);
  height:100%;
  background:#0f0f10;
  padding:20px;
  overflow:auto;
}

.drawerhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.drawerlogo{
  font:700 24px Georgia,serif;
  color:var(--gold);
}

.label{
  font-size:10px;
  color:#666;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin:24px 0 8px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.grid3 button,
.linkbtn{
  padding:11px;
  border:0;
  border-radius:10px;
  background:#171719;
  color:#aaa;
  font-size:11px;
}

.grid3 .on{
  background:var(--gold);
  color:#111;
  font-weight:900;
}

.linkbtn{
  display:block;
  width:100%;
  text-align:left;
  margin:7px 0;
}

/* ÜRÜN MODAL */
.modalbg{
  z-index:120;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  width:min(100%,560px);
  max-height:92vh;
  overflow:auto;
  background:#0f0f10;
  border-radius:24px 24px 0 0;
}

.modalpic{
  height:285px;
  position:relative;
  background:#19191b;
}

.modalpic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.close{
  position:absolute;
  right:14px;
  top:14px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#000b;
  color:white;
  border:0;
  font-size:24px;
}

.modalbody{
  padding:20px;
}

.modalbody h2{
  margin:0;
  font-size:25px;
}

.modalbody p{
  color:#aaa;
  line-height:1.6;
  font-size:13px;
}

.detail{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #242427;
  font-size:12px;
}

.detail span:last-child{
  color:#ddd;
}

.actions{
  display:flex;
  gap:8px;
}

.action{
  flex:1;
  padding:12px;
  border-radius:11px;
  text-align:center;
  background:#202023;
}

.action.gold{
  background:var(--gold);
  color:#111;
  font-weight:900;
}

/* ADMIN */
.adminbg{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000b;
  display:flex;
  justify-content:flex-end;
}

.admin{

  height:100%;
  background:#0d0d0e;
  overflow:auto;

.adminhead{

  top:0;
  background:#0d0d0ef5;

.adminheadrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tabs{
  display:flex;
  gap:5px;
  margin-top:12px;

.tabs button{

  padding:9px;
  border:0;
  border-radius:9px;
  background:#18181a;
  color:#888;

.tabs .on{

  color:#111;
}

.adminbody{
  padding:16px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  color:#777;
  font-size:10px;
  margin-bottom:5px;

.field input,
.field textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #303034;
  background:#171719;
  color:#eee;
  outline:0;
}

.toggle{
  display:flex;
  justify-content:space-between;
  padding:12px;
  margin:7px 0;
  background:#171719;
  border:1px solid #29292d;
  border-radius:11px;
  font-size:12px;

.btn{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#202023;
  color:#eee;
  font-weight:800;
  font-size:11px;

.btn.gold{

.admincard{
  background:#141416;
  border:1px solid #29292d;
  border-radius:13px;
  padding:12px;
  margin-bottom:10px;
}

.footer{
  text-align:center;
  color:#555;
  font-size:10px;
  padding:30px 0;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  z-index:500;
  background:#eee;
  color:#111;
  padding:10px 16px;
  border-radius:99px;
  font-size:12px;
  font-weight:800;
}

@media(max-width:380px){
  .cats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

function tr(key){

/* =========================================================
   YARDIMCI
========================================================= */

function esc(value){
 return String(value??"").replace(/[&<>"']/g,function(x){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[x];
 });
}

function allItems(){
 return data.categories.flatMap(function(category){
  return category.items.map(function(item){
   return {...item,category:category};
  });
 });
}

function money(value){

 let n=Number(value)||0;

 if(currency==="USD") n/=data.rates.USD;
 if(currency==="EUR") n/=data.rates.EUR;

 if(currency==="TRY")
  return Math.round(n).toLocaleString("tr-TR")+" ₺";

 if(currency==="USD")
  return "$"+n.toFixed(2);

 return "€"+n.toFixed(2);
}

/* =========================================================
   EVENTLER
========================================================= */

function bind(){

 /* DRAWER */

 document
 .getElementById("openDrawer")
 ?.addEventListener("click",function(){

   drawer=true;
   render();

 });


 document
 .getElementById("closeDrawer")
 ?.addEventListener("click",function(){

   drawer=false;
   render();

 });


 document
 .getElementById("drawerBg")
 ?.addEventListener("click",function(e){

   if(e.target.id==="drawerBg"){

     drawer=false;
     render();

   }

 });


 /* SEARCH */

 document
 .getElementById("openSearch")
 ?.addEventListener("click",function(){

   searchBox=true;
   render();

   setTimeout(function(){

     document
       .getElementById("searchInput")
       ?.focus();

   },50);

 });


 document
 .getElementById("searchInput")
 ?.addEventListener("input",function(e){

   search=e.target.value;

   render();

   let input=document.getElementById("searchInput");

   if(input){

     input.focus();

     input.setSelectionRange(
       input.value.length,
       input.value.length
     );

   }

 });


 /* PARA BİRİMİ */

 document
 .getElementById("currencyButton")
 ?.addEventListener("click",function(){

   drawer=true;
   render();

 });


 document
 .querySelectorAll("[data-currency]")
 .forEach(function(button){

   button.onclick=function(){

     currency=button.dataset.currency;

     data.currency=currency;

     saveData();

     drawer=false;

     render();

   };

 });


 /* DİL */

 document
 .querySelectorAll("[data-language]")
 .forEach(function(button){

   button.onclick=function(){

     lang=button.dataset.language;

     localStorage.setItem("nmLang",lang);

     drawer=false;

     render();

   };

 });


 /* KATEGORİ */

 document
 .querySelectorAll("[data-category]")
 .forEach(function(button){

   button.onclick=function(){

     currentCategory=button.dataset.category;

     search="";

     render();

     window.scrollTo(0,0);

   };

 });


 /* GERİ */

 document
 .getElementById("backHome")
 ?.addEventListener("click",function(){

   currentCategory=null;

   render();

   window.scrollTo(0,0);

 });


 /* ÜRÜN */

 document
 .querySelectorAll("[data-product]")
 .forEach(function(button){

   button.onclick=function(){

     let id=button.dataset.product;

     currentProduct=
       allItems().find(function(item){
         return item.id===id;
       })||null;

     if(currentProduct){

       render();

     }

   };

 });


 /* ÜRÜN KAPAT */

 document
 .getElementById("closeProduct")
 ?.addEventListener("click",function(){

   currentProduct=null;

   render();

 });


 document
 .getElementById("productModalBg")
 ?.addEventListener("click",function(e){

   if(e.target.id==="productModalBg"){

     currentProduct=null;

     render();

   }

 });


 /* ETKİNLİK */

 document
 .querySelectorAll("[data-event]")
 .forEach(function(button){

   button.onclick=function(){

     currentEvent=
       data.events.find(function(event){
         return event.id===button.dataset.event;
       })||null;

     render();

   };

 });


 document
 .getElementById("closeEvent")
 ?.addEventListener("click",function(){

   currentEvent=null;

   render();

 });


 document
 .getElementById("eventModalBg")
 ?.addEventListener("click",function(e){

   if(e.target.id==="eventModalBg"){

     currentEvent=null;

     render();

   }

 });


 /* ALT KATEGORİ */

 document
 .querySelectorAll("[data-goto]")
 .forEach(function(button){

   button.onclick=function(){

     let element=
       document.getElementById(
         "product-"+button.dataset.goto
       );

     if(element){

       element.scrollIntoView({
         behavior:"smooth",
         block:"start"
       });

     }

   };

 });


 /* ADMIN AÇ */

 document
 .getElementById("adminOpen")
 ?.addEventListener("click",function(){

   drawer=false;
   admin=true;

   render();

 });


 /* ADMIN KAPAT */

 document
 .getElementById("closeAdmin")
 ?.addEventListener("click",function(){

   admin=false;

   render();

 });


 /* ADMIN TAB */

 document
 .querySelectorAll("[data-tab]")
 .forEach(function(button){

   button.onclick=function(){

     adminTab=button.dataset.tab;

     render();

   };

 });


 /* ADMIN AYARLARI */

 document
 .querySelectorAll("[data-setting]")
 .forEach(function(input){

   input.onchange=function(){

     data.settings[
       input.dataset.setting
     ]=input.checked;

   };

 });


 /* TÜKENDİ */

 document
 .querySelectorAll("[data-sold]")
 .forEach(function(input){

   input.onchange=function(){

     let item=
       allItems().find(function(x){
         return x.id===input.dataset.sold;
       });

     if(item)
       item.sold=input.checked;

   };

 });


 /* ÖNE ÇIKAN */

 document
 .querySelectorAll("[data-featured]")
 .forEach(function(input){

   input.onchange=function(){

     let item=
       allItems().find(function(x){
         return x.id===input.dataset.featured;
       });

     if(item)
       item.featured=input.checked;

   };

 });


 /* KATEGORİ ADI */

 document
 .querySelectorAll("[data-category-name]")
 .forEach(function(input){

   input.oninput=function(){

     let category=
       data.categories.find(function(x){
         return x.id===input.dataset.categoryName;
       });

     if(category)
       category.name=input.value;

   };

 });


 /* ÜRÜN SİL */

 document
 .querySelectorAll("[data-delete-item]")
 .forEach(function(button){

   button.onclick=function(){

     let parts=
       button.dataset.deleteItem.split("|");

     let category=
       data.categories.find(function(x){
         return x.id===parts[0];
       });

     if(category){

       category.items=
         category.items.filter(function(item){
           return item.id!==parts[1];
         });

     }

     render();

   };

 });


 /* KATEGORİ SİL */

 document
 .querySelectorAll("[data-delete-category]")
 .forEach(function(button){

   button.onclick=function(){

     data.categories=
       data.categories.filter(function(category){
         return category.id!==button.dataset.deleteCategory;
       });

     render();

   };

 });


 /* YENİ KATEGORİ */

 document
 .getElementById("addCategory")
 ?.addEventListener("click",function(){

   data.categories.push({

     id:"category-"+Date.now(),

     name:"Yeni Kategori",

     image:IMG.breakfast,

     items:[]

   });

   render();

 });


 /* YENİ ÜRÜN */

 document
 .querySelectorAll("[data-add-item]")
 .forEach(function(button){

   button.onclick=function(){

     let category=
       data.categories.find(function(x){
         return x.id===button.dataset.addItem;
       });

     if(category){

       category.items.push({

         id:"item-"+Date.now(),

         name:"Yeni Ürün",

         desc:"",

         portion:"",

         calories:"",

         price:0,

         image:IMG.breakfast,

         spicy:0,

         allergens:[],

         sold:false,

         featured:false

       });

     }

     render();

   };

 });


 /* ADMIN KAYDET */

 document
 .getElementById("saveAdmin")
 ?.addEventListener("click",function(){

   collectAdmin();

   saveData();

   admin=false;

   render();

 });

}


/* =========================================================
   ADMIN VERİLERİNİ TOPLA
========================================================= */

function collectAdmin(){

 document
 .querySelectorAll("[data-key]")
 .forEach(function(input){

   let key=input.dataset.key;

   if(key==="name")
     data.name=input.value;

   if(key==="subtitle")
     data.subtitle=input.value;

   if(key==="phone")
     data.phone=input.value;

   if(key==="whatsapp")
     data.whatsapp=input.value;

 });


 document
 .querySelectorAll("[data-category-name]")
 .forEach(function(input){

   let category=
     data.categories.find(function(x){
       return x.id===input.dataset.categoryName;
     });

   if(category)
     category.name=input.value;

 });


 document
 .querySelectorAll("[data-key^='name-']")
 .forEach(function(input){

   let id=input.dataset.key.replace("name-","");

   let item=
     allItems().find(function(x){
       return x.id===id;
     });

   if(item)
     item.name=input.value;

 });


 document
 .querySelectorAll("[data-key^='price-']")
 .forEach(function(input){

   let id=input.dataset.key.replace("price-","");

   let item=
     allItems().find(function(x){
       return x.id===id;
     });

   if(item)
     item.price=Number(input.value)||0;

 });


 document
 .querySelectorAll("[data-key^='portion-']")
 .forEach(function(input){

   let id=input.dataset.key.replace("portion-","");

   let item=
     allItems().find(function(x){
       return x.id===id;
     });

   if(item)
     item.portion=input.value;

 });


 document
 .querySelectorAll("[data-key^='calories-']")
 .forEach(function(input){

   let id=input.dataset.key.replace("calories-","");

   let item=
     allItems().find(function(x){
       return x.id===id;
     });

   if(item)
     item.calories=input.value;

 });

}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveData(){

 try{

   localStorage.setItem(
     "nearMenuData",
     JSON.stringify(data)
   );

 }catch(error){}

}


/* =========================================================
   BAŞLAT
========================================================= */

render();

</script>
