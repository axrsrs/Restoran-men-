<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>NearMenu</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 background:#0b0b0c;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

body{min-height:100vh}

button,input,textarea,select{
 font:inherit
}

button{cursor:pointer}

a{
 text-decoration:none;
 color:inherit
}

:root{
 --gold:#d6a83d;
 --gold2:#f0c45a;
 --line:#29292d;
 --card:#151517;
 --card2:#1b1b1e;
 --danger:#7f1d1d;
}

#app{
 min-height:100vh
}

.container{
 width:100%;
 max-width:600px;
 margin:auto;
 padding:0 16px 60px
}

/* =========================
 BACKGROUND
========================= */

.videoBg{
 position:fixed;
 inset:0;
 z-index:-2;
 overflow:hidden;
 background:#0b0b0c
}

.videoBg video{
 width:100%;
 height:100%;
 object-fit:cover;
 opacity:.38
}

.pageBg{
 position:fixed;
 inset:0;
 z-index:-1;
 background:rgba(0,0,0,.55)
}

/* =========================
 TOP
========================= */

.top{
 position:sticky;
 top:0;
 z-index:50;
 padding:12px 0;
 background:rgba(11,11,12,.92);
 backdrop-filter:blur(15px)
}

.topRow{
 display:flex;
 align-items:center;
 justify-content:space-between
}

.topRight{
 display:flex;
 gap:7px
}

.iconBtn{
 width:42px;
 height:42px;
 border-radius:50%;
 border:1px solid var(--line);
 background:#171719;
 color:#fff;
 font-size:20px
}

.currencyBtn{
 height:42px;
 padding:0 15px;
 border:0;
 border-radius:22px;
 background:var(--gold);
 color:#111;
 font-weight:900
}

.searchBox{
 margin-top:8px
}

.searchBox input{
 width:100%;
 padding:13px 15px;
 border-radius:14px;
 border:1px solid var(--line);
 background:#151517;
 color:#fff;
 outline:none
}

/* =========================
 HERO
========================= */

.hero{
 text-align:center;
 padding:38px 0 28px
}

.logo{
 width:92px;
 height:92px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 border:1px solid var(--gold);
 background:#111;
 color:var(--gold);
 font:42px Georgia,serif;
 box-shadow:0 0 35px rgba(214,168,61,.12);
 overflow:hidden
}

.logo img{
 width:100%;
 height:100%;
 object-fit:cover
}

.welcome{
 margin-top:17px;
 color:var(--gold2);
 font-size:10px;
 font-weight:900;
 letter-spacing:.3em
}

.hero h1{
 margin:9px 0 5px;
 font:700 31px Georgia,serif
}

.hero p{
 margin:0;
 color:#999;
 font-size:13px
}

/* =========================
 SECTIONS
========================= */

.section{
 margin-top:28px
}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:13px
}

.sectionHead h2{
 margin:0;
 font-size:19px
}

.hint{
 color:#666;
 font-size:10px
}

/* =========================
 HORIZONTAL
========================= */

.horizontal{
 display:flex;
 gap:12px;
 overflow-x:auto;
 scrollbar-width:none;
 scroll-snap-type:x mandatory
}

.horizontal::-webkit-scrollbar{
 display:none
}

/* =========================
 FEATURED
========================= */

.feature{
 position:relative;
 flex:0 0 84%;
 height:210px;
 padding:0;
 border:1px solid var(--line);
 border-radius:19px;
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start
}

.feature img{
 width:100%;
 height:100%;
 object-fit:cover
}

.featureShade{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 25%,rgba(0,0,0,.9))
}

.featureText{
 position:absolute;
 left:16px;
 right:16px;
 bottom:15px;
 text-align:left
}

.featureText strong{
 font-size:18px
}

.featureText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:12px
}

/* =========================
 EVENTS
========================= */

.event{
 position:relative;
 flex:0 0 84%;
 height:190px;
 padding:0;
 border:1px solid var(--line);
 border-radius:19px;
 overflow:hidden;
 background:#171719;
 scroll-snap-align:start
}

.event img{
 width:100%;
 height:100%;
 object-fit:cover
}

.eventShade{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 25%,rgba(0,0,0,.9))
}

.eventDate{
 position:absolute;
 top:12px;
 left:12px;
 padding:7px 10px;
 border-radius:20px;
 background:rgba(0,0,0,.7);
 color:var(--gold2);
 font-size:10px
}

.eventText{
 position:absolute;
 left:16px;
 right:16px;
 bottom:15px;
 text-align:left
}

.eventText strong{
 font-size:18px
}

.eventText span{
 display:block;
 margin-top:5px;
 color:#ccc;
 font-size:12px
}

/* =========================
 CATEGORIES
========================= */

.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.category{
 position:relative;
 height:155px;
 padding:0;
 border:1px solid var(--line);
 border-radius:18px;
 overflow:hidden;
 background:#171719
}

.category img{
 width:100%;
 height:100%;
 object-fit:cover
}

.categoryShade{
 position:absolute;
 inset:0;
 background:linear-gradient(transparent 20%,rgba(0,0,0,.9))
}

.categoryText{
 position:absolute;
 left:14px;
 right:14px;
 bottom:13px;
 text-align:left
}

.categoryText strong{
 font-size:18px
}

.categoryText span{
 display:block;
 color:#aaa;
 font-size:10px;
 margin-top:4px
}

/* =========================
 CATEGORY PAGE
========================= */

.categoryTitle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:12px
}

.backBtn{
 border:0;
 background:#1b1b1e;
 color:#fff;
 padding:10px 13px;
 border-radius:11px;
 font-size:11px;
 font-weight:800
}

.stickyCategories{
 position:sticky;
 top:66px;
 z-index:35;
 margin:0 -16px;
 padding:10px 16px;
 background:rgba(11,11,12,.94);
 backdrop-filter:blur(14px);
 border-bottom:1px solid #202023
}

.categoryTabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 scrollbar-width:none
}

.categoryTabs::-webkit-scrollbar{
 display:none
}

.categoryTabs button{
 flex:0 0 auto;
 padding:10px 14px;
 border:0;
 border-radius:11px;
 background:#18181a;
 color:#aaa;
 font-size:11px;
 font-weight:800
}

.categoryTabs button.active{
 background:var(--gold);
 color:#111
}

/* =========================
 PRODUCTS
========================= */

.products{
 display:flex;
 flex-direction:column;
 gap:11px;
 margin-top:15px
}

.product{
 display:grid;
 grid-template-columns:115px 1fr;
 min-height:120px;
 overflow:hidden;
 border:1px solid var(--line);
 border-radius:16px;
 background:#141416;
 cursor:pointer
}

.productImage{
 height:120px;
 background:#1c1c1e
}

.productImage img{
 width:100%;
 height:100%;
 object-fit:cover
}

.productInfo{
 padding:12px
}

.productInfo h3{
 margin:0;
 font-size:15px
}

.productInfo p{
 margin:6px 0;
 color:#929292;
 font-size:11px;
 line-height:1.45
}

.tags{
 display:flex;
 flex-wrap:wrap;
 gap:5px
}

.tag{
 padding:4px 7px;
 border-radius:6px;
 background:#222225;
 color:#aaa;
 font-size:9px
}

.tag.sold{
 background:var(--danger);
 color:#fff
}

.price{
 margin-top:8px;
 color:var(--gold2);
 font-weight:900;
 font-size:14px
}

/* =========================
 DRAWER
========================= */

.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(5px)
}

.drawer{
 width:min(88%,390px);
 height:100%;
 overflow:auto;
 padding:20px;
 background:#101011;
 box-shadow:10px 0 40px #000
}

.drawerHead{
 display:flex;
 align-items:center;
 justify-content:space-between
}

.drawerLogo{
 color:var(--gold);
 font:700 25px Georgia,serif
}

.drawerSection{
 margin-top:25px
}

.drawerLabel{
 color:#666;
 font-size:10px;
 letter-spacing:.15em;
 margin-bottom:8px
}

.optionGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px
}

.optionGrid button,
.drawerLink{
 border:0;
 background:#18181a;
 color:#aaa;
 padding:11px;
 border-radius:10px;
 font-size:11px
}

.optionGrid button.active{
 background:var(--gold);
 color:#111;
 font-weight:900
}

.drawerLink{
 display:block;
 width:100%;
 text-align:left;
 margin-top:7px
}

/* =========================
 MODAL
========================= */

.modalOverlay{
 position:fixed;
 inset:0;
 z-index:150;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.75);
 backdrop-filter:blur(5px)
}

.modal{
 width:min(100%,600px);
 max-height:92vh;
 overflow:auto;
 border-radius:25px 25px 0 0;
 background:#101011
}

.modalImage{
 position:relative;
 height:290px
}

.modalImage img{
 width:100%;
 height:100%;
 object-fit:cover
}

.closeBtn{
 position:absolute;
 top:13px;
 right:13px;
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:rgba(0,0,0,.7);
 color:#fff;
 font-size:23px
}

.modalBody{
 padding:20px
}

.modalBody h2{
 margin:0;
 font-size:26px
}

.modalBody p{
 color:#999;
 font-size:13px;
 line-height:1.6
}

.infoRow{
 display:flex;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid #252527;
 font-size:12px
}

.infoRow span:last-child{
 color:#ddd;
 text-align:right
}

.modalPrice{
 margin-top:16px;
 color:var(--gold2);
 font-size:25px;
 font-weight:900
}

.actionRow{
 display:flex;
 gap:8px;
 margin-top:18px
}

.action{
 flex:1;
 padding:13px;
 border-radius:12px;
 text-align:center;
 background:#202023;
 font-size:12px;
 font-weight:800
}

.action.gold{
 background:var(--gold);
 color:#111
}

/* =========================
 ADMIN
========================= */

.adminOverlay{
 position:fixed;
 inset:0;
 z-index:250;
 background:rgba(0,0,0,.82);
 display:flex;
 justify-content:flex-end
}

.admin{
 width:min(100%,600px);
 height:100%;
 overflow:auto;
 background:#0e0e0f
}

.adminHeader{
 position:sticky;
 top:0;
 z-index:5;
 padding:15px;
 background:rgba(14,14,15,.98);
 border-bottom:1px solid var(--line)
}

.adminTop{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.adminTabs{
 display:flex;
 gap:6px;
 margin-top:12px
}

.adminTabs button{
 flex:1;
 padding:10px;
 border:0;
 border-radius:9px;
 background:#19191b;
 color:#888;
 font-size:11px
}

.adminTabs button.active{
 background:var(--gold);
 color:#111;
 font-weight:900
}

.adminBody{
 padding:16px
}

.field{
 margin-bottom:13px
}

.field label{
 display:block;
 margin-bottom:5px;
 color:#777;
 font-size:10px
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:11px;
 border:1px solid #303034;
 border-radius:10px;
 background:#171719;
 color:#fff;
 outline:none
}

.field textarea{
 min-height:75px;
 resize:vertical
}

.adminCard{
 padding:13px;
 margin-bottom:10px;
 border:1px solid var(--line);
 border-radius:13px;
 background:#151517
}

.toggle{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px;
 margin:7px 0;
 border:1px solid var(--line);
 border-radius:11px;
 background:#18181a;
 color:#ddd;
 font-size:12px
}

.toggle input{
 width:18px;
 height:18px;
 accent-color:#d6a83d
}

.adminButton{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 background:#202023;
 color:#fff;
 font-size:11px;
 font-weight:800
}

.adminButton.gold{
 background:var(--gold);
 color:#111
}

.adminButton.danger{
 background:var(--danger);
 color:#fff
}

.saveBar{
 position:sticky;
 bottom:0;
 padding:12px 16px;
 background:rgba(14,14,15,.98);
 border-top:1px solid var(--line)
}

.row{
 display:flex;
 gap:7px
}

.row>*{
 flex:1;
 min-width:0
}

.small{
 color:#777;
 font-size:10px;
 line-height:1.5
}

/* =========================
 ADMIN CATEGORY LIST
========================= */

.adminCategoryList{
 display:flex;
 flex-direction:column;
 gap:9px;
 margin-top:15px
}

.adminCategoryItem{
 display:flex;
 align-items:center;
 gap:12px;
 padding:12px;
 border:1px solid var(--line);
 border-radius:14px;
 background:#151517;
 transition:.2s
}

.adminCategoryItem:active{
 transform:scale(.985)
}

.adminCategoryThumb{
 width:55px;
 height:55px;
 flex:0 0 55px;
 border-radius:11px;
 overflow:hidden;
 background:#222225
}

.adminCategoryThumb img{
 width:100%;
 height:100%;
 object-fit:cover
}

.adminCategoryInfo{
 flex:1;
 min-width:0
}

.adminCategoryInfo strong{
 display:block;
 font-size:14px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.adminCategoryInfo span{
 display:block;
 margin-top:4px;
 color:#777;
 font-size:10px
}

.adminArrow{
 color:#777;
 font-size:18px
}

/* =========================
 ADMIN PRODUCT LIST
========================= */

.adminProductList{
 display:flex;
 flex-direction:column;
 gap:8px;
 margin-top:14px
}

.adminProductItem{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border:1px solid var(--line);
 border-radius:13px;
 background:#151517
}

.adminProductThumb{
 width:52px;
 height:52px;
 flex:0 0 52px;
 border-radius:10px;
 overflow:hidden;
 background:#222
}

.adminProductThumb img{
 width:100%;
 height:100%;
 object-fit:cover
}

.adminProductInfo{
 flex:1;
 min-width:0
}

.adminProductInfo strong{
 display:block;
 font-size:13px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}

.adminProductInfo span{
 display:block;
 color:var(--gold2);
 font-size:11px;
 margin-top:4px
}

.adminProductArrow{
 color:#777;
 font-size:17px
}

/* =========================
 ADMIN BREADCRUMB
========================= */

.adminBreadcrumb{
 display:flex;
 align-items:center;
 gap:7px;
 margin-bottom:15px;
 color:#777;
 font-size:11px
}

.adminBreadcrumb button{
 border:0;
 background:none;
 padding:0;
 color:var(--gold2);
 font-size:11px;
 font-weight:800
}

/* =========================
 ADMIN LOGIN
========================= */

.adminLoginOverlay{
 position:fixed;
 inset:0;
 z-index:500;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:rgba(0,0,0,.9);
 backdrop-filter:blur(12px)
}

.adminLogin{
 width:min(100%,390px);
 padding:25px;
 border:1px solid #29292d;
 border-radius:22px;
 background:#111113;
 box-shadow:0 20px 60px #000
}

.adminLoginLogo{
 width:65px;
 height:65px;
 margin:0 auto 17px;
 display:flex;
 align-items:center;
 justify-content:center;
 border:1px solid var(--gold);
 border-radius:50%;
 color:var(--gold);
 font:30px Georgia,serif
}

.adminLogin h2{
 margin:0;
 text-align:center;
 font-size:21px
}

.adminLogin p{
 margin:7px 0 20px;
 text-align:center;
 color:#777;
 font-size:11px
}

.adminPassword{
 width:100%;
 padding:14px;
 border:1px solid #303034;
 border-radius:12px;
 background:#18181a;
 color:#fff;
 outline:none;
 text-align:center;
 letter-spacing:.15em
}

.adminLoginButton{
 width:100%;
 margin-top:10px;
 padding:13px;
 border:0;
 border-radius:12px;
 background:var(--gold);
 color:#111;
 font-weight:900
}

.loginError{
 display:none;
 margin-top:10px;
 padding:9px;
 border-radius:9px;
 background:#3a1717;
 color:#ff8d8d;
 text-align:center;
 font-size:10px
}

/* =========================
 FOOTER
========================= */

.footer{
 padding:35px 0;
 text-align:center;
 color:#555;
 font-size:10px
}

.empty{
 padding:30px 10px;
 text-align:center;
 color:#666
}

/* =========================
 MOBILE
========================= */

@media(max-width:390px){

 .categories{
  grid-template-columns:1fr
 }

 .product{
  grid-template-columns:100px 1fr
 }

 .productImage{
  height:115px
 }

 .adminCategoryThumb{
  width:50px;
  height:50px;
  flex-basis:50px
 }

}
</style>
</head>

  mergeData(parsed);

 }

}


/* ============================================================
 DATA MERGE
============================================================ */

function mergeData(data){

 if(!data)
  return;

 Object.keys(data).forEach(function(key){

  if(
   key==="settings" ||
   key==="background" ||
   key==="rates"
  ){

   DATA[key]=Object.assign(
    {},
    DATA[key]||{},
    data[key]||{}
   );

  }else{

   DATA[key]=data[key];

  }

 });

}


/* ============================================================
 SAVE
============================================================ */

function saveData(){

 try{

  localStorage.setItem(
   "nearMenuData",
   JSON.stringify(DATA)
  );

 }catch(error){

  console.log("Kayıt yapılamadı",error);

 }

}


/* ============================================================
 HELPERS
============================================================ */

function t(key){

 return (
  TEXT[language]?.[key]||
  TEXT.tr[key]||
  key
 );

}


function escapeHTML(value){

 return String(value??"")

  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function allProducts(){

 let result=[];

 (DATA.categories||[]).forEach(function(category){

  (category.items||[]).forEach(function(item){

   result.push(
    Object.assign(
     {},
     item,
     {
      categoryId:category.id,
      categoryName:category.name
     }
    )
   );

  });

 });

 return result;

}


function findProduct(id){

 for(
  const category of DATA.categories||[]
 ){

  const item=
   (category.items||[]).find(
    function(product){
     return product.id===id;
    }
   );

  if(item)
   return item;

 }

 return null;

}


function findCategory(id){

 return (
  DATA.categories||[]
 ).find(function(category){

  return category.id===id;

 })||null;

}


function findEvent(id){

 return (
  DATA.events||[]
 ).find(function(event){

  return event.id===id;

 })||null;

}


/* ============================================================
 MONEY
============================================================ */

function money(price){

 let value=
  Number(price)||0;

 if(currency==="USD"){

  return "$"+
   (
    value/
    (DATA.rates?.USD||40)
   ).toFixed(2);

 }

 if(currency==="EUR"){

  return "€"+
   (
    value/
    (DATA.rates?.EUR||47)
   ).toFixed(2);

 }

 return (
  Math.round(value)
  .toLocaleString("tr-TR")
 )+" ₺";

}

/* ============================================================
 COLLECT ADMIN
============================================================ */

function collectAdmin(){

 document
 .querySelectorAll("[data-admin]")
 .forEach(function(input){

  const key=input.dataset.admin;
  const value=input.value;


  if(key==="businessName")
   DATA.name=value;

  else if(key==="subtitle")
   DATA.subtitle=value;

  else if(key==="phone")
   DATA.phone=value;

  else if(key==="whatsapp")
   DATA.whatsapp=value;

  else if(key==="logo")
   DATA.logo=value;

  else if(key==="hours")
   DATA.hours=value;

  else if(key==="backgroundColor")
   DATA.background.value=value;

  else if(key==="backgroundImage")
   DATA.background.image=value;

  else if(key==="backgroundVideo")
   DATA.background.video=value;


  else if(key.startsWith("categoryName-")){

   const id=
    key.replace("categoryName-","");

   const category=
    findCategory(id);

   if(category)
    category.name=value;

  }


  else if(key.startsWith("categoryImage-")){

   const id=
    key.replace("categoryImage-","");

   const category=
    findCategory(id);

   if(category)
    category.image=value;

  }


  else if(key.startsWith("productName-")){

   const id=
    key.replace("productName-","");

   const item=
    findProduct(id);

   if(item)
    item.name=value;

  }


  else if(key.startsWith("productDescription-")){

   const id=
    key.replace("productDescription-","");

   const item=
    findProduct(id);

   if(item)
    item.description=value;

  }


  else if(key.startsWith("productPrice-")){

   const id=
    key.replace("productPrice-","");

   const item=
    findProduct(id);

   if(item)
    item.price=Number(value)||0;

  }


  else if(key.startsWith("productImage-")){

   const id=
    key.replace("productImage-","");

   const item=
    findProduct(id);

   if(item)
    item.image=value;

  }


  else if(key.startsWith("productPortion-")){

   const id=
    key.replace("productPortion-","");

   const item=
    findProduct(id);

   if(item)
    item.portion=value;

  }


  else if(key.startsWith("productCalories-")){

   const id=
    key.replace("productCalories-","");

   const item=
    findProduct(id);

   if(item)
    item.calories=value;

  }


  else if(key.startsWith("productAllergens-")){

   const id=
    key.replace("productAllergens-","");

   const item=
    findProduct(id);

   if(item){

    item.allergens=
     value
     .split(",")
     .map(function(x){
      return x.trim();
     })
     .filter(Boolean);

   }

  }


  else if(key.startsWith("productSpicy-")){

   const id=
    key.replace("productSpicy-","");

   const item=
    findProduct(id);

   if(item){

    item.spicy=
     Math.max(
      0,
      Math.min(
       5,
       Number(value)||0
      )
     );

  }

 }


 else if(key.startsWith("eventName-")){

  const id=
   key.replace("eventName-","");

  const event=
   findEvent(id);

  if(event)
   event.name=value;

 }


 else if(key.startsWith("eventDate-")){

  const id=
   key.replace("eventDate-","");

  const event=
   findEvent(id);

  if(event)
   event.date=value;

 }


 else if(key.startsWith("eventTime-")){

  const id=
   key.replace("eventTime-","");

  const event=
   findEvent(id);

  if(event)
   event.time=value;

 }


 else if(key.startsWith("eventDescription-")){

  const id=
   key.replace("eventDescription-","");

  const event=
   findEvent(id);

  if(event)
   event.description=value;

 }


 else if(key.startsWith("eventImage-")){

  const id=
   key.replace("eventImage-","");

  const event=
   findEvent(id);

  if(event)
   event.image=value;

 }

 });

}

/* ============================================================
 EVENTS
============================================================ */

function bindEvents(){

 const get=
  id=>document.getElementById(id);


 /* =====================
 DRAWER
 ===================== */

 get("openDrawer")?.addEventListener(
  "click",
  function(){

   drawerOpen=true;
   render();

  }
 );


 get("closeDrawer")?.addEventListener(
  "click",
  function(){

   drawerOpen=false;
   render();

  }
 );


 get("drawerOverlay")?.addEventListener(
  "click",
  function(event){

   if(event.target.id==="drawerOverlay"){

    drawerOpen=false;
    render();

   }

  }
 );


 /* =====================
 SEARCH
 ===================== */

 get("searchButton")?.addEventListener(
  "click",
  function(){

   searchOpen=true;
   render();

   setTimeout(function(){

    get("searchInput")?.focus();

   },20);

  }
 );


 get("searchInput")?.addEventListener(
  "input",
  function(event){

   searchText=
    event.target.value;

   render();

   setTimeout(function(){

    const input=
     get("searchInput");

    if(input){

     input.focus();

     input.setSelectionRange(
      input.value.length,
      input.value.length
     );

    }

   },0);

  }
 );


 /* =====================
 CURRENCY
 ===================== */

 get("currencyButton")?.addEventListener(
  "click",
  function(){

   drawerOpen=true;
   render();

  }
 );


 document
 .querySelectorAll("[data-currency]")
 .forEach(function(button){

  button.onclick=function(){

   currency=
    button.dataset.currency;

   localStorage.setItem(
    "nearMenuCurrency",
    currency
   );

   drawerOpen=false;

   render();

  };

 });


 /* =====================
 LANGUAGE
 ===================== */

 document
 .querySelectorAll("[data-language]")
 .forEach(function(button){

  button.onclick=function(){

   language=
    button.dataset.language;

   localStorage.setItem(
    "nearMenuLanguage",
    language
   );

   drawerOpen=false;

   render();

  };

 });


 /* =====================
 CATEGORY
 ===================== */

 document
 .querySelectorAll("[data-category]")
 .forEach(function(button){

  button.onclick=function(){

   selectedCategory=
    button.dataset.category;

   selectedProduct=null;
   selectedEvent=null;
   searchText="";

   render();

   window.scrollTo(0,0);

  };

 });


 /* =====================
 BACK HOME
 ===================== */

 get("backHome")?.addEventListener(
  "click",
  function(){

   selectedCategory=null;

   render();

   window.scrollTo(0,0);

  }
 );


 /* =====================
 PRODUCT
 ===================== */

 document
 .querySelectorAll("[data-product]")
 .forEach(function(element){

  element.onclick=function(){

   const product=
    findProduct(
     element.dataset.product
    );

   if(product){

    selectedProduct=product;
    render();

   }

  };

 });


 get("closeProduct")?.addEventListener(
  "click",

   if(event.key==="Enter")
    adminLogin();

  }
 );


 function adminLogin(){

  const input=
   get("adminPassword");

  const error=
   get("loginError");

  if(!input)
   return;

  if(input.value===ADMIN_PASSWORD){

   adminAuthenticated=true;

   render();

  }else{

   if(error)
    error.style.display="block";

   input.value="";
   input.focus();

  }

 }

 .querySelectorAll("[data-delete-category]")
 .forEach(function(button){

  button.onclick=function(){

   if(
    !confirm(
     "Bu kategori ve içindeki tüm ürünler silinsin mi?"
    )
   )
    return;

   DATA.categories=
    DATA.categories.filter(
     function(category){

      return category.id!==
       button.dataset.deleteCategory;

     }
    );

   adminCategoryView=null;
   adminProductView=null;

   saveData();

   render();

  };

 });


 /* =====================
 DELETE PRODUCT
 ===================== */

 document
 .querySelectorAll("[data-delete-product]")
 .forEach(function(button){

  button.onclick=function(){

   const parts=
    button.dataset.deleteProduct
    .split("|");

   const category=
    findCategory(parts[0]);

   if(!category)
    return;

   if(
    !confirm(
     "Bu ürün silinsin mi?"
    )
   )
    return;

   category.items=
    category.items.filter(
     function(item){

      return item.id!==parts[1];

     }
    );

   adminProductView=null;

   saveData();

   render();

  };

 });
