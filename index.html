ckground:linear-gradient(transparent 35%,#000e 100%)}.ftext{position:absolute;left:15px;right:15px;bottom:14px}.ftext strong{font-size:17px}.ftext small{display:block;color:#bbb;margin-top:4px}.event{min-width:86%;height:185px;border-radius:18px;overflow:hidden;position:relative;background:#171719;border:1px solid #28282b}.event .badge{position:absolute;left:13px;top:13px;background:#000b;padding:6px 9px;border-radius:99px;font-size:10px;color:#f0c45a}.categories{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cat{height:155px;position:relative;border-radius:18px;overflow:hidden;background:#171719;border:1px solid #29292c}.cat .shade{background:linear-gradient(transparent 20%,#000d 100%)}.cattext{position:absolute;left:14px;right:14px;bottom:13px}.cattext strong{font-size:18px}.cattext small{display:block;color:#bbb;font-size:10px;margin-top:3px}.search{margin:10px 0;position:relative}.search input{width:100%;padding:13px 14px 13px 40px;border-radius:14px;border:1px solid #29292c;background:#151517;color:#fff;outline:none}.search span{position:absolute;left:14px;top:12px;color:#777}.subnav{position:sticky;top:64px;z-index:20;background:#0b0b0ced;backdrop-filter:blur(12px);margin:0 -18px;padding:10px 18px;border-bottom:1px solid #1e1e20}.subnav .hscroll button{flex:0 0 auto;padding:9px 13px;border-radius:12px;background:#171719;color:#aaa;font-size:11px;font-weight:800}.subnav .hscroll button.active{background:var(--gold);color:#111}.products{display:flex;flex-direction:column;gap:10px}.product{display:grid;grid-template-columns:104px 1fr;min-height:112px;border-radius:16px;background:#131315;border:1px solid #242427;overflow:hidden;scroll-margin-top:125px}.product .pic{height:112px;background:#1b1b1d}.product .body{padding:12px 13px}.product h3{margin:0;font-size:14px}.product p{margin:5px 0;color:#929296;font-size:11px;line-height:1.45}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:9px;padding:4px 6px;border-radius:6px;background:#222;color:#bbb}.price{margin-top:8px;color:var(--gold2);font-weight:900;font-size:14px}.sold{color:#fff;background:#7f1d1d}.drawerbg,.modalbg,.adminbg{position:fixed;inset:0;z-index:100;background:#000b;backdrop-filter:blur(5px)}.drawer{position:absolute;left:0;top:0;bottom:0;width:min(86%,370px);background:#0f0f10;border-right:1px solid #29292c;padding:22px 18px;overflow:auto}.drawerhead{display:flex;justify-content:space-between;align-items:center}.drawerlogo{font:700 24px Georgia;color:var(--gold)}.menuitem{width:100%;padding:13px;margin-top:8px;text-align:left;background:#171719;border-radius:12px}.label{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.16em;margin:22px 0 8px}.langgrid,.curgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.langgrid button,.curgrid button{padding:10px;border-radius:10px;background:#171719;color:#aaa;font-size:11px}.langgrid button.active,.curgrid button.active{background:var(--gold);color:#111;font-weight:900}.modalbg{z-index:120;display:grid;place-items:end center}.modal{width:min(100%,540px);max-height:92vh;overflow:auto;background:#0f0f10;border-radius:24px 24px 0 0;border:1px solid #29292c}.modalimage{height:280px;position:relative;background:#19191b}.modalimage img{width:100%;height:100%;object-fit:cover}.close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:#000b}.modalbody{padding:20px}.modalbody h2{margin:0;font-size:24px}.modalbody p{color:#aaa;line-height:1.6;font-size:13px}.detail{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #242427;font-size:12px}.detail span:last-child{color:#ddd}.adminbg{z-index:200;display:flex;justify-content:flex-end}.admin{width:min(100%,540px);height:100%;background:#0d0d0e;overflow:auto}.adminhead{position:sticky;top:0;z-index:5;padding:15px 16px;background:#0d0d0ef2;backdrop-filter:blur(12px);border-bottom:1px solid #262629}.adminheadrow{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:5px;margin-top:12px}.tabs button{flex:1;padding:10px 5px;border-radius:9px;background:#18181a;color:#888;font-size:11px}.tabs button.active{background:var(--gold);color:#111;font-weight:900}.adminbody{padding:16px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;color:#777;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#171719;border:1px solid #303034;color:#eee;border-radius:10px;padding:10px;outline:none}.field textarea{min-height:70px;resize:vertical}.toggle{display:flex;justify-content:space-between;align-items:center;background:#171719;border:1px solid #28282b;border-radius:11px;padding:11px;margin:7px 0;font-size:12px}.toggle input{accent-color:var(--gold)}.admincard{padding:12px;background:#141416;border:1px solid #28282b;border-radius:13px;margin-bottom:10px}.btn{padding:11px 14px;border-radius:10px;background:#202023;color:#ddd;font-size:11px;font-weight:800}.btn.gold{background:var(--gold);color:#111}.btn.red{background:#3b1111;color:#ff9b9b}.row{display:flex;gap:8px}.row>*{flex:1}.empty{text-align:center;color:#777;padding:35px 10px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;background:#eee;color:#111;padding:10px 15px;border-radius:99px;font-size:12px;font-weight:800;box-shadow:0 10px 30px #0008}.footer{text-align:center;color:#555;font-size:10px;padding:35px 0}.hidden{display:none!important}
@media(max-width:380px){.categories{grid-template-columns:1fr}.featured{min-width:88%}}

  {id:"tabak",name:"Klasik Kahvaltı Tabağı",desc:"Peynir, zeytin, yumurta, domates, salatalık ve günlük ürünler.",portion:"1 kişilik",calories:"720",price:320,image:IMAGES.toast,featured:false,dish:false,spicy:0,allergens:["Süt","Yumurta"],vegetarian:true,vegan:false,sold:false},

  {id:"chicken",name:"Izgara Tavuk",desc:"Marine edilmiş tavuk göğsü, salata ve garnitür.",portion:"250 g",calories:"610",price:420,image:IMAGES.grill,spicy:0,allergens:[],sold:false}

 {id:"dessert",name:"Tatlılar",image:IMAGES.dessert,items:[{id:"cake",name:"Günün Tatlısı",desc:"Şefin günlük hazırladığı tatlı.",portion:"1 porsiyon",calories:"520",price:190,image:IMAGES.dessert,dish:true,allergens:["Gluten","Süt","Yumurta"],sold:false}]},
 {id:"drink",name:"İçecekler",image:IMAGES.drink,items:[{id:"cola",name:"Soğuk İçecek",desc:"Çeşitli soğuk içecek seçenekleri.",portion:"330 ml",calories:"140",price:90,image:IMAGES.drink,sold:false}]}
 ],

};
let data=load();let lang=localStorage.getItem("nm_lang")||"tr";let currentCat=null;let activeItem=null;let drawer=false;let admin=false;let tab="general";let currencyOpen=false;let searchOpen=false;let searchText="";
const dict={tr:{welcome:"HOŞ GELDİNİZ",featured:"Çok Satanlar",events:"Etkinlikler",categories:"Kategoriler",menu:"Menü",slide:"Sağa kaydır",search:"Ürün ara...",back:"Geri",portion:"Porsiyon / Gramaj",calories:"Kalori",ingredients:"İçindekiler",allergens:"Alerjenler",spicy:"Acılık",sold:"Tükendi",today:"Günün Ürünü",reserve:"Rezervasyon Yap",call:"Ara",language:"Dil",currency:"Para Birimi",admin:"Yönetim",save:"Kaydet",general:"Genel",products:"Ürünler",settings:"Ayarlar"},
en:{welcome:"WELCOME",featured:"Best Sellers",events:"Events",categories:"Categories",menu:"Menu",slide:"Swipe",search:"Search products...",back:"Back",portion:"Portion",calories:"Calories",ingredients:"Ingredients",allergens:"Allergens",spicy:"Spiciness",sold:"Sold Out",today:"Dish of the Day",reserve:"Reserve",call:"Call",language:"Language",currency:"Currency",admin:"Admin",save:"Save",general:"General",products:"Products",settings:"Settings"},
ar:{welcome:"مرحباً بكم",featured:"الأكثر مبيعاً",events:"الفعاليات",categories:"التصنيفات",menu:"القائمة",slide:"اسحب",search:"ابحث عن منتج...",back:"رجوع",portion:"الحصة",calories:"السعرات",ingredients:"المكونات",allergens:"مسببات الحساسية",spicy:"الحار",sold:"نفد",today:"طبق اليوم",reserve:"حجز",call:"اتصال",language:"اللغة",currency:"العملة",admin:"الإدارة",save:"حفظ",general:"عام",products:"المنتجات",settings:"الإعدادات"}};
function t(k){return dict[lang]?.[k]||dict.tr[k]||k}
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{let x=localStorage.getItem("nearMenuData");return x?Object.assign(clone(base),JSON.parse(x)):clone(base)}catch(e){return clone(base)}}
function save(){localStorage.setItem("nearMenuData",JSON.stringify(data));toast("Kaydedildi")}
function toast(s){let e=document.createElement("div");e.className="toast";e.textContent=s;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function price(v){let c=data.currency,n=Number(v)||0;if(c==="USD")n/=data.rates.USD;if(c==="EUR")n/=data.rates.EUR;return c==="TRY"?Math.round(n).toLocaleString("tr-TR")+" ₺":(c==="USD"?"$":"€")+n.toFixed(2)}
function nameOf(o){return o.name}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 const bg=data.bg.type==="color"?`background:${data.bg.value}`:data.bg.type==="image"?`background-image:linear-gradient(#0007,#0007),url('${data.bg.value}');background-size:cover;background-position:center;background-attachment:fixed`:"";
 document.getElementById("app").innerHTML=`<div class="app" style="${bg}">
 <div class="wrap">
  ${topbar()}
  ${hero()}
  ${searchOpen?`<div class="search"><span>⌕</span><input id="search" value="${esc(searchText)}" placeholder="${t("search")}"></div>`:""}
  ${searchText?searchResults():home()}
  <div class="footer">NearMenu • ${esc(data.name)}</div>
 </div>
 ${drawerUI()}${activeItem?productModal():eventModal()}${admin?adminUI():""}
 </div>`;
 bind();
}
function topbar(){return `<div class="top"><div class="toprow"><button class="round" id="openDrawer">☰</button><div style="display:flex;gap:7px"><button class="round" id="openSearch">⌕</button><button class="currency" id="currencyBtn">${data.currency==="TRY"?"₺":data.currency==="USD"?"$":"€"}</button></div></div></div>`}
function hero(){return `<section class="hero"><div class="logo">${data.logo?`<img src="${data.logo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:"N"}</div><div class="eyebrow" style="margin-top:17px">${esc(data.eyebrow)}</div><h1>${esc(data.name)}</h1><p class="subtitle">${esc(data.subtitle)}</p>${data.settings.hours?`<div style="font-size:10px;color:#777;margin-top:9px">${data.hours.monday}</div>`:""}</section>`}
function home(){
 return `${data.settings.featured?featuredUI():""}${data.settings.events?eventsUI():""}<section class="section"><div class="sectionhead"><h2>${t("categories")}</h2></div><div class="categories">${data.categories.map(c=>`<button class="cat" data-cat="${c.id}">${c.image?`<img src="${c.image}">`:""}<div class="shade"></div><div class="cattext"><strong>${esc(c.name)}</strong><small>${c.items.length} ürün</small></div></button>`).join("")}</div></section>`;
}
function featuredUI(){
 let arr=data.categories.flatMap(c=>c.items).filter(x=>x.featured);
 return `<section class="section"><div class="sectionhead"><h2>🔥 ${t("featured")}</h2><span class="hint">${t("slide")}</span></div><div class="hscroll">${arr.map(i=>`<button class="featured" data-item="${i.id}">${i.image?`<img src="${i.image}">`:""}<div class="shade"></div><div class="ftext"><strong>${esc(i.name)}</strong><small>${price(i.price)}</small></div></button>`).join("")}</div></section>`
}
function eventsUI(){return `<section class="section"><div class="sectionhead"><h2>✨ ${t("events")}</h2><span class="hint">${t("slide")}</span></div><div class="hscroll">${data.events.map(e=>`<button class="event" data-event="${e.id}">${e.image?`<img src="${e.image}">`:""}<div class="shade"></div><span class="badge">${esc(e.date)} • ${esc(e.time)}</span><div class="ftext"><strong>${esc(e.name)}</strong><small>${t("reserve")}</small></div></button>`).join("")}</div></section>`}
function searchResults(){
 let q=searchText.toLocaleLowerCase("tr");let arr=data.categories.flatMap(c=>c.items.map(i=>({...i,cat:c.id}))).filter(i=>(i.name+" "+i.desc).toLocaleLowerCase("tr").includes(q));
 return `<section class="section"><div class="sectionhead"><h2>${arr.length} ürün</h2></div><div class="products">${arr.length?arr.map(productCard).join(""):`<div class="empty">Ürün bulunamadı.</div>`}</div></section>`
}
function categoryUI(){
 let c=data.categories.find(x=>x.id===currentCat);if(!c)return "";
 return `<section class="section"><div class="sectionhead"><button class="btn" id="backHome">← ${t("back")}</button><h2>${esc(c.name)}</h2></div><div class="subnav"><div class="hscroll">${c.items.map((i,n)=>`<button class="${n===0?"active":""}" data-scroll="${i.id}">${esc(i.name)}</button>`).join("")}</div></div><div class="products" style="margin-top:12px">${c.items.map(productCard).join("")}</div></section>`
}
function productCard(i){
 return `<article class="product" id="p-${i.id}" data-item="${i.id}"><div class="pic">${i.image?`<img src="${i.image}">`:""}</div><div class="body"><h3>${esc(i.name)}</h3>${i.desc?`<p>${esc(i.desc)}</p>`:""}<div class="meta">${data.settings.portion&&i.portion?`<span class="tag">${esc(i.portion)}</span>`:""}${data.settings.calories&&i.calories?`<span class="tag">${esc(i.calories)} kcal</span>`:""}${data.settings.nutrition&&i.vegan?`<span class="tag">Vegan</span>`:""}${data.settings.nutrition&&i.vegetarian?`<span class="tag">Vejetaryen</span>`:""}${data.settings.spicy&&i.spicy?`<span class="tag">${"🌶️".repeat(i.spicy)}</span>`:""}${data.settings.sold&&i.sold?`<span class="tag sold">${t("sold")}</span>`:""}</div><div class="price">${i.sold&&data.settings.sold?t("sold"):price(i.price)}</div></div></article>`
}
function drawerUI(){if(!drawer)return"";return `<div class="drawerbg" id="drawerbg"><aside class="drawer" id="drawer"><div class="drawerhead"><div class="drawerlogo">NEARMENU</div><button class="round" id="closeDrawer">×</button></div><div class="label">${t("language")}</div><div class="langgrid">${[["tr","🇹🇷 Türkçe"],["en","🇬🇧 English"],["ar","🇸🇦 العربية"]].map(x=>`<button class="${lang===x[0]?"active":""}" data-lang="${x[0]}">${x[1]}</button>`).join("")}</div><div class="label">${t("currency")}</div><div class="curgrid">${[["TRY","₺ TL"],["USD","$ USD"],["EUR","€ EUR"]].map(x=>`<button class="${data.currency===x[0]?"active":""}" data-cur="${x[0]}">${x[1]}</button>`).join("")}</div><div class="label">İletişim</div>${data.whatsapp?`<a class="menuitem" target="_blank" href="https://wa.me/${data.whatsapp.replace(/\\D/g,"")}">WhatsApp</a>`:""}${data.phone?`<a class="menuitem" href="tel:${data.phone}">Telefon</a>`:""}${data.instagram?`<a class="menuitem" target="_blank" href="${data.instagram}">Instagram</a>`:""}<button class="menuitem" id="adminOpen" style="margin-top:25px;text-align:center">⚙ ${t("admin")}</button></aside></div>`}
function productModal(){let i=activeItem;return `<div class="modalbg" id="modalbg"><div class="modal"><div class="modalimage">${i.image?`<img src="${i.image}">`:""}<button class="close" id="closeModal">×</button></div><div class="modalbody"><h2>${esc(i.name)}</h2>${i.dish&&data.settings.dish?`<div class="tag" style="display:inline-block;margin-top:10px;background:#d6a83d;color:#111">${t("today")}</div>`:""}${i.desc?`<p>${esc(i.desc)}</p>`:""}${data.settings.portion&&i.portion?`<div class="detail"><span>${t("portion")}</span><span>${esc(i.portion)}</span></div>`:""}${data.settings.calories&&i.calories?`<div class="detail"><span>${t("calories")}</span><span>${esc(i.calories)} kcal</span></div>`:""}${data.settings.ingredients&&i.ingredients?`<div class="detail"><span>${t("ingredients")}</span><span>${esc(i.ingredients)}</span></div>`:""}${data.settings.allergens&&i.allergens?.length?`<div class="detail"><span>${t("allergens")}</span><span>${i.allergens.join(", ")}</span></div>`:""}${data.settings.spicy&&i.spicy?`<div class="detail"><span>${t("spicy")}</span><span>${"🌶️".repeat(i.spicy)}</span></div>`:""}<div class="price" style="font-size:22px">${i.sold&&data.settings.sold?t("sold"):price(i.price)}</div></div></div></div>`}
function eventModal(){let e=window.__event;return `<div class="modalbg" id="modalbg"><div class="modal"><div class="modalimage">${e.image?`<img src="${e.image}">`:""}<button class="close" id="closeModal">×</button></div><div class="modalbody"><h2>${esc(e.name)}</h2><p>${esc(e.date)} • ${esc(e.time)}</p><p>${esc(e.desc)}</p><div class="row">${e.whatsapp||data.whatsapp?`<a class="btn gold" target="_blank" href="https://wa.me/${(e.whatsapp||data.whatsapp).replace(/\\D/g,"")}">${t("reserve")}</a>`:""}${data.phone?`<a class="btn" href="tel:${data.phone}">${t("call")}</a>`:""}</div></div></div></div>`}
function adminUI(){return `<div class="adminbg"><aside class="admin"><div class="adminhead"><div class="adminheadrow"><b>NearMenu Yönetim Paneli</b><button class="round" id="adminClose">×</button></div><div class="tabs"><button class="${tab==="general"?"active":""}" data-tab="general">${t("general")}</button><button class="${tab==="products"?"active":""}" data-tab="products">${t("products")}</button><button class="${tab==="settings"?"active":""}" data-tab="settings">${t("settings")}</button></div></div><div class="adminbody">${tab==="general"?adminGeneral():tab==="products"?adminProducts():adminSettings()}</div><div style="position:sticky;bottom:0;padding:12px 16px;background:#0d0d0ef5;border-top:1px solid #252528"><button class="btn gold" id="adminSave" style="width:100%">${t("save")}</button></div></aside></div>`}
function field(k,label,val,type="text"){return `<div class="field"><label>${label}</label><input data-field="${k}" type="${type}" value="${esc(val??"")}"></div>`}
function adminGeneral(){return `<h3>İşletme</h3>${field("name","İşletme adı",data.name)}${field("subtitle","Başlık / açıklama",data.subtitle)}${field("eyebrow","Üst başlık",data.eyebrow)}${field("phone","Telefon",data.phone)}${field("whatsapp","WhatsApp",data.whatsapp)}${field("instagram","Instagram",data.instagram)}<div class="admincard"><b>Arka Plan</b><div class="row" style="margin-top:10px"><button class="btn bgtype" data-bg="color">Renk</button><button class="btn bgtype" data-bg="image">Fotoğraf</button><button class="btn bgtype" data-bg="video">Video</button></div>${data.bg.type==="color"?field("bgvalue","Renk",data.bg.value):field("bgvalue","URL",data.bg.value)}</div>`}
function adminProducts(){return `<div class="row" style="margin-bottom:12px"><button class="btn gold" id="addCat">+ Kategori</button></div>${data.categories.map(c=>`<div class="admincard"><div class="row"><input class="field" style="margin:0" data-cat-name="${c.id}" value="${esc(c.name)}"><button class="btn red" data-del-cat="${c.id}">Sil</button></div>${c.items.map(i=>`<div class="admincard" style="margin-top:9px"><div class="row">${field("item-"+i.id,"Ürün",i.name)}${field("price-"+i.id,"Fiyat",i.price,"number")}</div><div class="row">${field("portion-"+i.id,"Gramaj",i.portion)}${field("cal-"+i.id,"Kalori",i.calories,"number")}</div>${field("desc-"+i.id,"Açıklama",i.desc)}<div class="toggle">Tükendi <input type="checkbox" data-check="sold-${i.id}" ${i.sold?"checked":""}></div><div class="toggle">Öne çıkan <input type="checkbox" data-check="featured-${i.id}" ${i.featured?"checked":""}></div><button class="btn red" data-del-item="${c.id}|${i.id}">Ürünü Sil</button></div>`).join("")}<button class="btn" data-add-item="${c.id}">+ Ürün</button></div>`).join("")}`}
function adminSettings(){let arr=[["portion","Gramaj / Porsiyon"],["calories","Kalori"],["ingredients","İçindekiler"],["nutrition","Vegan / Vejetaryen"],["spicy","Acılık"],["allergens","Alerjenler"],["sold","Tükendi"],["hours","Çalışma Saatleri"],["dish","Günün Ürünü"],["featured","Çok Satanlar / Öne Çıkanlar"],["events","Etkinlikler"],["search","Ürün Arama"]];return `<h3>Opsiyonel Alanlar</h3><p style="font-size:11px;color:#777">Her özellik işletme sahibinin isteğine göre açılıp kapatılabilir.</p>${arr.map(x=>`<label class="toggle">${x[1]}<input type="checkbox" data-setting="${x[0]}" ${data.settings[x[0]]?"checked":""}></label>`).join("")}`}
function bind(){
 document.getElementById("openDrawer")?.addEventListener("click",()=>{drawer=true;render()});
 document.getElementById("closeDrawer")?.addEventListener("click",()=>{drawer=false;render()});
 document.getElementById("drawerbg")?.addEventListener("click",e=>{if(e.target.id==="drawerbg"){drawer=false;render()}});
 document.getElementById("openSearch")?.addEventListener("click",()=>{searchOpen=!searchOpen;render();setTimeout(()=>document.getElementById("search")?.focus(),20)});
 document.getElementById("currencyBtn")?.addEventListener("click",()=>{drawer=true;render()});
 document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("nm_lang",lang);drawer=false;render()});
 document.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{data.currency=b.dataset.cur;save();render()});
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{currentCat=b.dataset.cat;render();window.scrollTo({top:0,behavior:"smooth"})});
 document.getElementById("backHome")?.addEventListener("click",()=>{currentCat=null;render()});
 document.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>{let id=b.dataset.item;activeItem=data.categories.flatMap(c=>c.items).find(x=>x.id===id)||null;if(activeItem)render()});
 document.querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>{window.__event=data.events.find(x=>x.id===b.dataset.event);activeItem=null;render()});
 document.getElementById("closeModal")?.addEventListener("click",()=>{activeItem=null;window.__event=null;render()});
 document.getElementById("modalbg")?.addEventListener("click",e=>{if(e.target.id==="modalbg"){activeItem=null;window.__event=null;render()}});
 document.getElementById("search")?.addEventListener("input",e=>{searchText=e.target.value;render();let x=document.getElementById("search");x?.focus();x?.setSelectionRange(x.value.length,x.value.length)});
 document.querySelectorAll("[data-scroll]").forEach(b=>b.onclick=()=>document.getElementById("p-"+b.dataset.scroll)?.scrollIntoView({behavior:"smooth",block:"start"}));
 document.getElementById("adminOpen")?.addEventListener("click",()=>{drawer=false;admin=true;render()});
 document.getElementById("adminClose")?.addEventListener("click",()=>{admin=false;render()});
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 document.getElementById("adminSave")?.addEventListener("click",()=>{collectAdmin();save();admin=false;render()});
 document.querySelectorAll("[data-setting]").forEach(x=>x.onchange=()=>data.settings[x.dataset.setting]=x.checked);
 document.querySelectorAll("[data-check]").forEach(x=>x.onchange=()=>{let [k,id]=x.dataset.check.split("-");let i=data.categories.flatMap(c=>c.items).find(z=>z.id===id);if(i)i[k]=x.checked});
 document.querySelectorAll("[data-cat-name]").forEach(x=>x.oninput=()=>{let c=data.categories.find(z=>z.id===x.dataset.catName);if(c)c.name=x.value});
 document.querySelectorAll("[data-del-cat]").forEach(x=>x.onclick=()=>{data.categories=data.categories.filter(c=>c.id!==x.dataset.delCat);render()});
 document.querySelectorAll("[data-del-item]").forEach(x=>x.onclick=()=>{let [c,i]=x.dataset.delItem.split("|");let cat=data.categories.find(z=>z.id===c);if(cat)cat.items=cat.items.filter(z=>z.id!==i);render()});
 document.querySelectorAll("[data-add-item]").forEach(x=>x.onclick=()=>{let c=data.categories.find(z=>z.id===x.dataset.addItem);if(c)c.items.push({id:"i"+Date.now(),name:"Yeni Ürün",desc:"",portion:"",calories:"",price:0,image:IMAGES.breakfast,allergens:[],spicy:0,sold:false,featured:false});render()});
 document.getElementById("addCat")?.addEventListener("click",()=>{data.categories.push({id:"c"+Date.now(),name:"Yeni Kategori",image:IMAGES.breakfast,items:[]});render()});
 document.querySelectorAll(".bgtype").forEach(x=>x.onclick=()=>{data.bg.type=x.dataset.bg;render()});
}
function collectAdmin(){
 document.querySelectorAll("[data-field]").forEach(x=>{let k=x.dataset.field;let map={name:"name",subtitle:"subtitle",eyebrow:"eyebrow",phone:"phone",whatsapp:"whatsapp",instagram:"instagram",bgvalue:"bgvalue"};if(map[k])data[map[k]]=x.value});
 document.querySelectorAll('[data-field^="item-"]').forEach(x=>{let id=x.dataset.field.slice(5);let i=data.categories.flatMap(c=>c.items).find(z=>z.id===id);if(i)i.name=x.value});
 document.querySelectorAll('[data-field^="price-"]').forEach(x=>{let id=x.dataset.field.slice(6);let i=data.categories.flatMap(c=>c.items).find(z=>z.id===id);if(i)i.price=Number(x.value)||0});
 document.querySelectorAll('[data-field^="portion-"]').forEach(x=>{let id=x.dataset.field.slice(8);let i=data.categories.flatMap(c=>c.items).find(z=>z.id===id);if(i)i.portion=x.value});
 document.querySelectorAll('[data-field^="cal-"]').forEach(x=>{let id=x.dataset.field.slice(4);let i=data.categories.flatMap(c=>c.items).find(z=>z.id===id);if(i)i.calories=x.value});
 document.querySelectorAll('[data-field^="desc-"]').forEach(x=>{let id=x.dataset.field.slice(5);let i=data.categories.flatMap(c=>c.items).find(z=>z.id===id);if(i)i.desc=x.value});
 let bg=document.querySelector('[data-field="bgvalue"]');if(bg)data.bg.value=bg.value;
}
render();
</script>
</body>
</html>
