<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; connect-src 'self' https://rfwgjzkewtjpdcvrhepg.supabase.co https://media.neardiji.com https://api.mymemory.translated.net https://open.er-api.com https://api.frankfurter.app https://api.frankfurter.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111110">
<title>NearDiji · Site Paneli</title>
<script src="/ayse/tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<script src="/assets/site-data.js"></script>
<script src="/assets/media.js"></script>
<style>
:root{--bg:#EBE9E5;--panel:#F5F4F1;--fg:#151514;--muted:color-mix(in srgb,var(--fg) 58%,transparent);--line:color-mix(in srgb,var(--fg) 13%,transparent);
 --field:#fff;--ok:#2f9e6c;--warn:#c98a1d;--bad:#d2493f;--head:'Geist','Helvetica Neue',Arial,sans-serif;--accent:'Instrument Serif',Georgia,serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#111110;--panel:#191918;--fg:#F1EFEA;--field:#1f1f1d;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--head);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* giriş */
.auth{min-height:100svh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:30px 26px}
.auth-card h1{margin:0 0 4px;font-weight:500;font-size:30px;letter-spacing:-.03em}
.auth-card h1 em{font-family:var(--accent);font-weight:400}
.auth-card p{margin:0 0 22px;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}

/* üst çubuk */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px clamp(14px,3vw,32px);
 background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .brand{font-weight:600;letter-spacing:-.02em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand span{font-family:var(--accent);font-style:italic;font-weight:400;color:var(--muted)}
.status{font-size:12.5px;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
 background:transparent;cursor:pointer;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,opacity .2s}
.btn:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.icon{width:40px;padding:0}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}

/* düzen */
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:clamp(16px,3vw,40px);max-width:1180px;margin:0 auto;padding:24px clamp(14px,3vw,32px) 120px}
.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.side a{padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:14px}
.side a:hover,.side a.on{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
@media (max-width:860px){
 .wrap{grid-template-columns:minmax(0,1fr)}
 .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
 .side::-webkit-scrollbar{display:none}
 .side a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
 .top .status{display:none}
}
.card{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:clamp(16px,2.4vw,26px);margin-bottom:18px;scroll-margin-top:84px}
.card>h2{margin:0 0 4px;font-weight:500;font-size:22px;letter-spacing:-.02em}
.card>.sub{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);letter-spacing:.01em;min-width:0}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:11px 13px;font-size:15px;color:var(--fg);outline:none;transition:border-color .2s}
.in:focus{border-color:color-mix(in srgb,var(--fg) 45%,transparent)}
textarea.in{resize:vertical;min-height:84px;line-height:1.5}
.hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--field)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--fg)}
.range output{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}

/* görsel alanı */
.img-field{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumb{width:84px;height:84px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:none;
 background:repeating-conic-gradient(color-mix(in srgb,var(--fg) 6%,transparent) 0 25%,transparent 0 50%) 0 0/14px 14px}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.wide{width:150px}
.thumb.dark{background-color:#111110}
.thumb.light{background-color:#EBE9E5}
.thumb span{font-size:11px;color:var(--muted);text-align:center;padding:4px}
.logo-prev{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.logo-prev>div{display:flex;align-items:center;gap:10px;min-height:76px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);overflow:hidden}
.logo-prev .lp-light{background:#EBE9E5;color:#111110}
.logo-prev .lp-dark{background:#111110;color:#EBE9E5}
.logo-prev img{height:var(--lh,34px);width:auto;max-width:100%;object-fit:contain;display:block}
.logo-prev img.inv{filter:invert(1) hue-rotate(180deg)}
.logo-prev .mono{height:var(--lh,34px);max-width:100%;background:currentColor;-webkit-mask:var(--lm) center/contain no-repeat;mask:var(--lm) center/contain no-repeat}
.logo-prev span{font-size:12px;opacity:.6}
.client-row{display:grid;grid-template-columns:22px 108px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px}
.client-logo{height:64px;border-radius:12px;background:#F4F2EE;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:8px}
.client-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.client-logo span{font-size:11px;color:#777}
.client-fields{display:grid;gap:6px;min-width:0}
.client-fields .in{padding:8px 11px;font-size:14px}
.client-act{display:flex;gap:6px;align-items:center}
@media(max-width:620px){.client-row{grid-template-columns:22px 84px minmax(0,1fr)}.client-act{grid-column:2/-1;justify-content:flex-end}.client-logo{height:54px}}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--fg)}
@media(max-width:560px){.logo-prev{grid-template-columns:1fr}}

/* listeler */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:16px;background:var(--field);overflow:hidden}
.item.dragging{box-shadow:0 18px 40px rgba(0,0,0,.28);position:relative;z-index:5;opacity:.96}
.item-head{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 6px;cursor:pointer;user-select:none}
.drag{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;cursor:grab;color:var(--muted);touch-action:none;flex:none}
.drag:active{cursor:grabbing}
.drag:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.item-title{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-title small{font-weight:400;color:var(--muted);margin-left:8px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.dev{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.off{text-decoration:line-through}
.chev{transition:transform .25s;color:var(--muted);flex:none}
.item.open .chev{transform:rotate(180deg)}
.item-body{padding:4px 16px 16px;border-top:1px solid var(--line)}
.item-body .grid{margin-top:14px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 4px}
.toggle input{width:18px;height:18px;accent-color:var(--fg)}
.mini{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.6fr) 36px;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--field)}
.mini .in{padding:9px 11px;font-size:14px}
.mini textarea.in{min-height:42px}
@media (max-width:620px){.mini{grid-template-columns:34px minmax(0,1fr) 36px}.mini textarea{grid-column:2/3}}
.add{margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;
 background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;transition:all .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{min-height:100svh;display:grid;place-items:center;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

<script src="/ayse/app.js"></script>
</body>
</html>
