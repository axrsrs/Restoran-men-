.adm-tour-card{position:fixed;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));background:#fff;color:#1d1d1f;border-radius:20px;padding:18px 18px 14px;box-shadow:0 24px 60px rgba(0,0,0,.35);font-family:var(--apple-font,Inter,system-ui,sans-serif)}
.adm-tour-card.is-bottom{bottom:max(16px,env(safe-area-inset-bottom))}

.adm-tour-card.is-center{top:50%;transform:translate(-50%,-50%)}
.adm-tour-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.adm-tour-ico{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--adm-accent,#C9A227);color:var(--adm-ink,#111);flex-shrink:0;font-weight:800;font-size:18px}
.adm-tour-title{font-weight:700;font-size:16px;line-height:1.25}

.adm-tour-text{font-size:14px;line-height:1.55;color:#3a3a3c;margin:0 0 12px}
.adm-tour-list{margin:0 0 12px;padding-left:18px;font-size:13px;line-height:1.55;color:#3a3a3c;list-style:disc}
.adm-tour-dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
.adm-tour-dots span{width:6px;height:6px;border-radius:99px;background:#d1d1d6;transition:.25s}

.adm-tour-btns{display:flex;gap:8px}

.adm-help-btn{font-weight:800;font-size:17px}
