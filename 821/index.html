<style>
/* Tek koyu görünüm: menü panelinin altın vurgulu tasarım dili */
:root{
 color-scheme:dark;
 --bg:#0f0f11;
 --surface:#16161a;
 --surface2:#1d1d22;
 --line:rgba(255,255,255,.08);
 --ink:#f2f2f4;
 --muted:#8b8b95;
 --accent:#d6a83d;
 --accent2:#f0c45a;
 --ok:#6fcf8f;
 --warn:#f0b35a;
 --bad:#ff8d8d;
 --info:#8fb8ff;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
body{
 padding-left:max(16px,env(safe-area-inset-left,0px));
 padding-right:max(16px,env(safe-area-inset-right,0px));
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent2)}
.wrap{max-width:1100px;margin:0 auto}
[hidden]{display:none!important}

.btn{
 display:inline-flex;align-items:center;justify-content:center;gap:6px;
 min-height:42px;padding:9px 14px;border-radius:11px;
 border:1px solid var(--line);background:var(--surface2);color:var(--ink);
 font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap
}
.btn.gold{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111}
.btn.danger{background:#3a1719;border-color:#572024;color:var(--bad)}
.btn.small{min-height:34px;padding:6px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:default}

.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field input,.field select{
 width:100%;min-height:44px;padding:10px 12px;border-radius:11px;
 border:1px solid #303036;background:#121215;outline:none
}
.field input:focus,.field select:focus{border-color:var(--accent)}
.hint{font-size:11px;color:var(--muted)}
.hint code{font-family:var(--mono);color:var(--accent2);word-break:break-all}
.error{
 margin-top:12px;padding:10px 12px;border-radius:10px;
 background:#3a1717;color:var(--bad);font-size:12.5px
}

/* Giriş */
.login-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.login{max-width:380px;margin:12vh auto 0;padding:26px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.logo{
 width:56px;height:56px;border-radius:16px;margin-bottom:16px;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,var(--accent),var(--accent2));color:#111;
 font:700 26px Georgia,serif
}
.login h1{margin:0;font-size:22px}
.login p{margin:6px 0 4px;color:var(--muted);font-size:13px}
.login .btn{width:100%;margin-top:16px}

/* Üst bar */
.top{
 position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:14px 0;background:var(--bg);border-bottom:1px solid var(--line)
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:12px;margin:0;font-size:19px;flex:0 0 40px}
.brand b{display:block;font-size:15px}
.brand span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* İstatistik */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.stat{padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{display:block;margin-top:4px;font-size:24px;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}

.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1 1 180px}

.toolbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.search{
 flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:0 12px;
 min-height:44px;border-radius:12px;border:1px solid #303036;background:#121215
}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;min-height:42px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
 min-height:34px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
 background:var(--surface);color:var(--muted);font-size:12px;font-weight:700
}
.chip.on{border-color:var(--accent);color:var(--accent2);background:rgba(214,168,61,.1)}

/* Ürün sekmesi: Menüler | Kataloglar */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin:0 0 14px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.03)}
.kinds button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border:0;border-radius:12px;background:transparent;color:#a1a1aa;font:inherit;font-weight:700;font-size:14px;cursor:pointer;min-height:48px}
.kinds button small{font-weight:500;font-size:11px;opacity:.7}
.kinds button.on{background:#d6a83d;color:#111}
/* Restoran listesi */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.card{
 display:flex;flex-direction:column;gap:10px;padding:15px;border-radius:16px;
 background:var(--surface);border:1px solid var(--line);min-width:0
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-head h3{margin:0;font-size:16px;line-height:1.3;word-break:break-word}
.card-head a{font-family:var(--mono);font-size:11.5px;word-break:break-all;text-decoration:none}
.pill{
 flex:0 0 auto;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;
 border:1px solid currentColor
}
.pill.active{color:var(--ok)}
.pill.trial{color:var(--info)}
.pill.expired{color:var(--warn)}
.pill.passive{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.trialline{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.trialline.warn{color:var(--warn)}
.members{display:flex;flex-direction:column;gap:4px;font-size:12px}
.member{display:flex;align-items:center;gap:6px;min-width:0}
.member span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:0 0 auto;padding:1px 6px;border-radius:6px;background:rgba(240,179,90,.13);color:var(--warn);font-size:10px;font-weight:700}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.card-actions .btn{flex:1 1 auto}
.empty{margin-top:30px;padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

/* Modal */
.overlay{
 position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
 background:rgba(0,0,0,.7);padding:0
}
.modal{
 width:100%;max-width:560px;max-height:92vh;overflow:auto;
 padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));
 border-radius:22px 22px 0 0;background:var(--surface);border:1px solid var(--line)
}
@media (min-width:700px){
 .overlay{align-items:center;padding:20px}
 .modal{border-radius:22px}
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-head h2{margin:0;font-size:19px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:700;color:var(--muted)}
.seg button.on{border-color:var(--accent);color:var(--accent2);background:rgba(214,168,61,.1)}
.seg button small{display:block;font-weight:500;font-size:10.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.modal-foot{display:flex;gap:8px;margin-top:20px}
.modal-foot .btn{flex:1}
.result{
 margin-top:14px;padding:14px;border-radius:14px;background:#121215;border:1px solid var(--line);
 font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;line-height:1.6
}
.success{display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--ok);font-weight:700}
.section-title{margin:20px 0 4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ext{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.memberrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.memberrow span{min-width:0;overflow:hidden;text-overflow:ellipsis}

#toast{
 position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:300;
 transform:translate(-50%,-20px);opacity:0;pointer-events:none;
 max-width:calc(100% - 32px);padding:11px 16px;border-radius:12px;
 background:#1d1d22;border:1px solid rgba(214,168,61,.45);font-weight:700;font-size:13px;
 transition:opacity .2s,transform .2s
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin-top:60px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}#toast{transition:none}}

@media (max-width:760px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .stats .stat:first-child{grid-column:1/-1}
 .list{grid-template-columns:1fr}
}

/* ===== Giriş kartı (Uiverse.io by Priyanshu02020, menu21 için uyarlandı) ===== */
.lg-container{
 --form-width:315px;
 --login-box-color:#272727;
 --input-color:#3a3a3a;
 --button-color:#373737;
 --footer-color:rgba(255,255,255,.5);
 display:flex;justify-content:center;align-items:center;
 position:relative;overflow:hidden;
 background:var(--login-box-color);
 border-radius:24px;
 width:min(calc(var(--form-width) + 2px),100%);
 padding:1px;
 z-index:8;
 box-shadow:
  0 4px 8px rgba(0,0,0,.2),
  0 8px 16px rgba(0,0,0,.2),
  0 0 8px rgba(255,255,255,.1),
  0 0 16px rgba(255,255,255,.08);
}
.lg-container::before{
 content:"";
 position:absolute;left:50%;top:50%;
 width:200%;aspect-ratio:1;
 z-index:-2;
 background:conic-gradient(from 45deg,transparent 75%,#fff,transparent 100%);
 transform:translate(-50%,-50%) rotate(0deg);
 animation:lgSpin 4s ease-in-out infinite;
}
@keyframes lgSpin{
 100%{transform:translate(-50%,-50%) rotate(360deg)}
}
.lg-box{
 position:relative;z-index:10;
 width:100%;
 background:var(--login-box-color);
 border-radius:23px;
 padding:28px;
 backdrop-filter:blur(15px);
 -webkit-backdrop-filter:blur(15px);
 box-shadow:
  inset 0 40px 60px -8px rgba(255,255,255,.12),
  inset 4px 0 12px -6px rgba(255,255,255,.12),
  inset 0 0 12px -4px rgba(255,255,255,.12);
}
.lg-form{
 display:flex;justify-content:center;align-items:center;
 flex-direction:column;gap:10px;
}
.lg-logo{
 width:65px;height:65px;flex:0 0 65px;
 background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(0,0,0,.2));
 box-shadow:8px 8px 16px rgba(0,0,0,.2),-8px -8px 16px rgba(255,255,255,.06);
 border-radius:20px;border:2px solid #fff;
 display:flex;justify-content:center;align-items:center;
 position:relative;
}
.lg-logo::before{
 content:"";position:absolute;bottom:10px;width:50%;height:20%;
 border-top-left-radius:40px;border-top-right-radius:40px;
 border-bottom-right-radius:20px;border-bottom-left-radius:20px;
 border:2.5px solid #fff;
}
.lg-logo::after{
 content:"";position:absolute;top:10px;width:30%;height:30%;
 border-radius:50%;border:2.5px solid #fff;
}
.lg-header{
 width:100%;text-align:center;font-size:24px;font-weight:bold;
 padding:6px;color:#fff;margin:0;line-height:1.25
}
.lg-sub{
 width:100%;margin:-4px 0 4px;text-align:center;
 color:var(--footer-color);font-size:12.5px;line-height:1.45
}
.lg-input{
 width:100%;padding:10px 12px;min-height:42px;
 border:1px solid transparent;border-radius:12px;
 background:var(--input-color);color:#fff;
 outline:none;font-size:16px;
}
.lg-input::placeholder{color:rgba(255,255,255,.45)}
.lg-input:focus{border:1px solid #fff}
.lg-button{
 width:100%;height:42px;border:none;border-radius:20px;
 font-size:14px;font-weight:600;cursor:pointer;
 display:grid;place-content:center;
 background:var(--button-color);color:#fff;
 transition:.3s;
 box-shadow:
  inset 0 3px 6px -4px rgba(255,255,255,.6),
  inset 0 -3px 6px -2px rgba(0,0,0,.8);
}
.lg-button.sign-in{margin-top:5px}
.lg-button:hover{
 background:rgba(255,255,255,.25);
 box-shadow:
  inset 0 3px 6px rgba(255,255,255,.6),
  inset 0 -3px 6px rgba(0,0,0,.8),
  0 0 8px rgba(255,255,255,.05);
}
.lg-button:disabled{opacity:.6;cursor:default}
.lg-footer{
 width:100%;margin:4px 0 0;text-align:left;
 color:var(--footer-color);font-size:12px;line-height:1.6
}
.lg-link{
 position:relative;padding:0;border:0;background:none;
 color:var(--footer-color);font-weight:600;font-size:12px;
 text-decoration:none;cursor:pointer;transition:color .3s ease
}
.lg-link::after{
 content:"";position:absolute;left:0;bottom:-2px;width:0;
 border-radius:6px;height:1px;background:currentColor;transition:width .3s ease
}
.lg-link:hover,.lg-link:focus-visible{color:#fff}
.lg-link:hover::after,.lg-link:focus-visible::after{width:100%}
.lg-close{
 position:absolute;top:12px;right:12px;z-index:12;
 width:32px;height:32px;border:0;border-radius:50%;
 background:rgba(255,255,255,.08);color:#ddd;font-size:18px;cursor:pointer
}
.lg-error{
 display:none;width:100%;padding:9px 11px;border-radius:10px;
 background:rgba(255,80,80,.14);color:#ff9d9d;font-size:12px;text-align:center
}
.lg-loader{margin:6px auto 0}
@media (prefers-reduced-motion:reduce){.lg-container::before{animation-duration:16s}}

/* ===== Yükleme animasyonu ===== */
/* From Uiverse.io by r0n-dev */ 
.orbital-loader {
  position: relative;
  width: 140px;
  height: 140px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  perspective: 800px;
  transform-style: preserve-3d;
  box-sizing: border-box;
}

.orbital-loader *,
.orbital-loader *::before,
.orbital-loader *::after {
  box-sizing: border-box;
  transform-style: preserve-3d;
}

.core-system {
  position: absolute;
  width: 10px;
  height: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: coreMasterCycle 22s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

.core-micro-center {
  position: absolute;
  width: 3px;
  height: 3px;
  background-color: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.9);
  animation: corePulse 3.73s ease-in-out infinite alternate;
}

.core-inner-glow {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(200, 235, 255, 0.9) 0%,
    rgba(255, 255, 255, 0) 70%
  );
  animation: coreBreathe 2.41s ease-in-out infinite alternate;
}

.core-thin-ring {
  position: absolute;
  width: 14px;
  height: 14px;
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  animation: coreRingRotate 4.12s linear infinite;
}

.core-secondary-ring {
  position: absolute;
  width: 22px;
  height: 22px;
  border: 1px dashed rgba(180, 220, 255, 0.35);
  border-radius: 50%;
  animation: coreRingRotateReverse 6.28s linear infinite;
}

.core-outer-ring {
  position: absolute;
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-top-color: rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  animation: coreRingRotate 9.14s linear infinite;
}

.core-halo {
  position: absolute;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(160, 215, 255, 0.12) 0%,
    rgba(255, 255, 255, 0) 75%
  );
  animation: coreFluctuate 5.18s ease-in-out infinite alternate;
}

.pulse-system {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pulse-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(210, 240, 255, 0.8);
  opacity: 0;
  width: 4px;
  height: 4px;
}

.pulse-ring-1 {
  animation: shockwavePulse 22s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
}

.pulse-ring-2 {
  animation: shockwavePulse 22s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 0.18s;
}

.pulse-ring-3 {
  animation: shockwavePulse 22s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 0.36s;
}

.orbit-system {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.orbit-path {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  pointer-events: none;
}

.orbit-object-wrapper {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
}

.orbit-object {
  position: absolute;
  top: 50%;
  left: 100%;
  transform: translate(-50%, -50%);
}

.orbit-1 {
  width: 90px;
  height: 90px;
  transform: rotateX(68deg) rotateY(12deg) rotateZ(0deg);
  animation: orbitMaster1 22s ease-in-out infinite;
}

.orbit-1 .orbit-path {
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: radial-gradient(
    circle,
    transparent 60%,
    rgba(255, 255, 255, 0.03) 100%
  );
}

.orbit-1 .orbit-object-wrapper {
  animation: spinClockwise 3.73s linear infinite;
}

.orbit-1 .obj-circle {
  width: 4px;
  height: 4px;
  background-color: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 5px #ffffff;
}

.orbit-1 .object-trail {
  position: absolute;
  top: 50%;

:root{
 color-scheme:dark;
 --bg:#111110;--surface:#1A1A19;--surface2:#232321;--field:#151514;
 --line:rgba(241,239,234,.10);--line2:rgba(241,239,234,.18);

 --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 --serif:"Instrument Serif",Georgia,serif;
}
:root[data-theme="light"]{
 color-scheme:light;
 --bg:#EBE9E5;--surface:#F5F3EF;--surface2:#E4E1DC;--field:#FFFFFF;
 --line:rgba(21,21,20,.10);--line2:rgba(21,21,20,.18);
 --ink:#151514;--muted:#6E6C67;--accent:#151514;--accent2:#151514;--onAccent:#F5F3EF;
 --ok:#2e7d32;--warn:#a15c00;--bad:#c62828;--info:#1f5fbf;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);transition:background .25s,color .25s}
a{color:var(--ink)}
h1,h2,h3,.brand b{letter-spacing:-.02em;font-weight:600}
.btn{border-radius:999px;background:var(--surface2);border-color:var(--line);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--line2)}
.btn.gold{background:var(--ink);color:var(--onAccent);border-color:transparent}
.btn.gold:hover{opacity:.9}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad)}
.field input,.field select,.search{border-color:var(--line2);background:var(--field);color:var(--ink)}
.field input:focus,.field select:focus,.search:focus-within{border-color:var(--ink)}
.hint code,.card-head a{color:var(--muted)}
.card-head a:hover{color:var(--ink)}
.error{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.stat b{font-weight:500;letter-spacing:-.03em;font-size:28px}
.chip.on,.seg button.on{border-color:var(--ink);color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.kinds{border-color:var(--line);background:color-mix(in srgb,var(--ink) 3%,transparent)}
.kinds button{color:var(--muted)}
.kinds button.on{background:var(--ink);color:var(--onAccent)}
.tag{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.result{background:var(--field)}
.overlay{background:rgba(10,10,9,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#toast{background:var(--surface);border-color:var(--line2);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.check input{accent-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline-color:var(--ink)}

.theme-btn svg{width:16px;height:16px}

function slugify(text){
 const map={"ç":"c","ğ":"g","ı":"i","İ":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u"};
 return String(text||"").toLocaleLowerCase("tr-TR")
  .replace(/[çğıİöşüâîû]/g,ch=>map[ch]||ch)
  .normalize("NFD").replace(/[̀-ͯ]/g,"")

}

function fmtDate(d){
 if(!d)return "";
 const [y,m,day]=String(d).slice(0,10).split("-").map(Number);
 return new Date(y,m-1,day).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
}

function daysLeft(d){
 if(!d)return null;
 const [y,m,day]=String(d).slice(0,10).split("-").map(Number);
 const end=new Date(y,m-1,day);
 const today=new Date();today.setHours(0,0,0,0);
 return Math.round((end-today)/86400000);
}

function isoPlus(days){
 const d=new Date();d.setDate(d.getDate()+days);

function storeSession(s){

async function authReq(path,body,method,withToken){
 const r=await fetch(SB_URL+"/auth/v1/"+path,{
  method:method||"POST",
  headers:Object.assign({"apikey":SB_KEY,"Content-Type":"application/json"},
   withToken&&session?{"Authorization":"Bearer "+session.access_token}:{}),
  body:JSON.stringify(body||{})
 });
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||("HTTP "+r.status));e.status=r.status;e.code=j.error_code||"";throw e}
 return j;
}

function toSession(j){
 return {access_token:j.access_token,refresh_token:j.refresh_token,
  expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user||session?.user||null};
}

async function ensureFresh(){
 if(!session)return;
 if((session.expires_at||0)-Math.floor(Date.now()/1000)>90)return;
 try{
  storeSession(toSession(await authReq("token?grant_type=refresh_token",{refresh_token:session.refresh_token})));
 }catch(e){
  if(e.status>=400&&e.status<500)storeSession(null);
 }
}

async function sb(path,opts={}){
 await ensureFresh();
 const headers=Object.assign({"apikey":SB_KEY},opts.headers||{});
 if(opts.body!==undefined)headers["Content-Type"]="application/json";
 if(session)headers["Authorization"]="Bearer "+session.access_token;
 const r=await fetch(SB_URL+path,{method:opts.method||"GET",headers,body:opts.body===undefined?undefined:JSON.stringify(opts.body)});
 if(!r.ok){
  let j={};try{j=await r.json()}catch(e){}
  const e=new Error(j.message||("HTTP "+r.status));e.status=r.status;e.code=j.code||"";throw e;
 }
 if(r.status===204)return null;
 const t=await r.text();return t?JSON.parse(t):null;
}

function shareText(r,owner){

 const lines=[];
 const url=K().url(r.slug);

 if(r.status==="trial"){
  lines.push("Merhaba! "+r.name+" "+K().shareDemo);
 }else{
  lines.push("Merhaba! "+r.name+" "+K().shareReady);
 }
 lines.push(url);

 if(owner&&owner.temp_password){
  lines.push("");
  lines.push(K().edit);
  lines.push("E-posta: "+owner.email);
  lines.push("Şifre: "+owner.temp_password);
 }

 if(r.status==="trial"&&r.trial_ends){
  lines.push("");
  lines.push("Demo "+fmtDate(r.trial_ends)+" tarihine kadar açık.");
 }

 return lines.join("\n");
}

function bindLogin(){

 const doLogin=async()=>{
  const email=($("em").value||"").trim().toLowerCase();
  const pw=$("pw").value||"";
  const btn=$("loginBtn");
  if(!email||!pw){showErr("E-posta ve şifreyi girin.");return}
  btn.disabled=true;btn.textContent="Giriş yapılıyor...";
  try{
   storeSession(toSession(await authReq("token?grant_type=password",{email,password:pw})));
   safeSet("nearMenuLastEmail",email);
   await afterLogin();
  }catch(e){
   btn.disabled=false;btn.textContent="Giriş yap";
   showErr(e.status===400?"E-posta veya şifre yanlış.":e.status===429?"Çok fazla deneme. Biraz bekleyin.":"Giriş yapılamadı: "+e.message);
  }
 };

 $("loginBtn")?.addEventListener("click",doLogin);
 $("pw")?.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});

 $("npSave")?.addEventListener("click",async()=>{
  const a=$("np1").value,b=$("np2").value,btn=$("npSave");
  if(a.length<8){showErr("Şifre en az 8 karakter olmalı.");return}
  if(a!==b){showErr("Şifreler aynı değil.");return}
  btn.disabled=true;
  try{
   await ensureFresh();
   const u=await authReq("user",{password:a,data:{must_change_password:false}},"PUT",true);
   session.user=u;storeSession(session);
   toast("✓ Şifre kaydedildi");
   await afterLogin();
  }catch(e){
   btn.disabled=false;
   showErr(String(e.message).toLowerCase().includes("different")?"Yeni şifre eskisinden farklı olmalı.":"Şifre kaydedilemedi: "+e.message);
  }
 });
}

async function afterLogin(){

 if(session?.user?.user_metadata?.must_change_password){
  view="newPassword";
  render();
  return;
 }

 try{
  await loadRestaurants();
  view="app";
  render();
 }catch(e){
  if(e.status===403||e.code==="42501"||/süper yönetici/i.test(e.message)){
   storeSession(null);
   view="login";
   render();
   showErr("Bu hesap süper yönetici değil.");
  }else if(e.status===401){
   storeSession(null);
   view="login";
   render();
  }else{
   view="login";
   render();
   showErr("Bağlantı hatası: "+e.message);
  }
 }
}

   const res=await rpc(K().create,{
    p_name:f.name.trim(),
    p_slug:slugV,
    p_status:demo?"trial":"active",
    p_plan:demo?"basic":f.plan,
    p_trial_days:demo?f.days:14,
    p_copy_from:f.copy?K().demo:null,
    p_owner_email:f.account?email:null,
    p_force_change:!demo
   });

   const r={id:res.id,slug:res.slug,name:f.name.trim(),status:demo?"trial":"active",trial_ends:demo?isoPlus(f.days):null};
   modal={type:"result",restaurant:r,owner:res.owner,products:res.products};
   render();

  }catch(e){
   btn.disabled=false;btn.textContent=demo?"Demoyu oluştur":"Müşteriyi ekle";
   showErr(e.message||"Oluşturulamadı.");
  }
 });

 /* result / share */
 $("copyShare")?.addEventListener("click",()=>copyText($("shareText").textContent));
 $("copyLink")?.addEventListener("click",()=>copyText(K().url(modal.restaurant.slug)));

 /* edit */
 const r=modal.type==="edit"?restaurants.find(x=>x.id===modal.id):null;

 document.querySelectorAll("[data-extend]").forEach(b=>b.onclick=()=>{
  const cur=$("eTrial").value;
  const base=cur&&daysLeft(cur)>=0?cur:isoPlus(0);
  const [y,m,d]=base.split("-").map(Number);
  const dt=new Date(y,m-1,d+Number(b.dataset.extend));
  $("eTrial").value=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  $("eStatus").value="trial";
 });

 $("eSave")?.addEventListener("click",async()=>{
  const status=$("eStatus").value;
  const body={
   name:$("eName").value.trim()||r.name,
   status,
   plan:$("ePlan").value,
   trial_ends:status==="trial"?($("eTrial").value||isoPlus(14)):null
  };
  try{
   await sb("/rest/v1/"+K().table+"?id=eq."+r.id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body});
   Object.assign(r,body);
   toast("✓ Kaydedildi");
   modal=null;
   render();
   reload();
  }catch(e){showErr("Kaydedilemedi: "+e.message)}
 });

 document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=async()=>{
  if(!confirm(b.dataset.reset+" için yeni geçici şifre oluşturulsun mu? Eski şifre çalışmaz."))return;
  try{
   const res=await rpc("admin_reset_password",{p_email:b.dataset.reset});
   modal={type:"share",restaurant:r,owner:{email:res.email,temp_password:res.temp_password}};
   render();
  }catch(e){showErr(e.message)}
 });

 $("eAddOwner")?.addEventListener("click",async()=>{
  const email=($("eOwner").value||"").trim().toLowerCase();
  if(!email){showErr("E-posta yazın.");return}
  try{
   const res=await rpc(K().addOwner,{[K().ownerParam]:r.id,p_email:email,p_force_change:r.status!=="trial"});
   await loadRestaurants();
   modal={type:"share",restaurant:restaurants.find(x=>x.id===r.id)||r,owner:res};
   render();
  }catch(e){showErr(e.message)}
 });

 $("eDelete")?.addEventListener("click",async()=>{
  if(($("eDel").value||"").trim()!==r.slug){showErr("Onay için adresi tam olarak yazın: "+r.slug);return}
  if(!confirm(r.name+" ve tüm içeriği kalıcı olarak silinecek. Emin misiniz?"))return;
  try{
   await sb("/rest/v1/"+K().table+"?id=eq."+r.id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
   restaurants=restaurants.filter(x=>x.id!==r.id);
   modal=null;
   render();
   toast("Silindi");
  }catch(e){showErr("Silinemedi: "+e.message)}
 });
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&modal)closeModal();
});

/* =========================================================
   BAŞLAT
========================================================= */
(async()=>{
 render();
 if(session){
  await ensureFresh();
 }
 if(session){
  await afterLogin();
 }else{
  view="login";
  render();
 }
})();
</script>
</body>
</html>
