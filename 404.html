<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönlendiriliyor... · NearDiji</title>
<style>
 html,body{margin:0;height:100%;background:#0f0f11;color:#8b8b95;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
 body{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
 a{color:#f0c45a}
</style>
<script>
/* GitHub Pages bilinmeyen yolları bu sayfaya gönderir:
   /menu/xfirma → menü, /admin → süper yönetici, eski /xfirma → /menu/xfirma */
(function(){
 var parts=location.pathname.split("/").filter(Boolean);
 if(/github\.io$/i.test(location.hostname))parts.shift();
 var a=(parts[0]||"").toLowerCase(), b=(parts[1]||"").toLowerCase();
 try{a=decodeURIComponent(a);b=decodeURIComponent(b)}catch(e){}
 var slug=/^[a-z0-9]+(-[a-z0-9]+)*$/;
 if(a==="admin"||a==="yonetim"){location.replace("/admin.html");return}
 if(a==="menu"&&slug.test(b)){location.replace("/menu/?r="+encodeURIComponent(b)+location.hash);return}
 if(a&&a!=="menu"&&slug.test(a)){location.replace("/menu/?r="+encodeURIComponent(a)+location.hash);return}
 location.replace("/");
})();
</script>
</head>
<body><p>Yönlendiriliyor... <a href="/">NearDiji ana sayfa</a></p></body>
</html>
