name = "neardiji-media"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false

routes = [
  { pattern = "media.neardiji.com", custom_domain = true }
]

# Her bölümün kendi deposu (Doğu Avrupa)
[[r2_buckets]]
binding = "MENU"
bucket_name = "neardiji-menu"

[[r2_buckets]]
binding = "KATALOG"
bucket_name = "neardiji-katalog"

[[r2_buckets]]
binding = "SITE"
bucket_name = "neardiji-site"

# Geçiş dönemi: eski ortak depo yalnız okuma yedeği. Her şey doğrulanınca bu blok ve depo kaldırılır.
[[r2_buckets]]
binding = "LEGACY"
bucket_name = "neardiji-media"

[vars]
SUPABASE_URL = "https://rfwgjzkewtjpdcvrhepg.supabase.co"
SUPABASE_KEY = "sb_publishable_ohHiomyazD8qr_mQXX9G-Q_DCEeD8j2"

[ai]
binding = "AI"

# Hata ve istek kayıtları (Cloudflare → Workers → neardiji-media → Logs)
[observability]
enabled = true
