<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; connect-src 'self' https://rfwgjzkewtjpdcvrhepg.supabase.co https://cloudflareinsights.com https://media.neardiji.com https://api.mymemory.translated.net https://open.er-api.com https://api.frankfurter.app https://api.frankfurter.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111110">
<meta name="description" content="Dijital QR menü — ürünler, fiyatlar ve etkinlikler.">
<meta property="og:title" content="Dijital Menü">
<meta property="og:description" content="Menümüzü inceleyin: ürünler, fiyatlar ve etkinlikler.">
<meta property="og:type" content="website">
<title>NearMenu Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;min-height:100%;
 background:#111110;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
body{min-height:100vh;overflow-x:hidden;font-size:13px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

:root{
 /* NearDiji paleti — ana siteyle aynı */
 --pBg:#0F0F0E;--pBar:rgba(15,15,14,.94);--pSurface:#1A1A19;--pSurface2:#232321;--pField:#151514;
 --pLine:rgba(241,239,234,.09);--pLine2:rgba(241,239,234,.16);--pText:#F1EFEA;--pText2:#D3D0C9;--pMuted:#8D8B86;
 --pOverlay:rgba(0,0,0,.8);--onAccent:#111110;
 --accent:#d6a83d;
 --accent2:#f0c45a;
 --text:#fff;
 --muted:#8D8B86;
 --price:#f0c45a;
 --card:#1A1A19;
 --line:#2A2A28;
 --overlay:.55;
 --cardOpacity:.94;
 --cardRadius:20px;
 --titleSize:34px;
 --bodySize:13px;
 --logoSize:112px;
 --fontFamily:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 --titleFont:"Instrument Serif",Georgia,serif
}

body{
 font-family:var(--fontFamily);
 color:var(--text);
 font-size:var(--bodySize)
}
html{scroll-behavior:smooth;background:#111110}

.background{
 position:fixed;inset:0;width:100%;height:100%;
 z-index:0;overflow:hidden;background:#111110;
 pointer-events:none
}
.background img,.background video{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover
}
.backgroundOverlay{
 position:absolute;inset:0;
 background:rgba(0,0,0,var(--overlay))
}

#app{position:relative;z-index:1;min-height:100vh;background:transparent}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pageIn{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:none}
}
@keyframes cardIn{
 from{opacity:0;transform:translateY(15px) scale(.985)}
 to{opacity:1;transform:none}
}
@keyframes drawerIn{
 from{transform:translateX(-100%)}to{transform:none}
}
@keyframes adminIn{
 from{transform:translateX(100%);opacity:.5}
 to{transform:none;opacity:1}
}
@keyframes modalUp{
 from{opacity:0;transform:translateY(100%)}
 to{opacity:1;transform:none}
}
@keyframes pulse{
 0%,100%{opacity:1}
 50%{opacity:.45}
}

#app.noAnim .pageContent,#app.noAnim .section,#app.noAnim .product,#app.noAnim .category,
#app.noAnim .feature,#app.noAnim .event,#app.noModalAnim .modal,#app.noModalAnim .modalOverlay{animation:none!important}
.pageContent{animation:pageIn .28s ease both}
.section{animation:pageIn .32s ease both}
.product,.category,.feature,.event{animation:cardIn .38s ease both}

button,input,textarea,select{
 transition:
 transform .18s ease,
 background .18s ease,
 border-color .18s ease,
 box-shadow .18s ease,
 color .18s ease
}
button:active{transform:scale(.97)}

.container{
 position:relative;z-index:2;width:100%;
 max-width:650px;margin:auto;
 padding:0 16px
}

.top{
 position:sticky;top:0;z-index:90;
 padding:11px 0;background:transparent
}

.topRow{
 display:flex;align-items:center;
 justify-content:flex-end;gap:10px
}
.topRight{
 display:flex;align-items:center;
 gap:7px;position:relative
}
.iconBtn{
 width:43px;height:43px;flex:0 0 43px;
 border:1px solid rgba(255,255,255,.09);
 border-radius:50%;
 background:rgba(25,25,27,.94);
 color:#fff;display:flex;
 align-items:center;justify-content:center;
 font-size:18px
}
.iconBtn:hover{
 background:#29292d;
 border-color:rgba(255,255,255,.18)
}
.currencyBtn{
 height:43px;min-width:49px;padding:0 15px;
 border:1px solid rgba(255,255,255,.07);
 border-radius:23px;background:var(--accent);
 color:var(--onAccent);font-weight:950
}
.languageBtn{font-size:10px;font-weight:900}

.searchBox{margin-top:9px}
.searchBox input{
 width:100%;padding:14px 16px;
 border-radius:15px;
 border:1px solid rgba(255,255,255,.08);
 background:#151517;color:#fff;outline:none
}
.searchBox input:focus{
 border-color:var(--accent);
 box-shadow:0 0 0 3px rgba(214,168,61,.1)
}

.quickPopup{
 position:absolute;right:0;top:51px;width:190px;
 padding:7px;border:1px solid rgba(255,255,255,.12);
 border-radius:17px;background:rgba(20,20,22,.98);
 box-shadow:0 25px 70px rgba(0,0,0,.7);
 backdrop-filter:blur(25px);z-index:500;
 animation:pageIn .18s ease
}
.quickPopup button{
 width:100%;min-height:43px;
 display:flex;align-items:center;
 justify-content:space-between;
 padding:10px 12px;margin:2px 0;
 border:0;border-radius:11px;
 background:transparent;color:#aaa;
 font-size:12px;font-weight:800
}
.quickPopup button:hover,
.quickPopup button.active{
 background:var(--accent);color:var(--onAccent)
}

.hero{
 text-align:center;padding:52px 0 34px;
 animation:pageIn .45s ease
}
.logo{
 width:var(--logoSize);height:var(--logoSize);
 margin:auto;display:flex;
 align-items:center;justify-content:center;
 border-radius:50%;border:1px solid var(--accent);
 background:
 radial-gradient(circle at 35% 25%,rgba(255,255,255,.07),transparent 42%),
 rgba(15,15,16,.94);
 color:var(--accent);font:42px Georgia,serif;
 box-shadow:
 0 0 0 7px rgba(214,168,61,.035),
 0 0 55px rgba(214,168,61,.15),
 inset 0 0 30px rgba(214,168,61,.035);
 overflow:hidden
}
.logo img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
#heroLogo{
 -webkit-user-select:none;user-select:none;
 -webkit-touch-callout:none;touch-action:manipulation;
 -webkit-tap-highlight-color:transparent;
 transition:transform 3s linear
}
#heroLogo.holding{transform:scale(.92)}
/* Çerçevesiz logo: şeffaf PNG kendi şeklinde, tema rengine göre hafif parıltı */
.logo.free{
 width:auto;max-width:min(80vw,calc(var(--logoSize) * 2.6));
 border:0;border-radius:0;background:none;box-shadow:none;overflow:visible
}
.logo.free img{
 width:auto;max-width:100%;height:100%;object-fit:contain;
 filter:drop-shadow(0 0 14px rgba(214,168,61,.3));
 filter:drop-shadow(0 0 14px color-mix(in srgb,var(--accent) 34%,transparent))
}
.heroContact{display:flex;justify-content:center;gap:8px;margin-top:14px}
.heroContactBtn{
 padding:8px 16px;border-radius:999px;
 border:1px solid rgba(214,168,61,.35);
 color:var(--accent);text-decoration:none;
 font-size:12px;font-weight:700;
 background:rgba(255,255,255,.03)
}
.welcome{
 margin-top:20px;color:var(--accent2);
 font-size:9px;font-weight:950;
 letter-spacing:.34em
}
.hero h1{
 margin:11px 0 8px;color:var(--text);
 font:700 var(--titleSize) var(--titleFont);
 line-height:1.05;letter-spacing:-.035em
}
.hero p{
 max-width:480px;margin:0 auto;color:var(--muted);
 font-size:var(--bodySize);line-height:1.65
}

.section{margin-top:34px}
.sectionHead{
 display:flex;align-items:center;
 justify-content:space-between;
 gap:10px;margin-bottom:15px
}
.sectionHead h2{
 margin:0;font-size:20px;letter-spacing:-.02em
}
.hint{color:#666;font-size:10px}

.horizontal{
 display:flex;gap:13px;overflow-x:auto;
 scrollbar-width:none;scroll-snap-type:x mandatory;
 padding:3px 0 7px
}
.horizontal::-webkit-scrollbar{display:none}

.feature,.event{
 position:relative;flex:0 0 88%;
 padding:0;border:1px solid rgba(255,255,255,.09);
 border-radius:24px;overflow:hidden;
 background:#111110;scroll-snap-align:start;
 color:#fff;
 box-shadow:
 0 20px 60px rgba(0,0,0,.38),
 inset 0 0 0 1px rgba(255,255,255,.02)
}
.feature{height:245px}
.event{height:210px}
.feature img,.feature video,
.event img,.event video{
 width:100%;height:100%;object-fit:cover;
 transition:transform .6s cubic-bezier(.2,.8,.2,1)
}
.feature:hover img,.feature:hover video,
.event:hover img,.event:hover video{
 transform:scale(1.045)
}
.featureShade,.eventShade{
 position:absolute;inset:0;
 background:
 linear-gradient(
 180deg,
 rgba(0,0,0,.02) 15%,
 rgba(0,0,0,.2) 40%,
 rgba(0,0,0,.94) 100%
 )
}
.featureText,.eventText{
 position:absolute;left:19px;right:19px;
 bottom:18px;text-align:left
}
.featureText strong{font-size:21px;letter-spacing:-.02em}
.featureText span{
 display:block;margin-top:7px;
 color:var(--price);font-weight:950;font-size:15px
}
.eventDate{
 position:absolute;top:13px;left:13px;
 padding:8px 11px;border:1px solid rgba(255,255,255,.08);
 border-radius:20px;background:rgba(0,0,0,.66);
 backdrop-filter:blur(10px);color:var(--accent2);
 font-size:10px
}
.eventText strong{font-size:19px}
.eventText span{
 display:block;margin-top:6px;
 color:#ccc;font-size:11px
}

.categories{
 display:grid;grid-template-columns:1fr 1fr;gap:13px
}
.category{
 position:relative;height:180px;padding:0;
 border:1px solid rgba(255,255,255,.09);
 border-radius:22px;overflow:hidden;
 background:#111110;color:#fff;
 box-shadow:
 0 16px 45px rgba(0,0,0,.28),
 inset 0 0 0 1px rgba(255,255,255,.02)
}
.category img{
 width:100%;height:100%;object-fit:cover;
 transition:transform .6s cubic-bezier(.2,.8,.2,1)
}
.category:hover img{transform:scale(1.055)}
.categoryShade{
 position:absolute;inset:0;
 background:
 linear-gradient(
 180deg,
 rgba(0,0,0,.03) 5%,
 rgba(0,0,0,.25) 35%,
 rgba(0,0,0,.95) 100%
 )
}
.categoryText{
 position:absolute;left:16px;right:16px;
 bottom:16px;text-align:left
}
.categoryText strong{
 display:block;font-size:18px;letter-spacing:-.025em
}
.categoryText span{
 display:block;color:#b4b4b4;
 font-size:10px;margin-top:5px
}

.categoryTitle{
 display:flex;align-items:center;
 justify-content:flex-start;gap:12px;
 margin-bottom:20px;padding-bottom:15px;
 border-bottom:1px solid rgba(255,255,255,.07)
}
.categoryTitle h2{
 flex:1;margin:0;font-size:22px!important;
 letter-spacing:-.035em
}
.backBtn{
 border:1px solid rgba(255,255,255,.08);
 background:
 linear-gradient(
 145deg,
 rgba(255,255,255,.07),
 rgba(255,255,255,.025)
 );
 color:#fff;padding:10px 13px;
 border-radius:12px;font-size:11px;font-weight:850
}

.products{
 display:flex;flex-direction:column;
 gap:13px;margin-top:0
}
.product{
 display:grid;grid-template-columns:126px 1fr;
 min-height:130px;overflow:hidden;
 border:1px solid rgba(255,255,255,.075);
 border-radius:var(--cardRadius);
 background:
 linear-gradient(
 145deg,
 rgba(30,30,32,var(--cardOpacity)),
 rgba(16,16,18,var(--cardOpacity))
 );
 cursor:pointer;
 box-shadow:
 0 14px 42px rgba(0,0,0,.24),
 0 1px 0 rgba(255,255,255,.025) inset
}
.product:hover{
 border-color:rgba(214,168,61,.2);
 transform:translateY(-1px)
}
.productImage{
 height:130px;background:#1c1c1e;
 overflow:hidden;position:relative
}
.productImage img,.productImage video{
 width:100%;height:100%;object-fit:cover
}
.productInfo{min-width:0;padding:15px 14px}
.productInfo h3{
 margin:0;color:var(--cardText);
 font-size:15px;font-weight:850;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.productInfo p{
 margin:6px 0;color:#929292;font-size:11px;
 line-height:1.48;display:-webkit-box;
 -webkit-line-clamp:2;-webkit-box-orient:vertical;
 overflow:hidden
}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{
 padding:4px 7px;border-radius:7px;
 background:#222225;color:#aaa;
 font-size:9px;border:1px solid rgba(255,255,255,.025)
}
.tag.sold{background:#7f1d1d;color:#fff}
.price{
 margin-top:8px;color:var(--price);
 font-weight:950;font-size:14px
}

.overlay{
 position:fixed;inset:0;z-index:100;
 background:rgba(0,0,0,.72);
 backdrop-filter:blur(6px)
}
.drawer{
 width:min(88%,390px);height:100%;overflow:auto;
 padding:20px;background:#101011;
 box-shadow:10px 0 50px #000;
 animation:drawerIn .25s cubic-bezier(.2,.8,.2,1)
}
.drawerHead{
 display:flex;align-items:center;
 justify-content:space-between
}
.drawerLogo{color:var(--accent);font:700 25px Georgia,serif}
.drawerSection{margin-top:25px}
.drawerLabel{
 color:#666;font-size:10px;
 letter-spacing:.15em;margin-bottom:8px
}
.drawerLink{
 display:block;width:100%;border:0;
 background:#18181a;color:#aaa;
 padding:13px;border-radius:10px;
 font-size:11px;text-align:left;margin-top:7px
}

.modalOverlay{
 position:fixed;inset:0;z-index:150;
 display:flex;align-items:flex-end;
 justify-content:center;
 background:rgba(0,0,0,.76);
 backdrop-filter:blur(7px)
}
.modal{
 width:min(100%,650px);max-height:92vh;
 overflow:auto;border-radius:27px 27px 0 0;
 background:#101011;box-shadow:0 -15px 60px rgba(0,0,0,.5);
 animation:modalUp .28s cubic-bezier(.2,.8,.2,1)
}
.modalImage{
 position:relative;height:310px;background:#18181a
}
.modalImage img,.modalImage video{
 width:100%;height:100%;object-fit:cover
}
.closeBtn{
 position:absolute;top:13px;right:13px;
 width:41px;height:41px;border:0;
 border-radius:50%;background:rgba(0,0,0,.72);
 color:#fff;font-size:23px
}
.modalBody{padding:21px}
.modalBody h2{margin:0;font-size:27px}
.modalBody p{
 color:#999;font-size:13px;line-height:1.65
}
.infoRow{
 display:flex;justify-content:space-between;
 gap:20px;padding:13px 0;
 border-bottom:1px solid #252527;font-size:12px
}
.modalPrice{
 margin-top:18px;color:var(--price);
 font-size:26px;font-weight:950
}

.adminOverlay{
 position:fixed;inset:0;z-index:250;
 background:var(--pOverlay);
 display:flex;justify-content:flex-end
}
.admin{
 width:min(100%,780px);height:100%;
 overflow-y:auto;overflow-x:hidden;
 overscroll-behavior:contain;
 -webkit-overflow-scrolling:touch;
 background:var(--pBg);
 animation:adminIn .28s cubic-bezier(.2,.8,.2,1)
}
.adminHeader{
 position:sticky;top:0;z-index:50;
 padding:18px 20px 14px;
 background:var(--pBar);
 border-bottom:1px solid var(--pLine);
 backdrop-filter:blur(24px)
}
.adminTop{
 display:flex;justify-content:space-between;
 align-items:center
}
.adminTitle{display:flex;align-items:center;gap:12px}
.adminTitleIcon{
 width:44px;height:44px;border-radius:13px;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:var(--onAccent);display:flex;
 align-items:center;justify-content:center;
 font-size:19px;font-weight:1000
}
.adminTitleText b{display:block;font-size:15px}
.adminTitleText span{
 display:block;margin-top:3px;color:var(--pMuted);
 font-size:9px;text-transform:uppercase;
 letter-spacing:.12em
}
.adminTabs{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:6px;margin-top:15px
}
.adminTabs button{
 padding:12px 4px;
 border:1px solid var(--pLine);
 border-radius:12px;background:var(--pSurface);
 color:var(--pMuted);font-size:11px;font-weight:850
}
.adminTabs button.active{
 background:color-mix(in srgb,var(--accent) 15%,transparent);
 border-color:color-mix(in srgb,var(--accent) 35%,transparent);
 color:var(--accent2)
}
.adminBody{padding:20px;padding-bottom:100px}
.adminSectionHeader{margin:4px 0 15px}
.adminSectionHeader h2{margin:0;font-size:24px}
.adminSectionHeader p{
 margin:5px 0 0;color:var(--pMuted);font-size:10px
}
.statsGrid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:10px;margin-bottom:18px
}
.statCard{
 padding:15px;min-height:105px;
 border:1px solid var(--pLine);
 border-radius:17px;
 background:linear-gradient(
 145deg,rgba(255,255,255,.045),
  rgba(255,255,255,.012)
 )
}
.statIcon{
 width:34px;height:34px;border-radius:10px;
 display:flex;align-items:center;
 justify-content:center;
 background:color-mix(in srgb,var(--accent) 11%,transparent);
 color:var(--accent2);margin-bottom:12px
}
.statLabel{
 color:var(--pMuted);font-size:9px;text-transform:uppercase
}
.statValue{
 margin-top:5px;font-size:24px;font-weight:950
}
.statSub{margin-top:3px;color:var(--pMuted);font-size:9px}

.adminCard{
 padding:17px;margin-bottom:12px;
 border:1px solid var(--pLine);
 border-radius:17px;
 background:linear-gradient(
 145deg,rgba(255,255,255,.035),
  rgba(255,255,255,.012)
 )
}
.adminCardTitle{font-size:15px;font-weight:900}
.adminCardDescription{
 margin-top:4px;color:var(--pMuted);
 font-size:10px;line-height:1.5
}
.field{margin-top:13px}
.field label{
 display:block;margin-bottom:6px;
 color:var(--pMuted);font-size:10px;font-weight:700
}
.field input,.field textarea,.field select{
 width:100%;padding:13px;
 border:1px solid var(--pLine2);border-radius:11px;
 background:var(--pField);color:var(--pText);outline:none
}
.field textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:9px}
.row>*{flex:1;min-width:0}

.adminButton{
 min-height:42px;border:1px solid var(--pLine);
 border-radius:11px;padding:10px 14px;
 background:var(--pField);color:var(--pText);
 font-size:11px;font-weight:850
}
.adminButton.gold{
 border-color:transparent;
 background:linear-gradient(135deg,var(--accent),var(--accent2));
 color:var(--onAccent)
}
.adminButton.danger{
 background:#3a1719;color:#ff9a9a;
 border-color:#572024
}
.full{width:100%}

.quickActions{
 display:grid;grid-template-columns:1fr 1fr;
 gap:9px;margin-bottom:18px
}
.quickAction{
 display:flex;align-items:center;gap:11px;
 padding:13px;border:1px solid var(--pLine);
 border-radius:14px;background:var(--pSurface);
 color:var(--pText2);text-align:left
}
.quickActionIcon{
 width:34px;height:34px;border-radius:10px;
 display:flex;align-items:center;
 justify-content:center;
 background:color-mix(in srgb,var(--accent) 8%,transparent);
 color:var(--accent2)
}

.adminBreadcrumb{
 display:flex;align-items:center;gap:8px;
 margin-bottom:15px;color:var(--pMuted);font-size:10px
}
.adminBreadcrumb button{
 border:0;background:transparent;color:var(--accent2)
}
.adminCategoryList,.adminProductList{
 display:flex;flex-direction:column;gap:9px
}
.adminCategoryItem,.adminProductItem{
 display:flex;align-items:center;gap:12px;
 padding:12px;width:100%;
 border:1px solid var(--pLine);
 border-radius:15px;background:var(--pField);
 color:var(--pText);text-align:left
}
.adminCategoryThumb,.adminProductThumb{
 width:58px;height:58px;flex:0 0 58px;
 border-radius:12px;overflow:hidden;background:var(--pSurface2)
}
.adminCategoryThumb img,.adminProductThumb img{
 width:100%;height:100%;object-fit:cover
}
.adminCategoryInfo,.adminProductInfo{
 flex:1;min-width:0
}
.adminCategoryInfo strong,.adminProductInfo strong{
 display:block;font-size:13px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.adminCategoryInfo span,.adminProductInfo span{
 display:block;margin-top:4px;color:var(--pMuted);font-size:9px
}

/* Paneller: sitenin paletini izler (açık / koyu) */

}

/* ---------- Tema düğmesi (Magic UI Animated Theme Toggler, kare) ---------- */
.themeToggle{position:relative;overflow:hidden}
.themeToggle svg{width:19px;height:19px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.themeToggle .icoSun{position:absolute;opacity:0;transform:rotate(-90deg) scale(.4)}
.themeToggle .icoMoon{opacity:1;transform:none}
html[data-mode="light"] .themeToggle .icoSun{opacity:1;transform:none}
html[data-mode="light"] .themeToggle .icoMoon{opacity:0;transform:rotate(90deg) scale(.4)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

.hidden{display:none!important}

.heroHidden{display:none!important}

.cloudState{
 display:flex;flex-direction:column;align-items:center;gap:10px;
 padding:90px 20px;text-align:center;color:#aaa
}
.cloudState h2{margin:0;color:#fff;font-size:20px}

.cloudSpinner{

 border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);
 animation:cloudSpin .8s linear infinite
}
@keyframes cloudSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cloudSpinner{animation-duration:2.4s}}

.loginInput{margin-top:9px;letter-spacing:normal;text-align:left;font-size:15px}
.adminLogin{position:relative}
.loginClose{

}

/* ===== Giriş kartı (Uiverse.io by Priyanshu02020, menu21 için uyarlandı) ===== */
.lg-container{
 --form-width:315px;
 --login-box-color:#272727;
 --input-color:#3a3a3a;
 --button-color:#373737;
 --footer-color:rgba(255,255,255,.5);
 display:flex;justify-content:center;align-items:center;
 position:relative;overflow:hidden;
 background:var(--login-box-color);
 border-radius:24px;
 width:min(calc(var(--form-width) + 2px),100%);
 padding:1px;
 z-index:8;
 box-shadow:
  0 4px 8px rgba(0,0,0,.2),
  0 8px 16px rgba(0,0,0,.2),
  0 0 8px rgba(255,255,255,.1),
  0 0 16px rgba(255,255,255,.08);
}
.lg-container::before{
 content:"";
 position:absolute;left:50%;top:50%;
 width:200%;aspect-ratio:1;
 z-index:-2;
 background:conic-gradient(from 45deg,transparent 75%,#fff,transparent 100%);
 transform:translate(-50%,-50%) rotate(0deg);
 animation:lgSpin 4s ease-in-out infinite;
}
@keyframes lgSpin{
 100%{transform:translate(-50%,-50%) rotate(360deg)}
}
.lg-box{
 position:relative;z-index:10;
 width:100%;
 background:var(--login-box-color);
 border-radius:23px;
 padding:28px;
 backdrop-filter:blur(15px);
 -webkit-backdrop-filter:blur(15px);
 box-shadow:
  inset 0 40px 60px -8px rgba(255,255,255,.12),
  inset 4px 0 12px -6px rgba(255,255,255,.12),
  inset 0 0 12px -4px rgba(255,255,255,.12);
}
.lg-form{
 display:flex;justify-content:center;align-items:center;
 flex-direction:column;gap:10px;
}
.lg-logo{
 width:65px;height:65px;flex:0 0 65px;
 background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(0,0,0,.2));
 box-shadow:8px 8px 16px rgba(0,0,0,.2),-8px -8px 16px rgba(255,255,255,.06);
 border-radius:20px;border:2px solid #fff;
 display:flex;justify-content:center;align-items:center;
 position:relative;
}
.lg-logo::before{
 content:"";position:absolute;bottom:10px;width:50%;height:20%;
 border-top-left-radius:40px;border-top-right-radius:40px;
 border-bottom-right-radius:20px;border-bottom-left-radius:20px;
 border:2.5px solid #fff;
}
.lg-logo::after{
 content:"";position:absolute;top:10px;width:30%;height:30%;
 border-radius:50%;border:2.5px solid #fff;
}
.lg-header{
 width:100%;text-align:center;font-size:24px;font-weight:bold;
 padding:6px;color:#fff;margin:0;line-height:1.25

  .orbit-3,

.adminNav{

.setupCard{
 padding:16px;margin-bottom:16px;border-radius:18px;
 border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
 background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,transparent),rgba(255,255,255,.01))
}
.setupTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.setupTop b{font-size:16px}
.setupTop span{color:var(--pMuted);font-size:11px;white-space:nowrap}
.setupMeter{height:7px;margin:12px 0;border-radius:9px;background:var(--pSurface2);overflow:hidden}
.setupMeter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.setupTasks{display:flex;flex-wrap:wrap;gap:7px}
.setupTasks span,.setupTasks button{
 min-height:36px;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:800;
 display:inline-flex;align-items:center
}
.setupTasks span{background:rgba(67,160,71,.12);color:#6fcf83}
html[data-mode="light"] .setupTasks span{color:#2e7d32}
.setupTasks button{border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);background:transparent;color:var(--accent2)}

/* rehberlik turu */
#nmTour{position:fixed;inset:0;z-index:600}
.tourSpot{
 position:fixed;border-radius:16px;pointer-events:none;
 box-shadow:0 0 0 2px var(--accent),0 0 0 9999px rgba(4,4,4,.72);
 transition:top .5s cubic-bezier(.65,0,.35,1),left .5s cubic-bezier(.65,0,.35,1),width .5s cubic-bezier(.65,0,.35,1),height .5s cubic-bezier(.65,0,.35,1)
}
.tourSpot::after{
 content:"";position:absolute;inset:-2px;border-radius:inherit;
 border:2px solid var(--accent2);animation:tourPulse 1.8s ease-out infinite
}
@keyframes tourPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.tourTip{
 position:fixed;width:min(320px,calc(100vw - 24px));padding:17px;
 border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:18px;
 background:#1b1a18;color:#f1ece2;box-shadow:0 22px 55px rgba(0,0,0,.6);
 transition:top .5s cubic-bezier(.65,0,.35,1),left .5s cubic-bezier(.65,0,.35,1);
 animation:qaIn .35s cubic-bezier(.2,.8,.2,1)
}
.tourStep{color:var(--accent2);font-size:11px;font-weight:800}
.tourTip h3{margin:4px 0 6px;font-size:19px;line-height:1.2}
.tourTip p{margin:0;color:#cfc8ba;font-size:13px;line-height:1.55}
.tourDots{display:flex;gap:5px;margin:14px 0}
.tourDots i{width:6px;height:6px;border-radius:9px;background:#3b3a37;transition:width .3s,background .3s}
.tourDots i.on{width:20px;background:var(--accent)}
.tourNav{display:flex;align-items:center;gap:8px}
.tourNav .tourSkip{margin-right:auto;border:0;background:none;color:#9b9486;font-size:12px;font-weight:800;padding:10px 0}
.tourNav .adminButton{min-height:42px;font-size:12px}
.tourNav .adminButton:not(.gold){background:#272624;border-color:#34332f;color:#f1ece2}
.tourWelcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(4,4,4,.78);backdrop-filter:blur(8px)}
.tourCard{
 width:min(400px,100%);padding:30px 22px 20px;text-align:center;border-radius:24px;
 border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:#1b1a18;color:#f1ece2;
 display:grid;justify-items:center;gap:10px;animation:tourCardIn .5s cubic-bezier(.2,.9,.3,1.25)
}
@keyframes tourCardIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.tourCard h3{margin:4px 0 0;font-size:26px}
.tourCard p{margin:0;color:#c9c1b2;font-size:14px;line-height:1.55}
.tourCard .adminButton{width:100%;min-height:50px;font-size:14px;margin-top:8px}
.tourLater{border:0;background:none;color:#9b9486;font-size:12px;font-weight:800;padding:8px}
.tourEmblem{width:86px;height:86px}
.tourEmblem circle{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:240;stroke-dashoffset:240;animation:tourDraw 1.1s .15s ease forwards}
.tourEmblem path{fill:var(--accent2);opacity:0;transform-origin:43px 43px;transform:scale(.4) rotate(-25deg);animation:tourPop .55s cubic-bezier(.2,.9,.3,1.4) forwards}
.tourEmblem path:nth-of-type(1){animation-delay:.55s}
.tourEmblem path:nth-of-type(2){animation-delay:.7s}
.tourEmblem path:nth-of-type(3){animation-delay:.85s}
@keyframes tourDraw{to{stroke-dashoffset:0}}
@keyframes tourPop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
 .tourSpot,.tourTip{transition:none}
 .tourSpot::after,.tourTip,.tourCard,.qaSheet{animation:none}
 .tourEmblem circle{animation:none;stroke-dashoffset:0}
 .tourEmblem path{animation:none;opacity:1;transform:none}
}


/* ── menü altı bilgi kartı ── */
.menuInfo{display:flex;flex-direction:column;gap:12px;margin-top:38px}
.infoCard{display:flex;align-items:center;gap:13px;padding:15px 14px;border-radius:var(--cardRadius);color:var(--text);text-decoration:none;
 border:1px solid rgba(255,255,255,.075);
 background:linear-gradient(145deg,rgba(30,30,32,var(--cardOpacity)),rgba(16,16,18,var(--cardOpacity)));
 box-shadow:0 14px 42px rgba(0,0,0,.24),0 1px 0 rgba(255,255,255,.025) inset;min-width:0}
.infoIcon{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--accent);
 background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.infoIcon svg{width:21px;height:21px}
.infoIcon.g{background:#fff;border-color:rgba(0,0,0,.06)}
.infoMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.infoMain small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.infoMain b{font-size:15px;font-weight:750;overflow-wrap:anywhere}
.infoSub{font-size:12px;color:var(--muted);line-height:1.4}
.openBadge{display:inline-flex;align-items:center;gap:7px}
.openBadge i,.heroStatus i{width:8px;height:8px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.18);flex:none}
.openBadge.on i,.heroStatus.on i{background:#30a46c;box-shadow:0 0 0 3px rgba(48,164,108,.2)}
.heroStatus{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:11.5px;font-weight:700;color:var(--muted)}
.hoursCard{display:block;padding:0}
.hoursCard summary{display:flex;align-items:center;gap:13px;padding:15px 14px;cursor:pointer;list-style:none;min-height:56px}
.hoursCard summary::-webkit-details-marker{display:none}
.infoChev{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);transition:transform .25s}
.infoChev svg{width:18px;height:18px}
.hoursCard[open] .infoChev{transform:rotate(180deg)}
.weekList{list-style:none;margin:0;padding:4px 14px 12px;border-top:1px solid rgba(255,255,255,.07)}
.weekList li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;font-size:13px;color:var(--muted);border-bottom:1px solid rgba(255,255,255,.05)}
.weekList li:last-child{border-bottom:0}
.weekList li.today{color:var(--text);font-weight:750}
.weekList em{font-style:normal;font-size:9.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-inline-start:6px}
.wifiRow{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:13px}
.wifiRow span{flex:none;color:var(--muted);font-size:12px;min-width:46px}
.wifiRow b{font-size:14px;font-weight:750;overflow-wrap:anywhere}
.copyBtn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;cursor:pointer;
 border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:transparent;color:var(--accent);font:inherit;font-size:12px;font-weight:800}
.copyBtn svg{width:16px;height:16px}
.copyBtn.done{background:var(--accent);color:var(--onAccent)}
.reviewCard{transition:transform .2s,border-color .2s}
.reviewCard:active{transform:scale(.99)}
.stars{flex:none;display:flex;color:#FBBC05}
.stars svg{width:13px;height:13px}
.infoBlock{padding:6px 2px 0}
.infoBlock.center{text-align:center}
.infoLabel{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.deliveryList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.deliveryBtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 12px;border-radius:14px;text-decoration:none;
 color:var(--text);font-size:13px;font-weight:750;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);text-align:center}
.deliveryBtn i{width:9px;height:9px;border-radius:50%;background:var(--dc);flex:none}
.socialList{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.socialBtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--text);
 border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
.socialBtn svg{width:19px;height:19px}
.vatNote{margin:6px 0 0;text-align:center;font-size:11px;color:var(--muted)}
.signature{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--pMuted);
 font-size:11px;letter-spacing:.02em;transition:color .2s,background .2s}
.signature:hover{color:var(--text);background:rgba(255,255,255,.04)}
.sigBrand{display:inline-flex;align-items:center;gap:6px;color:var(--text);opacity:.85}
.sigBrand b{font-family:"Geist",system-ui,sans-serif;font-weight:600;font-size:12.5px;letter-spacing:-.01em}
.sigMark{width:15px;height:15px}
@media(max-width:360px){.deliveryList{grid-template-columns:1fr}.copyBtn span{display:none}.copyBtn{width:44px;padding:0;justify-content:center}}
html[data-mode="light"] .infoCard{background:linear-gradient(145deg,rgba(255,255,255,var(--cardOpacity)),rgba(250,248,244,var(--cardOpacity)));
 border-color:rgba(0,0,0,.06);box-shadow:0 10px 28px rgba(0,0,0,.06)}
html[data-mode="light"] .infoIcon:not(.g){color:var(--accentInk);background:color-mix(in srgb,var(--accentInk) 9%,transparent);border-color:color-mix(in srgb,var(--accentInk) 16%,transparent)}
html[data-mode="light"] .weekList{border-top-color:rgba(0,0,0,.07)}
html[data-mode="light"] .weekList li{border-bottom-color:rgba(0,0,0,.05)}
html[data-mode="light"] .weekList em,html[data-mode="light"] .copyBtn{color:var(--accentInk)}
html[data-mode="light"] .copyBtn{border-color:color-mix(in srgb,var(--accentInk) 30%,transparent)}
html[data-mode="light"] .copyBtn.done{background:var(--accentInk);color:#fff}
html[data-mode="light"] .deliveryBtn,html[data-mode="light"] .socialBtn{background:#fff;border-color:rgba(0,0,0,.08)}
html[data-mode="light"] .signature:hover{background:rgba(0,0,0,.04)}

/* panel: haftalık saat düzenleyici */
.weekEdit{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.weekEditRow{display:grid;grid-template-columns:minmax(64px,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.weekEditRow>span{font-size:13px;font-weight:700}
.weekEditRow input[type="time"]{width:100%;min-width:0;min-height:44px;padding:8px;border-radius:12px;border:1px solid var(--pLine2);background:var(--pField);color:var(--pText);font:inherit;font-size:14px}
.weekOff{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--pMuted);min-height:44px;cursor:pointer}
.weekOff input{width:18px;height:18px;accent-color:var(--accent)}
@media(max-width:420px){.weekEditRow{grid-template-columns:1fr 1fr auto}.weekEditRow>span{grid-column:1/-1;margin-top:4px}}
</style>
